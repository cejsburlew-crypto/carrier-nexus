<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members — Carrier Nexus</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0f172a;--gunmetal:#1e293b;--gunmetal-light:#293548;--steel:#334155;
  --steel-blue:#2e6da4;--steel-blue-light:#3d87c8;--ice:#a8c4e0;
  --white:#f1f5f9;--white-pure:#f8fafc;--orange:#e8640a;--orange-bright:#ff7518;
  --text-muted:#64748b;--text-mid:#475569;--border:#334155;
  --red:#ef4444;--green:#22c55e;--yellow:#fbbf24;--pink:#e91e8c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--white);font-family:'Barlow',sans-serif;display:flex;min-height:100vh;}

/* ── MAIN ── */
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh;transition:margin-right .3s;}
.main.panel-open{margin-right:360px;}

/* ── TOPBAR ── */
.topbar{padding:18px 28px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.topbar-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:2px;text-transform:uppercase;}
.status-live{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--green);letter-spacing:1px;}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:var(--orange);color:#fff;}
.btn-primary:hover{background:var(--orange-bright);}
.btn-ghost{background:transparent;color:var(--text-mid);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--white);border-color:var(--steel-blue);}
.topbar-spacer{flex:1;}

/* ── CONTENT ── */
.content{padding:20px 28px 60px;}

/* ── STAT CARDS ── */
.stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:var(--gunmetal);border:1px solid var(--border);border-radius:10px;padding:16px 18px;cursor:pointer;transition:border-color .15s;}
.stat-card:hover{border-color:var(--steel-blue);}
.stat-card.active-filter{border-color:var(--orange);background:rgba(232,100,10,.08);}
.stat-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;}
.stat-val.green{color:var(--green);}
.stat-val.red{color:var(--red);}
.stat-val.yellow{color:var(--yellow);}
.stat-val.muted{color:var(--text-muted);}
.stat-val.pink{color:var(--pink);}

/* ── FILTER BAR ── */
.filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.filter-select{background:var(--gunmetal);border:1px solid var(--border);color:var(--white);padding:6px 12px;border-radius:6px;font-family:'Barlow',sans-serif;font-size:13px;cursor:pointer;outline:none;}
.filter-select:focus{border-color:var(--steel-blue);}
.search-input{background:var(--gunmetal);border:1px solid var(--border);color:var(--white);padding:6px 12px;border-radius:6px;font-family:'Barlow',sans-serif;font-size:13px;outline:none;width:220px;}
.search-input::placeholder{color:var(--text-muted);}
.search-input:focus{border-color:var(--steel-blue);}
.member-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:1px;margin-left:auto;}

/* ── MEMBER GRID ── */
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.member-card{background:var(--gunmetal);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s,background .15s;position:relative;}
.member-card:hover{border-color:var(--steel-blue);background:var(--gunmetal-light);}
.member-card.selected{border-color:var(--orange);background:rgba(232,100,10,.06);}

.mc-top{display:flex;align-items:flex-start;gap:12px;}
.mc-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;flex-shrink:0;}
.mc-info{flex:1;min-width:0;}
.mc-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mc-id{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:2px;letter-spacing:.5px;}
.mc-badges{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;}

/* ── BADGES ── */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.badge-admin    {background:rgba(232,100,10,.18);color:var(--orange);border:1px solid rgba(232,100,10,.3);}
.badge-approver {background:rgba(168,196,224,.12);color:var(--ice);border:1px solid rgba(168,196,224,.25);}
.badge-dispatcher{background:rgba(233,30,140,.12);color:var(--pink);border:1px solid rgba(233,30,140,.25);}
.badge-owner_operator{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.25);}
.badge-driver   {background:rgba(46,109,164,.15);color:#60a5fa;border:1px solid rgba(46,109,164,.3);}
.badge-staff    {background:rgba(251,191,36,.12);color:var(--yellow);border:1px solid rgba(251,191,36,.25);}
.badge-status-active    {background:rgba(34,197,94,.1);color:var(--green);}
.badge-status-inactive  {background:rgba(100,116,139,.1);color:var(--text-muted);}
.badge-status-terminated{background:rgba(239,68,68,.1);color:var(--red);}
.badge-status-pending   {background:rgba(251,191,36,.1);color:var(--yellow);}
.badge-status-pending_rejoin{background:rgba(233,30,140,.1);color:var(--pink);}

/* MC/DOT info row */
.mc-authority{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;}
.authority-chip{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ice);background:rgba(168,196,224,.08);border:1px solid rgba(168,196,224,.15);padding:2px 8px;border-radius:3px;letter-spacing:.5px;}

/* ── SIDE DETAIL PANEL ── */
.detail-panel{position:fixed;top:0;right:-360px;width:360px;height:100vh;background:var(--gunmetal);border-left:1px solid var(--border);z-index:200;display:flex;flex-direction:column;transition:right .3s;overflow-y:auto;}
.detail-panel.open{right:0;}
.dp-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--gunmetal);z-index:1;}
.dp-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;}
.dp-close{background:none;border:1px solid var(--border);color:var(--text-muted);width:28px;height:28px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s;}
.dp-close:hover{border-color:var(--red);color:var(--red);}
.dp-body{padding:20px;}
.dp-avatar-row{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
.dp-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;flex-shrink:0;}
.dp-name{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;}
.dp-member-id{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:3px;}

.dp-section{margin-bottom:18px;}
.dp-section-title{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.dp-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(51,65,85,.5);}
.dp-row:last-child{border-bottom:none;}
.dp-lbl{font-size:11px;color:var(--text-muted);}
.dp-val{font-size:12px;font-weight:500;text-align:right;max-width:200px;word-break:break-word;}
.dp-val.mono{font-family:'JetBrains Mono',monospace;font-size:11px;}

.dp-actions{padding:16px 20px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;background:var(--gunmetal);}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty-state-icon{font-size:40px;margin-bottom:12px;opacity:.4;}
.empty-state-text{font-size:14px;}
</style>

<style id="nexus-responsive-fix">
*{box-sizing:border-box;}
body{overflow-x:hidden;}
@media(max-width:768px){
  .sidebar{display:none!important;}
  .main,.content-area,.page-content,.content{margin-left:0!important;padding:12px!important;}
  .topbar,.top-bar{padding:8px 12px!important;}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .kpi-row,.kpi-grid,.stat-row{grid-template-columns:1fr 1fr!important;gap:8px!important;}
  .panels-row,.panel-grid{grid-template-columns:1fr!important;}
  input,select,textarea{font-size:16px!important;min-height:44px!important;}
  button,.btn{min-height:44px!important;font-size:14px!important;}
  h1{font-size:20px!important;}
  h2{font-size:16px!important;}
  .modal-content,.modal-body{width:95vw!important;max-width:95vw!important;margin:10px auto!important;}
  .form-grid,.field-row{grid-template-columns:1fr!important;}
}
@media(max-width:480px){
  .kpi-row,.kpi-grid,.stat-row{grid-template-columns:1fr!important;}
  .topbar-actions,.header-actions{gap:6px!important;}
  .btn-sm{padding:6px 10px!important;font-size:13px!important;}
}
</style>
</head>
<body>
<script src="nexus-sidebar.js"></script>
<div class="main" id="main-content">
  <div class="topbar">
    <div class="topbar-title">MEMBERS</div>
    <div class="status-live"><span class="status-dot"></span>LIVE</div>
    <div class="topbar-spacer"></div>
    <button class="btn btn-ghost" onclick="exportRoster()">Export</button>
    <button class="btn btn-primary" onclick="openInviteModal()">+ Invite Member</button>
  </div>

  <div class="content">

    <!-- STAT CARDS -->
    <div class="stat-row" id="stat-row">
      <div class="stat-card" id="sc-active" onclick="applyStatusFilter('active',this)">
        <div class="stat-label">Active</div>
        <div class="stat-val green" id="cnt-active">—</div>
      </div>
      <div class="stat-card" id="sc-inactive" onclick="applyStatusFilter('inactive',this)">
        <div class="stat-label">Inactive</div>
        <div class="stat-val muted" id="cnt-inactive">—</div>
      </div>
      <div class="stat-card" id="sc-terminated" onclick="applyStatusFilter('terminated',this)">
        <div class="stat-label">Terminated</div>
        <div class="stat-val red" id="cnt-terminated">—</div>
      </div>
      <div class="stat-card" id="sc-pending" onclick="applyStatusFilter('pending',this)">
        <div class="stat-label">Pending</div>
        <div class="stat-val yellow" id="cnt-pending">—</div>
      </div>
      <div class="stat-card" id="sc-rejoin" onclick="applyStatusFilter('pending_rejoin',this)">
        <div class="stat-label">Re-Join Requests</div>
        <div class="stat-val pink" id="cnt-rejoin">—</div>
      </div>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-bar">
      <select class="filter-select" id="type-filter" onchange="renderGrid()">
        <option value="">All Types</option>
        <option value="admin">Admin</option>
        <option value="approver">Approver</option>
        <option value="dispatcher">Dispatcher</option>
        <option value="owner_operator">Owner Operator</option>
        <option value="driver">Driver</option>
        <option value="staff">Staff</option>
      </select>
      <input class="search-input" id="search-input" type="text" placeholder="Search members…" oninput="renderGrid()">
      <span class="member-count" id="member-count">— MEMBERS</span>
    </div>

    <!-- MEMBER GRID -->
    <div class="member-grid" id="member-grid"></div>

  </div>
</div>

<!-- SIDE DETAIL PANEL -->
<div class="detail-panel" id="detail-panel">
  <div class="dp-header">
    <span class="dp-title">Member Detail</span>
    <button class="dp-close" onclick="closePanel()" title="Close">✕</button>
  </div>
  <div class="dp-body" id="dp-body">
    <!-- populated by JS -->
  </div>
  <div class="dp-actions">
    <button class="btn btn-ghost" onclick="copyInviteLink()" id="dp-invite-btn">📋 Copy Invite Link</button>
    <button class="btn btn-ghost" onclick="closePanel()">Close</button>
  </div>
</div>

<script src="nexus-config.js"></script>
<script>
// ─── Helpers ─────────────────────────────────────────────────────────────────
function fmtDate(d){
  if(!d) return '—';
  const [y,m,day] = d.split('-');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(m,10)-1]+' '+parseInt(day,10)+', '+y;
}

// Strip the .0 version suffix from memberId for display
function displayId(memberId){
  return memberId ? memberId.replace(/\.0$/, '') : '—';
}

// Type → human-readable label
function typeLabel(t){
  const map={admin:'Admin',approver:'Approver',dispatcher:'Dispatcher',
    owner_operator:'Owner Op',driver:'Driver',staff:'Staff'};
  return map[t]||t||'—';
}

// Avatar initials + background
const AVATAR_COLORS={
  admin:'#4a1a0a',approver:'#0a1a2f',dispatcher:'#2d0a1f',
  owner_operator:'#0a2a1a',driver:'#0a1a3a',staff:'#2a2a0a'
};
const AVATAR_TEXT_COLORS={
  admin:var_or('#e8640a'),approver:var_or('#a8c4e0'),dispatcher:var_or('#e91e8c'),
  owner_operator:var_or('#22c55e'),driver:var_or('#60a5fa'),staff:var_or('#fbbf24')
};
function var_or(c){return c;}
function initials(m){
  return ((m.firstName||'')[0]||'').toUpperCase()+((m.lastName||'')[0]||'').toUpperCase();
}

// ─── State ────────────────────────────────────────────────────────────────────
let _allMembers = [];       // member profiles
let _companyMap = {};       // memberId → company membership record
let _statusFilter = '';     // active stat card filter
let _selectedId  = null;    // selected member ID

// ─── Load data ────────────────────────────────────────────────────────────────
function loadData(){
  // Pull from localStorage (seeded by nexus-config.js), fall back to seeds
  try {
    _allMembers = JSON.parse(localStorage.getItem('nexus_member_profiles')||'[]');
  } catch(e){ _allMembers = []; }
  if(!_allMembers.length && window.NEXUS_SEED_MEMBERS){
    _allMembers = window.NEXUS_SEED_MEMBERS;
  }

  let companyMembers = [];
  try {
    companyMembers = JSON.parse(localStorage.getItem('nexus_company_members')||'[]');
  } catch(e){ companyMembers = []; }
  if(!companyMembers.length && window.NEXUS_SEED_COMPANY_MEMBERS){
    companyMembers = window.NEXUS_SEED_COMPANY_MEMBERS;
  }
  _companyMap = {};
  companyMembers.forEach(function(cm){ _companyMap[cm.memberId] = cm; });
}

// ─── Stat cards ───────────────────────────────────────────────────────────────
function updateStats(){
  const counts={active:0,inactive:0,terminated:0,pending:0,pending_rejoin:0};
  _allMembers.forEach(function(m){
    const cm = _companyMap[m.memberId];
    const status = cm ? cm.status : 'active';
    if(counts[status]!==undefined) counts[status]++;
  });
  document.getElementById('cnt-active').textContent    = counts.active;
  document.getElementById('cnt-inactive').textContent  = counts.inactive;
  document.getElementById('cnt-terminated').textContent= counts.terminated;
  document.getElementById('cnt-pending').textContent   = counts.pending;
  document.getElementById('cnt-rejoin').textContent    = counts.pending_rejoin;
}

function applyStatusFilter(status, el){
  if(_statusFilter===status){
    // Toggle off
    _statusFilter='';
    document.querySelectorAll('.stat-card').forEach(function(c){c.classList.remove('active-filter');});
  } else {
    _statusFilter=status;
    document.querySelectorAll('.stat-card').forEach(function(c){c.classList.remove('active-filter');});
    el.classList.add('active-filter');
  }
  renderGrid();
}

// ─── Badge HTML ───────────────────────────────────────────────────────────────
function typeBadge(type){
  return '<span class="badge badge-'+type+'">'+typeLabel(type)+'</span>';
}
function statusBadge(status){
  const labels={active:'Active',inactive:'Inactive',terminated:'Terminated',
    pending:'Pending',pending_rejoin:'Re-Join'};
  return '<span class="badge badge-status-'+status+'">'+(labels[status]||status)+'</span>';
}

// ─── Render grid ─────────────────────────────────────────────────────────────
function renderGrid(){
  const typeVal = document.getElementById('type-filter').value.toLowerCase();
  const query   = document.getElementById('search-input').value.toLowerCase().trim();

  let visible = _allMembers.filter(function(m){
    const cm      = _companyMap[m.memberId];
    const status  = cm ? cm.status : 'active';
    const mtype   = (m.type||'').toLowerCase();

    if(_statusFilter && status !== _statusFilter) return false;
    if(typeVal       && mtype  !== typeVal)        return false;
    if(query){
      const full = ((m.firstName||'')+' '+(m.lastName||'')+' '+(m.memberId||'')+' '+mtype).toLowerCase();
      if(!full.includes(query)) return false;
    }
    return true;
  });

  document.getElementById('member-count').textContent = visible.length+' MEMBER'+(visible.length!==1?'S':'');

  if(!visible.length){
    document.getElementById('member-grid').innerHTML =
      '<div class="empty-state" style="grid-column:1/-1;">' +
        '<div class="empty-state-icon">👥</div>' +
        '<div class="empty-state-text">No members match your filters.</div>' +
      '</div>';
    return;
  }

  document.getElementById('member-grid').innerHTML = visible.map(function(m){
    const cm      = _companyMap[m.memberId];
    const status  = cm ? cm.status : 'active';
    const type    = m.type||'driver';
    const bg      = AVATAR_COLORS[type]||'#1e293b';
    const tc      = AVATAR_TEXT_COLORS[type]||'#a8c4e0';
    const ini     = initials(m);
    const fullName= (m.firstName||'')+' '+(m.lastName||'');
    const dispId  = displayId(m.memberId);
    const isSelected = _selectedId === m.memberId;

    let authorityHTML='';
    if(m.mc||m.dot){
      authorityHTML='<div class="mc-authority">';
      if(m.mc) authorityHTML+='<span class="authority-chip">'+m.mc+'</span>';
      if(m.dot) authorityHTML+='<span class="authority-chip">'+m.dot+'</span>';
      authorityHTML+='</div>';
    }

    return '<div class="member-card'+(isSelected?' selected':'')+'" onclick="selectMember(\''+m.memberId+'\')">' +
      '<div class="mc-top">' +
        '<div class="mc-avatar" style="background:'+bg+';color:'+tc+'">'+ini+'</div>' +
        '<div class="mc-info">' +
          '<div class="mc-name">'+fullName+'</div>' +
          '<div class="mc-id">'+dispId+' &nbsp;·&nbsp; Joined '+fmtDate(cm?cm.joinedAt:m.createdAt)+'</div>' +
          '<div class="mc-badges">' +
            typeBadge(type) +
            statusBadge(status) +
          '</div>' +
        '</div>' +
      '</div>' +
      authorityHTML +
    '</div>';
  }).join('');
}

// ─── Select / panel ───────────────────────────────────────────────────────────
function selectMember(memberId){
  if(_selectedId===memberId){
    closePanel();
    return;
  }
  _selectedId = memberId;
  renderGrid(); // re-render to show selected state

  const m  = _allMembers.find(function(x){return x.memberId===memberId;});
  if(!m) return;
  const cm = _companyMap[m.memberId];
  const status  = cm ? cm.status : 'active';
  const type    = m.type||'driver';
  const bg      = AVATAR_COLORS[type]||'#1e293b';
  const tc      = AVATAR_TEXT_COLORS[type]||'#a8c4e0';
  const fullName= (m.firstName||'')+' '+(m.lastName||'');
  const dispId  = displayId(m.memberId);

  let authorityRows='';
  if(m.mc) authorityRows+='<div class="dp-row"><span class="dp-lbl">MC#</span><span class="dp-val mono">'+m.mc+'</span></div>';
  if(m.dot) authorityRows+='<div class="dp-row"><span class="dp-lbl">DOT#</span><span class="dp-val mono">'+m.dot+'</span></div>';

  document.getElementById('dp-body').innerHTML =
    '<div class="dp-avatar-row">' +
      '<div class="dp-avatar" style="background:'+bg+';color:'+tc+'">'+initials(m)+'</div>' +
      '<div>' +
        '<div class="dp-name">'+fullName+'</div>' +
        '<div class="dp-member-id">'+dispId+'</div>' +
        '<div style="margin-top:6px;display:flex;gap:6px;">'+typeBadge(type)+statusBadge(status)+'</div>' +
      '</div>' +
    '</div>' +
    '<div class="dp-section">' +
      '<div class="dp-section-title">Contact</div>' +
      '<div class="dp-row"><span class="dp-lbl">Email</span><span class="dp-val mono">'+(m.email||'—')+'</span></div>' +
      '<div class="dp-row"><span class="dp-lbl">Phone</span><span class="dp-val">'+(m.phone||'—')+'</span></div>' +
    '</div>' +
    '<div class="dp-section">' +
      '<div class="dp-section-title">Membership</div>' +
      '<div class="dp-row"><span class="dp-lbl">Member ID</span><span class="dp-val mono">'+dispId+'</span></div>' +
      '<div class="dp-row"><span class="dp-lbl">Status</span><span class="dp-val">'+statusBadge(status)+'</span></div>' +
      '<div class="dp-row"><span class="dp-lbl">Type</span><span class="dp-val">'+typeBadge(type)+'</span></div>' +
      '<div class="dp-row"><span class="dp-lbl">Joined</span><span class="dp-val">'+fmtDate(cm?cm.joinedAt:m.createdAt)+'</span></div>' +
      '<div class="dp-row"><span class="dp-lbl">Profile Created</span><span class="dp-val">'+fmtDate(m.createdAt)+'</span></div>' +
      (cm&&cm.deactivatedAt?'<div class="dp-row"><span class="dp-lbl">Deactivated</span><span class="dp-val" style="color:var(--yellow)">'+fmtDate(cm.deactivatedAt)+'</span></div>':'') +
      (cm&&cm.terminatedAt?'<div class="dp-row"><span class="dp-lbl">Terminated</span><span class="dp-val" style="color:var(--red)">'+fmtDate(cm.terminatedAt)+'</span></div>':'') +
      (cm&&cm.approvedBy?'<div class="dp-row"><span class="dp-lbl">Approved By</span><span class="dp-val mono">'+displayId(cm.approvedBy)+'</span></div>':'') +
      (cm&&cm.notes?'<div class="dp-row"><span class="dp-lbl">Notes</span><span class="dp-val">'+cm.notes+'</span></div>':'') +
    '</div>' +
    (authorityRows?'<div class="dp-section"><div class="dp-section-title">Operating Authority</div>'+authorityRows+'</div>':'');

  openPanel();
}

function openPanel(){
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('main-content').classList.add('panel-open');
}

function closePanel(){
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('main-content').classList.remove('panel-open');
  _selectedId = null;
  renderGrid();
}

// ─── Export ───────────────────────────────────────────────────────────────────
function exportRoster(){
  const rows = [['Member ID','Name','Type','Status','Email','MC#','DOT#','Joined']];
  _allMembers.forEach(function(m){
    const cm = _companyMap[m.memberId];
    rows.push([
      displayId(m.memberId),
      (m.firstName||'')+' '+(m.lastName||''),
      m.type||'',
      cm?cm.status:'active',
      m.email||'',
      m.mc||'',
      m.dot||'',
      cm?cm.joinedAt:m.createdAt||''
    ]);
  });
  const csv = rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download = 'carrier-nexus-members-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

// ─── Invite link ─────────────────────────────────────────────────────────────
function openInviteModal(){
  alert('Invite flow: generate a set-password link for the user. Use Admin > Users to create the account first, then share the invite link.');
}

function copyInviteLink(){
  if(!_selectedId) return;
  const m = _allMembers.find(function(x){return x.memberId===_selectedId;});
  if(!m||!m.email) return;
  const link = window.location.origin+'/set-password.html?email='+encodeURIComponent(m.email);
  navigator.clipboard.writeText(link).then(function(){
    const btn=document.getElementById('dp-invite-btn');
    btn.textContent='✅ Copied!';
    setTimeout(function(){btn.textContent='📋 Copy Invite Link';},2000);
  });
}

// ─── Close panel on Escape ────────────────────────────────────────────────────
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePanel();});

// ─── Init ─────────────────────────────────────────────────────────────────────
loadData();
updateStats();
renderGrid();
</script>
