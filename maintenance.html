<!DOCTYPE html>
<html lang="en">
<head>
<style>
      /* === NEXUS GLOBAL FONT STANDARDS: min 10pt (13px) Arial === */
      body { font-family: Arial, sans-serif; }
      body *:not(i):not(.fa):not([class*="fa-"]):not([class*="icon"]) {
        font-family: inherit;
      }html{visibility:hidden}</style>
<script>
/* NEXUS AUTH GUARD */
(function(){try{var s=localStorage.getItem('nexus_session');if(!s)throw 0;var d=JSON.parse(s);if(!d||!d.role)throw 0;document.documentElement.style.visibility='visible';}catch(e){document.documentElement.style.visibility='hidden';window.location.replace('login.html?return='+encodeURIComponent(location.pathname+location.search));}})();
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Maintenance — Carrier Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
      --bg: #f0f2f5;
      --panel: #ffffff;
      --panel2: #f8f9fa;
      --border: #d0d7de;
      --text: #111827;
      --mid: #4b5563;
      --blue: #1d4ed8;
      --green: #15803d;
      --yellow: #a16207;
      --red: #dc2626;
      --orange: #c2410c;
    }
  :root{--sb:#000;--orange:#e8640a;--pink:#e91e8c;--blue:#2e6da4;--green:#22c55e;--red:#ef4444;--yellow:#fbbf24;--border:#e2e8f0;--muted:#64748b;--mid:#475569;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f1f5f9;color:#0f172a;font-family:'Barlow',sans-serif;display:flex;min-height:100vh;}
/* SIDEBAR */
.sidebar{width:220px;min-height:100vh;background:#000;border-right:1px solid #1a1a1a;display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;}
.sidebar-logo{padding:16px;display:flex;align-items:center;gap:10px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.07);}
.sidebar-logo .logo-hex svg{width:36px;height:36px;display:block;}
.sidebar-logo .logo-text{display:flex;flex-direction:column;gap:2px;}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;letter-spacing:2px;color:#fff;}
.sub{font-family:'JetBrains Mono',monospace;font-size:13px;color:rgba(255,255,255,0.45);letter-spacing:1px;}
.sidebar-section{padding:12px 0 4px;}
.sidebar-section-label{padding:0 16px 6px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:rgba(255,255,255,0.3);letter-spacing:1.5px;text-transform:uppercase;display:block;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:7px 16px;text-decoration:none;color:#a0aec0;font-size:13px;border-left:3px solid transparent;transition:all .15s;}
.sidebar-link:hover{background:rgba(233,30,140,0.14);border-left-color:#c2185b;color:#fff;}
.sidebar-link.active{background:rgba(233,30,140,0.22);border-left:3px solid #e91e8c;color:#fff;}
.sidebar-link svg{width:14px;height:14px;flex-shrink:0;opacity:.7;}
.sidebar-link.active svg{opacity:1;}
.nav-badge{margin-left:auto;background:#e91e8c;color:#fff;font-family:'JetBrains Mono',monospace;font-size:13px;padding:2px 6px;border-radius:10px;}
.sidebar-spacer{flex:1;}
.sidebar-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,0.07);}
.user-name{font-family:'JetBrains Mono',monospace;font-size:13px;color:rgba(255,255,255,0.6);font-weight:500;}
.user-role{font-family:'JetBrains Mono',monospace;font-size:13px;color:rgba(255,255,255,0.3);margin-top:2px;}
/* MAIN */
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{height:56px;background:linear-gradient(135deg,#000 0%,#6b0000 45%,#c2185b 80%,#e91e8c 100%);border-bottom:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;padding:0 28px;gap:16px;position:sticky;top:0;z-index:50;}
.topbar-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;letter-spacing:2px;color:#fff;flex:1;}
.content{padding:24px 28px 48px;}
/* KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 20px;}
.kpi-label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;color:#0f172a;line-height:1;}
.kpi-sub{font-size:13px;color:var(--blue);margin-top:4px;}
/* PANEL */
.panel{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.panel-head{padding:14px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.panel-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:#0f172a;letter-spacing:.06em;text-transform:uppercase;}
/* TABLE */
table{width:100%;border-collapse:collapse;}
th{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;text-align:left;background:#f8fafc;border-bottom:1px solid var(--border);}
td{padding:11px 16px;font-size:13px;color:#0f172a;border-bottom:1px solid #f8fafc;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#f8fafc;}
/* BADGES */
.badge{font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.04em;white-space:nowrap;display:inline-block;}
.badge-green{background:#dcfce7;color:#15803d;}
.badge-red{background:#fee2e2;color:#b91c1c;}
.badge-yellow{background:#fef9c3;color:#a16207;}
.badge-blue{background:#dbeafe;color:#1d4ed8;}
.badge-gray{background:#f1f5f9;color:var(--mid);}
.badge-orange{background:#ffedd5;color:#c2410c;}
.badge-purple{background:#ede9fe;color:#6d28d9;}
/* BTNS */
.btn{padding:7px 16px;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.8px;cursor:pointer;border:1px solid var(--border);background:#fff;color:#334155;transition:all .15s;}
.btn:hover{background:#f1f5f9;}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-primary:hover{background:#1d5a8a;}
.btn-orange{background:#1d4ed8;color:#fff;border-color:var(--orange);}
.btn-sm{padding:5px 12px;font-size:13px;}
.mono{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--blue);}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(248, 249, 250, 1),0.55);z-index:9000;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;border-radius:10px;width:92%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.modal-hdr{background:linear-gradient(135deg,#000 0%,#6b0000 45%,#c2185b 80%,#e91e8c 100%);padding:18px 24px;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:space-between;}
.modal-hdr-title{color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:2px;}
.modal-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;}
.modal-body{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group.full{grid-column:1/3;}
.form-label{font-size:13px;font-weight:600;color:var(--mid);text-transform:uppercase;letter-spacing:1px;}
.form-input{width:100%;padding:9px 12px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:14px;color:#0f172a;font-family:'Barlow',sans-serif;}
.form-input:focus{outline:none;border-color:var(--blue);}
.modal-footer{padding:0 24px 24px;display:flex;gap:10px;justify-content:flex-end;}
/* MOBILE */
.mobile-nav{display:none;}
@media(max-width:768px){
  .sidebar{display:none;}
  .main{margin-left:0;}
  .content{padding:14px 12px 80px;}
  .kpi-row{grid-template-columns:1fr 1fr;gap:10px;}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:60px;background:rgba(248, 249, 250, 1),0.97);border-top:1px solid rgba(233,30,140,0.2);justify-content:space-around;align-items:center;z-index:200;}
  .mn-tab{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:rgba(168,196,224,0.45);font-size:13px;font-family:'JetBrains Mono',monospace;flex:1;padding:6px 0;}
  .mn-tab svg{width:20px;height:20px;opacity:.6;}
  .mn-tab.active{color:#e91e8c;}
  .mn-tab.active svg{opacity:1;}
}
</style>
</head>
<body>
<script src="nexus-sidebar.js"></script>
    <script src="nexus-isolation.js"></script>
<div class="main">
  <div class="topbar">
    <div class="topbar-title">MAINTENANCE LOG</div>
    <div style="display:flex;gap:10px;align-items:center;">
      <div style="display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:13px;color:#22c55e;letter-spacing:1px;"><span style="width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite;display:inline-block;"></span>LIVE</div>
      <button class="btn btn-orange" onclick="openMaintModal()">+ Add Work Order</button>
    </div>
  </div>
  <div class="content">
    
<div class="kpi-row">
  <div class="kpi-card"><div class="kpi-label">Open Work Orders</div><div class="kpi-val" id="kpi-open" style="color:#ef4444;">0</div><div class="kpi-sub">Awaiting completion</div></div>
  <div class="kpi-card"><div class="kpi-label">This Month Spend</div><div class="kpi-val" id="kpi-spend">$0</div><div class="kpi-sub">Repairs &amp; service</div></div>
  <div class="kpi-card"><div class="kpi-label">Completed</div><div class="kpi-val" id="kpi-done" style="color:#22c55e;">0</div><div class="kpi-sub">All time</div></div>
  <div class="kpi-card"><div class="kpi-label">YTD Total</div><div class="kpi-val" id="kpi-ytd">$0</div><div class="kpi-sub">Year to date</div></div>
</div>

<div class="panel">
  <div class="panel-head">
    <span class="panel-title">Work Orders &amp; Repair Log</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <select id="mf-unit" onchange="renderMaint()" class="btn btn-sm">
        <option value="">All Units</option>
        <option>01</option><option>03</option><option>04</option><option>05</option><option>06</option><option>09</option>
        <option>T01</option><option>T02</option><option>J01</option><option>S01</option>
      </select>
      <select id="mf-type" onchange="renderMaint()" class="btn btn-sm">
        <option value="">All Types</option>
        <option>PM Service</option><option>Engine</option><option>Transmission</option><option>Brakes</option>
        <option>Electrical</option><option>Suspension</option><option>Tires</option><option>Body/Frame</option>
        <option>Trailer Repair</option><option>DOT Inspection</option><option>Other</option>
      </select>
      <select id="mf-status" onchange="renderMaint()" class="btn btn-sm">
        <option value="">All Statuses</option><option>Open</option><option>In Progress</option><option>Completed</option><option>Pending Parts</option>
      </select>
    </div>
  </div>
  <table>
    <thead><tr><th>Date</th><th>WO #</th><th>Unit</th><th>Type</th><th>Description</th><th>Shop / Mechanic</th><th style="text-align:right">Cost</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="maint-tbody"></tbody>
  </table>
</div>

<div class="modal-overlay" id="maint-modal">
  <div class="modal-box" style="max-width:600px;">
    <div class="modal-hdr"><span class="modal-hdr-title" id="maint-modal-title">ADD WORK ORDER</span><button class="modal-close" onclick="closeMaintModal()">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="maint-edit-id">
      <div class="form-group"><label class="form-label">Date *</label><input type="date" id="m-date" class="form-input" required></div>
      <div class="form-group"><label class="form-label">WO # *</label><input type="text" id="m-wo" class="form-input" placeholder="WO-2026-001" required></div>
      <div class="form-group"><label class="form-label">Unit *</label>
        <select id="m-unit" class="form-input">
          <option>01 — Peterbilt 379</option><option>03 — Freightliner Cascadia</option>
          <option>04 — Kenworth T680</option><option>05 — Peterbilt 389</option>
          <option>06 — Freightliner Cascadia</option><option>09 — Kenworth T800</option>
          <option>T01 — Trailer</option><option>T02 — Trailer</option><option>J01 — Jeep</option><option>S01 — Spreader</option>
        </select></div>
      <div class="form-group"><label class="form-label">Repair Type *</label>
        <select id="m-type" class="form-input">
          <option>PM Service</option><option>Engine</option><option>Transmission</option><option>Brakes</option>
          <option>Electrical</option><option>Suspension</option><option>Tires</option><option>Body/Frame</option>
          <option>Trailer Repair</option><option>DOT Inspection</option><option>Other</option>
        </select></div>
      <div class="form-group full"><label class="form-label">Description *</label><input type="text" id="m-desc" class="form-input" placeholder="Describe the repair or service" required></div>
      <div class="form-group"><label class="form-label">Shop / Mechanic</label><input type="text" id="m-shop" class="form-input" placeholder="Truck Parts Outlet, Mobile Mechanic…"></div>
      <div class="form-group"><label class="form-label">Cost</label><input type="number" id="m-cost" class="form-input" step="0.01" placeholder="0.00"></div>
      <div class="form-group"><label class="form-label">Odometer</label><input type="number" id="m-odo" class="form-input" placeholder="Miles at service"></div>
      <div class="form-group"><label class="form-label">Status</label>
        <select id="m-status" class="form-input">
          <option>Open</option><option>In Progress</option><option>Completed</option><option>Pending Parts</option>
        </select></div>
      <div class="form-group full"><label class="form-label">Parts Used / Notes</label><input type="text" id="m-notes" class="form-input" placeholder="Part numbers, warranty info, etc."></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeMaintModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveMaint()">SAVE WORK ORDER</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="nexus-config.js?v=5"></script>
<script src="nexus-db.js?v=3"></script>
<script>
const mStatusBadge={Open:'badge-red','In Progress':'badge-yellow',Completed:'badge-green','Pending Parts':'badge-orange'};
const mTypeColor={Engine:'badge-red',Transmission:'badge-red',Brakes:'badge-orange','PM Service':'badge-blue',Electrical:'badge-yellow',Suspension:'badge-orange',Tires:'badge-gray','Body/Frame':'badge-gray','Trailer Repair':'badge-purple','DOT Inspection':'badge-blue',Other:'badge-gray'};
let _maintCache=[];
async function renderMaint(){
  _maintCache = await NexusDB.Maintenance.list();
  const u=document.getElementById('mf-unit').value,t=document.getElementById('mf-type').value,s=document.getElementById('mf-status').value;
  const all=_maintCache;
  const now=new Date(),yr=now.getFullYear(),mo=now.getMonth();
  const data=all.filter(m=>(u?m.unit.startsWith(u):true)&&(t?(m.repair_type||m.type)===t:true)&&(s?m.status===s:true)).sort((a,b)=>b.date.localeCompare(a.date));
  const tbody=document.getElementById('maint-tbody');
  tbody.innerHTML=data.length?data.map(m=>`<tr>
    <td class="mono">${m.date}</td>
    <td class="mono" style="font-weight:700;">${m.wo_number||m.wo}</td>
    <td><span class="badge badge-blue" style="font-size:13px;">Unit ${(m.unit||'').split(' ')[0]}</span></td>
    <td><span class="badge ${mTypeColor[m.type]||'badge-gray'}" style="font-size:13px;">${m.repair_type||m.type}</span></td>
    <td style="max-width:200px;">${m.description||m.desc}</td>
    <td>${m.vendor||m.shop||'—'}</td>
    <td style="text-align:right;font-weight:700;">${m.cost?'$'+Number(m.cost).toLocaleString('en-US',{minimumFractionDigits:2}):'—'}</td>
    <td><span class="badge ${mStatusBadge[m.status]||'badge-gray'}">${m.status}</span></td>
    <td><button class="btn btn-sm" onclick="editMaint('${m.id}')">Edit</button> <button class="btn btn-sm" style="color:#ef4444" onclick="delMaint('${m.id}')">Del</button></td>
  </tr>`).join(''):'<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:32px;">No work orders yet. Click + Add Work Order to start.</td></tr>';
  // KPIs
  const thisMonthSpend=all.filter(m=>{const d=new Date(m.date);return d.getFullYear()===yr&&d.getMonth()===mo;}).reduce((s,m)=>s+Number(m.cost||0),0);
  const ytd=all.filter(m=>new Date(m.date).getFullYear()===yr).reduce((s,m)=>s+Number(m.cost||0),0);
  const fmt=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2});
  document.getElementById('kpi-open').textContent=all.filter(m=>m.status==='Open'||m.status==='In Progress'||m.status==='Pending Parts').length;
  document.getElementById('kpi-spend').textContent=fmt(thisMonthSpend);
  document.getElementById('kpi-done').textContent=all.filter(m=>m.status==='Completed').length;
  document.getElementById('kpi-ytd').textContent=fmt(ytd);
}
async function openMaintModal(){document.getElementById('maint-modal-title').textContent='ADD WORK ORDER';document.getElementById('maint-edit-id').value='';document.getElementById('m-date').value=new Date().toISOString().split('T')[0];document.getElementById('m-wo').value=await NexusDB.Maintenance.nextWO();document.getElementById('m-desc').value='';document.getElementById('m-shop').value='';document.getElementById('m-cost').value='';document.getElementById('m-odo').value='';document.getElementById('m-notes').value='';document.getElementById('m-status').value='Open';document.getElementById('maint-modal').classList.add('open');}
function closeMaintModal(){document.getElementById('maint-modal').classList.remove('open');}
async function saveMaint(){const d=document.getElementById('m-date').value,w=document.getElementById('m-wo').value,desc=document.getElementById('m-desc').value;if(!d||!w||!desc){alert('Date, WO # and Description required.');return;}const editId=document.getElementById('maint-edit-id').value;const rec={date:d,wo_number:w,unit:document.getElementById('m-unit').value,repair_type:document.getElementById('m-type').value,description:desc,vendor:document.getElementById('m-shop').value,cost:document.getElementById('m-cost').value||null,odometer:document.getElementById('m-odo').value||null,status:document.getElementById('m-status').value,notes:document.getElementById('m-notes').value};if(editId){await NexusDB.Maintenance.update(editId,rec);}else{await NexusDB.Maintenance.create(rec);}closeMaintModal();await renderMaint();}
function editMaint(id){const m=loadMaint().find(x=>x.id===id);if(!m)return;document.getElementById('maint-modal-title').textContent='EDIT WORK ORDER';document.getElementById('maint-edit-id').value=id;document.getElementById('m-date').value=m.date;document.getElementById('m-wo').value=m.wo;document.getElementById('m-unit').value=m.unit;document.getElementById('m-type').value=m.type;document.getElementById('m-desc').value=m.desc;document.getElementById('m-shop').value=m.vendor||m.shop||'';document.getElementById('m-cost').value=m.cost||'';document.getElementById('m-odo').value=m.odometer||'';document.getElementById('m-status').value=m.status;document.getElementById('m-notes').value=m.notes||'';document.getElementById('maint-modal').classList.add('open');}
async function delMaint(id){if(confirm('Delete work order?')){await NexusDB.Maintenance.delete(id);await renderMaint();}}
document.getElementById('maint-modal').addEventListener('click',function(e){if(e.target===this)closeMaintModal();});
(async()=>{ if(typeof NexusDB!=='undefined') await NexusDB.Auth.requireAuth().catch(()=>{}); await renderMaint(); })();
</script>
  </div>
</div>
