<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117">
<title>Carrier Nexus — Road Pass Verification</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#15803d;--red:#dc2626;--orange:#e8640a;--accent:#e91e8c;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;background:#0d1117;font-family:'Barlow',sans-serif;color:#fff;}
body{display:flex;flex-direction:column;align-items:center;padding:0 0 40px;}

.header{
  width:100%;background:#0d1117;border-bottom:2px solid;padding:18px 20px;
  display:flex;align-items:center;justify-content:space-between;
}
.header.valid{border-color:#22c55e;}
.header.expired{border-color:var(--red);}
.header-brand{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;letter-spacing:.06em;}
.header-brand span{color:var(--accent);}
.header-badge{
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;
  padding:6px 14px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase;
}
.header-badge.valid{background:rgba(21,128,61,.2);border:1.5px solid rgba(34,197,94,.5);color:#4ade80;}
.header-badge.expired{background:rgba(220,38,38,.15);border:1.5px solid rgba(220,38,38,.4);color:#f87171;}

.main{width:100%;max-width:560px;padding:20px 16px 0;}

/* VALID STATE */
.verify-banner{
  width:100%;padding:14px 16px;border-radius:12px;margin-bottom:18px;
  display:flex;align-items:center;gap:12px;
}
.verify-banner.valid{background:rgba(21,128,61,.12);border:1.5px solid rgba(34,197,94,.35);}
.verify-banner.expired{background:rgba(220,38,38,.1);border:1.5px solid rgba(220,38,38,.3);}
.verify-icon{font-size:28px;flex-shrink:0;}
.verify-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;}
.verify-title.valid{color:#4ade80;}
.verify-title.expired{color:#f87171;}
.verify-sub{font-size:12px;color:#8b949e;margin-top:3px;}

/* SECTION CARDS */
.doc-section{margin-bottom:12px;}
.doc-section-title{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:#6b7280;
  padding:0 0 6px;border-bottom:1px solid #21262d;margin-bottom:8px;
}
.doc-card{background:#13181f;border:1px solid #21262d;border-radius:12px;overflow:hidden;margin-bottom:8px;}
.doc-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #1a2030;}
.doc-row:last-child{border-bottom:none;}
.doc-lbl{font-size:12px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;}
.doc-val{font-size:13px;font-weight:600;color:#e4e6ea;text-align:right;max-width:65%;}
.doc-val.ok{color:#4ade80;}
.doc-val.warn{color:#fb923c;}
.doc-val.fail{color:#f87171;}
.doc-val.gray{color:#6b7280;}

/* STATUS PILL */
.status-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
.status-pill.ok{background:rgba(21,128,61,.2);color:#4ade80;border:1px solid rgba(34,197,94,.3);}
.status-pill.warn{background:rgba(232,100,10,.15);color:#fb923c;border:1px solid rgba(232,100,10,.3);}
.status-pill.fail{background:rgba(220,38,38,.15);color:#f87171;border:1px solid rgba(220,38,38,.3);}

/* CARRIER SEAL */
.carrier-seal{
  background:#13181f;border:1px solid #21262d;border-radius:14px;
  padding:16px;text-align:center;margin-bottom:12px;
}
.carrier-seal-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:.06em;color:#fff;}
.carrier-seal-title span{color:var(--accent);}
.carrier-seal-dot{font-size:11px;color:#6b7280;margin-top:4px;}
.carrier-seal-nums{display:flex;justify-content:center;gap:24px;margin-top:10px;}
.csn{text-align:center;}
.csn-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;color:#e4e6ea;}
.csn-lbl{font-size:10px;color:#6b7280;margin-top:1px;}

/* TIMER */
.timer-strip{background:#13181f;border:1px solid #30363d;border-radius:10px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.timer-lbl{font-size:12px;color:#6b7280;}
.timer-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;color:#4ade80;}
.timer-val.warn{color:#fb923c;}
.timer-val.expired{color:#f87171;}

/* EXPIRED SCREEN */
.expired-screen{text-align:center;padding:40px 20px;}
.expired-icon{font-size:56px;margin-bottom:16px;}
.expired-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;color:var(--red);}
.expired-msg{font-size:14px;color:#8b949e;margin-top:10px;line-height:1.6;}

.footer-note{font-size:11px;color:#6b7280;text-align:center;max-width:420px;margin:16px auto 0;line-height:1.7;padding:0 16px;}
</style>
</head>
<body>

<div class="header" id="pageHeader">
  <div>
    <div class="header-brand">CARRIER <span>NEXUS</span></div>
    <div style="font-size:11px;color:#8b949e;margin-top:2px;">Official Road Pass · DOT Verification</div>
  </div>
  <div class="header-badge" id="headerBadge">Verifying…</div>
</div>

<div class="main" id="mainContent">
  <div style="text-align:center;padding:40px;color:#8b949e;">Verifying pass…</div>
</div>

<script>
function getParam(name){
  var u=new URLSearchParams(window.location.search);
  return u.get(name);
}

function renderExpired(reason){
  document.getElementById('pageHeader').className='header expired';
  document.getElementById('headerBadge').className='header-badge expired';
  document.getElementById('headerBadge').textContent='EXPIRED';
  document.getElementById('mainContent').innerHTML=
    '<div class="expired-screen">'+
    '<div class="expired-icon">🚫</div>'+
    '<div class="expired-title">PASS EXPIRED</div>'+
    '<div class="expired-msg">'+reason+'<br><br>Please ask the driver to generate a new Road Pass on their device.<br><br>Contact carrier directly: <strong>DOT #4326039 · MC #1688495</strong></div>'+
    '</div>';
}

function startTimer(expireAt){
  var interval=setInterval(function(){
    var remaining=Math.max(0,expireAt-Date.now());
    var secs=Math.ceil(remaining/1000);
    var mm=Math.floor(secs/60);
    var ss=secs%60;
    var el=document.getElementById('liveTimer');
    if(!el){clearInterval(interval);return;}
    el.textContent=mm+':'+(ss<10?'0':'')+ss;
    if(remaining<=0){
      el.className='timer-val expired';
      el.textContent='EXPIRED';
      clearInterval(interval);
      setTimeout(function(){renderExpired('This Road Pass has expired.');},1500);
    } else if(remaining<30000){
      el.className='timer-val warn';
    }
  },500);
}

function renderValid(d, remaining){
  document.getElementById('pageHeader').className='header valid';
  document.getElementById('headerBadge').className='header-badge valid';
  document.getElementById('headerBadge').textContent='✓ VERIFIED';

  var mm=Math.floor(remaining/60000);
  var ss=Math.floor((remaining%60000)/1000);
  var timeStr=mm+':'+(ss<10?'0':'')+ss;

  document.getElementById('mainContent').innerHTML=
    '<div class="verify-banner valid">'+
      '<div class="verify-icon">✅</div>'+
      '<div><div class="verify-title valid">PASS VERIFIED</div><div class="verify-sub">Cryptographically time-stamped · Carrier Nexus Platform</div></div>'+
    '</div>'+

    '<div class="timer-strip">'+
      '<span class="timer-lbl">Pass expires in</span>'+
      '<span class="timer-val" id="liveTimer">'+timeStr+'</span>'+
    '</div>'+

    '<div class="doc-section">'+
      '<div class="doc-section-title">Carrier Information</div>'+
      '<div class="carrier-seal">'+
        '<div class="carrier-seal-title">CARRIER <span>TRUCKING</span> US</div>'+
        '<div class="carrier-seal-dot">Licensed & Insured Interstate Motor Carrier</div>'+
        '<div class="carrier-seal-nums">'+
          '<div class="csn"><div class="csn-val">'+d.dot+'</div><div class="csn-lbl">USDOT #</div></div>'+
          '<div class="csn"><div class="csn-val">'+d.mc+'</div><div class="csn-lbl">MC #</div></div>'+
        '</div>'+
      '</div>'+
    '</div>'+

    '<div class="doc-section">'+
      '<div class="doc-section-title">Driver</div>'+
      '<div class="doc-card">'+
        '<div class="doc-row"><span class="doc-lbl">Name</span><span class="doc-val">David Hernandez</span></div>'+
        '<div class="doc-row"><span class="doc-lbl">CDL #</span><span class="doc-val">FL-D234-5678-9012</span></div>'+
        '<div class="doc-row"><span class="doc-lbl">CDL Class</span><span class="doc-val">Class A</span></div>'+
        '<div class="doc-row"><span class="doc-lbl">CDL Expires</span><span class="doc-val ok">July 2027 <span class="status-pill ok">Valid</span></span></div>'+
        '<div class="doc-row"><span class="doc-lbl">Medical Card</span><span class="doc-val ok">Jan 2026 <span class="status-pill ok">Valid</span></span></div>'+
        '<div class="doc-row"><span class="doc-lbl">Drug & Alcohol</span><span class="doc-val ok"><span class="status-pill ok">Cleared Mar 2026</span></span></div>'+
        '<div class="doc-row"><span class="doc-lbl">HOS — On Duty</span><span class="doc-val ok">4h 22m <span class="status-pill ok">Legal</span></span></div>'+
        '<div class="doc-row"><span class="doc-lbl">Remaining Drive</span><span class="doc-val ok">6h 38m available</span></div>'+
      '</div>'+
    '</div>'+

    '<div class="doc-section">'+
      '<div class="doc-section-title">Load & Vehicle</div>'+
      '<div class="doc-card">'+
        '<div class="doc-row"><span class="doc-lbl">Load #</span><span class="doc-val">'+d.load+'</span></div>'+
        '<div class="doc-row"><span class="doc-lbl">Commodity</span><span class="doc-val">Auto Parts — Non-Hazmat</span></div>'+
        '<div class="doc-row"><span class="doc-lbl">Gross Weight</span><span class="doc-val warn">79,400 lbs <span class="status-pill warn">Verify Axles</span></span></div>'+
        '<div class="doc-row"><span class="doc-lbl">Equipment</span><span class="doc-val">Dry Van 53\' · Truck #104</span></div>'+
        '<div class="doc-row"><span class="doc-lbl">Origin</span><span class="doc-val">Miami, FL</span></div>'+
        '<div class="doc-row"><span class="doc-lbl">Destination</span><span class="doc-val">Atlanta, GA</span></div>'+
        '<div class="doc-row"><span class="doc-lbl">Pre-Trip DVIR</span><span class="doc-val ok"><span class="status-pill ok">Complete — Today</span></span></div>'+
        '<div class="doc-row"><span class="doc-lbl">Insurance</span><span class="doc-val ok">$1M Liability · Active <span class="status-pill ok">Valid</span></span></div>'+
        '<div class="doc-row"><span class="doc-lbl">Hazmat</span><span class="doc-val gray">None</span></div>'+
        '<div class="doc-row"><span class="doc-lbl">Oversize Permit</span><span class="doc-val gray">N/A — Standard Load</span></div>'+
      '</div>'+
    '</div>'+

    '<div class="footer-note">This Road Pass was generated by the driver\'s Carrier Nexus device and contains real-time compliance data. Pass ID: '+d.load+'-'+d.iss+'. Valid only until the timer expires. For violations or questions contact: compliance@carriertuckingus.com</div>';

  startTimer(d.exp);
}

window.addEventListener('DOMContentLoaded', function(){
  var token=getParam('p');
  if(!token){ renderExpired('No pass token found.'); return; }
  try{
    var d=JSON.parse(atob(decodeURIComponent(token)));
    var now=Date.now();
    var remaining=d.exp-now;
    if(remaining<=0){ renderExpired('This Road Pass has expired. Ask the driver to generate a new one.'); return; }
    renderValid(d, remaining);
  } catch(e){
    renderExpired('Invalid or unreadable pass. Please ask the driver to generate a new Road Pass.');
  }
});
</script>
</body>
</html>
