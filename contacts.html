<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contacts — Carrier Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--sb:#000;--orange:#e8640a;--pink:#e91e8c;--blue:#2e6da4;--green:#22c55e;--red:#ef4444;--yellow:#fbbf24;--border:#e2e8f0;--muted:#64748b;--mid:#475569;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f1f5f9;color:#0f172a;font-family:'Barlow',sans-serif;display:flex;min-height:100vh;}
/* SIDEBAR */
.sidebar{width:220px;min-height:100vh;background:#000;border-right:1px solid #1a1a1a;display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;}
.sidebar-logo{padding:16px;display:flex;align-items:center;gap:10px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.07);}
.sidebar-logo .logo-hex svg{width:36px;height:36px;display:block;}
.sidebar-logo .logo-text{display:flex;flex-direction:column;gap:2px;}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;letter-spacing:2px;color:#fff;}
.sub{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,0.45);letter-spacing:1px;}
.sidebar-section{padding:12px 0 4px;}
.sidebar-section-label{padding:0 16px 6px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:rgba(255,255,255,0.3);letter-spacing:1.5px;text-transform:uppercase;display:block;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:7px 16px;text-decoration:none;color:#a0aec0;font-size:13px;border-left:3px solid transparent;transition:all .15s;}
.sidebar-link:hover{background:rgba(233,30,140,0.14);border-left-color:#c2185b;color:#fff;}
.sidebar-link.active{background:rgba(233,30,140,0.22);border-left:3px solid #e91e8c;color:#fff;}
.sidebar-link svg{width:14px;height:14px;flex-shrink:0;opacity:.7;}
.sidebar-link.active svg{opacity:1;}
.nav-badge{margin-left:auto;background:#e91e8c;color:#fff;font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 6px;border-radius:10px;}
.sidebar-spacer{flex:1;}
.sidebar-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,0.07);}
.user-name{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,0.6);font-weight:500;}
.user-role{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,0.3);margin-top:2px;}
/* MAIN */
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{height:56px;background:linear-gradient(135deg,#000 0%,#6b0000 45%,#c2185b 80%,#e91e8c 100%);border-bottom:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;padding:0 28px;gap:16px;position:sticky;top:0;z-index:50;}
.topbar-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;letter-spacing:2px;color:#fff;flex:1;}
.content{padding:24px 28px 48px;}
/* KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 20px;}
.kpi-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;color:#0f172a;line-height:1;}
.kpi-sub{font-size:11px;color:var(--blue);margin-top:4px;}
/* PANEL */
.panel{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.panel-head{padding:14px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.panel-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:#0f172a;letter-spacing:.06em;text-transform:uppercase;}
/* TABLE */
table{width:100%;border-collapse:collapse;}
th{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;text-align:left;background:#f8fafc;border-bottom:1px solid var(--border);}
td{padding:11px 16px;font-size:13px;color:#0f172a;border-bottom:1px solid #f8fafc;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#f8fafc;}
/* BADGES */
.badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.04em;white-space:nowrap;display:inline-block;}
.badge-green{background:#dcfce7;color:#15803d;}
.badge-red{background:#fee2e2;color:#b91c1c;}
.badge-yellow{background:#fef9c3;color:#a16207;}
.badge-blue{background:#dbeafe;color:#1d4ed8;}
.badge-gray{background:#f1f5f9;color:#64748b;}
.badge-orange{background:#ffedd5;color:#c2410c;}
.badge-purple{background:#ede9fe;color:#6d28d9;}
/* BTNS */
.btn{padding:7px 16px;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.8px;cursor:pointer;border:1px solid var(--border);background:#fff;color:#334155;transition:all .15s;}
.btn:hover{background:#f1f5f9;}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-primary:hover{background:#1d5a8a;}
.btn-orange{background:var(--orange);color:#fff;border-color:var(--orange);}
.btn-sm{padding:5px 12px;font-size:11px;}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--blue);}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9000;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;border-radius:10px;width:92%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.modal-hdr{background:linear-gradient(135deg,#000 0%,#6b0000 45%,#c2185b 80%,#e91e8c 100%);padding:18px 24px;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:space-between;}
.modal-hdr-title{color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:2px;}
.modal-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;}
.modal-body{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group.full{grid-column:1/3;}
.form-label{font-size:11px;font-weight:600;color:var(--mid);text-transform:uppercase;letter-spacing:1px;}
.form-input{width:100%;padding:9px 12px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:14px;color:#0f172a;font-family:'Barlow',sans-serif;}
.form-input:focus{outline:none;border-color:var(--blue);}
.modal-footer{padding:0 24px 24px;display:flex;gap:10px;justify-content:flex-end;}
/* MOBILE */
.mobile-nav{display:none;}
@media(max-width:768px){
  .sidebar{display:none;}
  .main{margin-left:0;}
  .content{padding:14px 12px 80px;}
  .kpi-row{grid-template-columns:1fr 1fr;gap:10px;}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:60px;background:rgba(0,0,0,0.97);border-top:1px solid rgba(233,30,140,0.2);justify-content:space-around;align-items:center;z-index:200;}
  .mn-tab{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:rgba(168,196,224,0.45);font-size:9px;font-family:'JetBrains Mono',monospace;flex:1;padding:6px 0;}
  .mn-tab svg{width:20px;height:20px;opacity:.6;}
  .mn-tab.active{color:#e91e8c;}
  .mn-tab.active svg{opacity:1;}
}
</style>
</head>
<body>
<script src="nexus-sidebar.js"></script>
<div class="main">
  <div class="topbar">
    <div class="topbar-title">DIRECTORY</div>
    <div style="display:flex;gap:10px;align-items:center;">
      <div style="display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#22c55e;letter-spacing:1px;"><span style="width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite;display:inline-block;"></span>LIVE</div>
      <button class="btn btn-orange" onclick="openContactModal()">+ Add Contact</button>
    </div>
  </div>
  <div class="content">
    
<div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
  <button class="btn btn-sm" id="tab-all" onclick="setTab('all')" style="background:#0f172a;color:#fff;">All</button>
  <button class="btn btn-sm" id="tab-owner-shipper" onclick="setTab('owner-shipper')">Owners/Shippers</button>
  <button class="btn btn-sm" id="tab-broker" onclick="setTab('broker')">Brokers</button>
  <button class="btn btn-sm" id="tab-carrier" onclick="setTab('carrier')">Carriers</button>
  <button class="btn btn-sm" id="tab-driver" onclick="setTab('driver')">Drivers</button>
  <button class="btn btn-sm" id="tab-mechanic" onclick="setTab('mechanic')">Mechanics</button>
  <button class="btn btn-sm" id="tab-other" onclick="setTab('other')">Other</button>
  <input type="text" id="contact-search" oninput="renderContacts()" placeholder="Search name, company, phone…" class="form-input" style="max-width:240px;padding:5px 10px;font-size:13px;border:1px solid #e2e8f0;border-radius:6px;">
</div>

<div id="contacts-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;"></div>

<div class="modal-overlay" id="contact-modal">
  <div class="modal-box">
    <div class="modal-hdr"><span class="modal-hdr-title" id="contact-modal-title">ADD CONTACT</span><button class="modal-close" onclick="closeContactModal()">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="contact-edit-id">
      <div class="form-group full"><label class="form-label">Name / Company *</label><input type="text" id="c-name" class="form-input" placeholder="Company or contact name" required></div>
      <div class="form-group"><label class="form-label">Type *</label>
        <select id="c-type" class="form-input">
          <option value="">— Select Type —</option>
        <option value="owner-shipper">Owner / Shipper</option>
        <option value="broker">Broker</option>
        <option value="carrier">Carrier Company</option>
        <option value="driver">Driver</option>
        <option value="mechanic-general">Mechanic: General</option>
        <option value="mechanic-tires">Mechanic: Tires</option>
        <option value="mechanic-welding">Mechanic: Welding</option>
        <option value="mechanic-cat">Mechanic: CAT Motors</option>
        <option value="mechanic-detroit">Mechanic: Detroit (DD)</option>
        <option value="mechanic-cummins">Mechanic: Cummins</option>
        <option value="mechanic-hydraulic">Mechanic: Hydraulic</option>
        <option value="mechanic-roadside">Mechanic: Roadside Repair</option>
        <option value="mechanic-electrical">Mechanic: Electrical</option>
        <option value="mechanic-transmission">Mechanic: Transmission</option>
        <option value="mechanic-body">Mechanic: Body / Frame</option>
        <option value="mechanic-ac">Mechanic: A/C &amp; HVAC</option>
        <option value="mechanic-trailer">Mechanic: Trailer Repair</option>
        <option value="mechanic-alignment">Mechanic: Alignment / Brakes</option>
        <option value="mechanic-reefer">Mechanic: Reefer Unit</option>
        <option value="other">Other</option>
          <option value="vendor">Vendor</option><option value="mechanic">Mechanic / Shop</option><option value="other">Other</option>
        </select></div>
      <div class="form-group"><label class="form-label">Contact Person</label><input type="text" id="c-person" class="form-input" placeholder="First Last"></div>
      <div class="form-group"><label class="form-label">Phone</label><input type="tel" id="c-phone" class="form-input" placeholder="(305) 555-0100"></div>
      <div class="form-group"><label class="form-label">Email</label><input type="email" id="c-email" class="form-input" placeholder="name@company.com"></div>
      <div class="form-group"><label class="form-label">MC # / DOT</label><input type="text" id="c-mc" class="form-input" placeholder="MC 123456"></div>
      <div class="form-group full"><label class="form-label">Address</label><input type="text" id="c-address" class="form-input" placeholder="Street, City, State ZIP"></div>
      <div class="form-group full"><label class="form-label">Notes</label><input type="text" id="c-notes" class="form-input" placeholder="Payment terms, specialties, etc."></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeContactModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveContact()">SAVE CONTACT</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="nexus-config.js?v=3"></script>
<script src="nexus-db.js?v=3"></script>
<script>
let activeTab='all', _contactCache=[];
const typeColors={broker:'#1d4ed8','owner-shipper':'#0e7490',carrier:'#15803d',driver:'#b45309',mechanic:'#6d28d9','mechanic-general':'#6d28d9','mechanic-tires':'#7c3aed','mechanic-welding':'#9333ea','mechanic-cat':'#7c3aed','mechanic-detroit':'#8b5cf6','mechanic-cummins':'#a78bfa','mechanic-hydraulic':'#6d28d9','mechanic-roadside':'#7c3aed','mechanic-electrical':'#5b21b6','mechanic-transmission':'#4c1d95','mechanic-body':'#7e22ce','mechanic-ac':'#6d28d9','mechanic-trailer':'#7c3aed','mechanic-alignment':'#8b5cf6','mechanic-reefer':'#9333ea',other:'#64748b',vendor:'#c2410c',shipper:'#15803d'};
const typeBg={broker:'#dbeafe','owner-shipper':'#cffafe',carrier:'#dcfce7',driver:'#fef3c7',mechanic:'#ede9fe','mechanic-general':'#ede9fe','mechanic-tires':'#f3e8ff','mechanic-welding':'#fae8ff','mechanic-cat':'#ede9fe','mechanic-detroit':'#ede9fe','mechanic-cummins':'#f5f3ff','mechanic-hydraulic':'#ede9fe','mechanic-roadside':'#f3e8ff','mechanic-electrical':'#ede9fe','mechanic-transmission':'#ede9fe','mechanic-body':'#fae8ff','mechanic-ac':'#ede9fe','mechanic-trailer':'#f3e8ff','mechanic-alignment':'#f5f3ff','mechanic-reefer':'#fae8ff',other:'#f1f5f9',vendor:'#ffedd5',shipper:'#dcfce7'};
function setTab(t){activeTab=t;['all','owner-shipper','broker','carrier','driver','mechanic','other'].forEach(tab=>{const b=document.getElementById('tab-'+tab);if(b){b.style.background=tab===t?'#0f172a':'#fff';b.style.color=tab===t?'#fff':'#334155';}});renderContacts();}
async function renderContacts(){
  _contactCache = await NexusDB.Contacts.list();
  const q=(document.getElementById('contact-search').value||'').toLowerCase();
  let data=_contactCache.filter(c=>(activeTab==='all'||(c.contact_type||c.type)===activeTab||(activeTab==='mechanic'&&(c.contact_type||c.type||'').startsWith('mechanic-')))&&(!q||[c.name,c.contact_person||c.person,c.phone,c.email,c.notes].join(' ').toLowerCase().includes(q)));
  data.sort((a,b)=>a.name.localeCompare(b.name));
  const grid=document.getElementById('contacts-grid');
  if(!data.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:48px 0;">No contacts found. Click + Add Contact to build your directory.</div>';return;}
  grid.innerHTML=data.map(c=>{
    const ct=c.contact_type||c.type||'other';
    const typeLabel=ct.replace(/-/g,' ').replace(/\b\w/g,l=>l.toUpperCase());
    return `
    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;transition:box-shadow .15s;display:flex;flex-direction:column;" onmouseenter="this.style.boxShadow='0 4px 20px rgba(0,0,0,0.1)'" onmouseleave="this.style.boxShadow=''">
      <div style="padding:14px 16px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:10px;">
        <div style="width:42px;height:42px;border-radius:8px;background:${typeBg[ct]||'#f1f5f9'};display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;color:${typeColors[ct]||'#64748b'};flex-shrink:0;">${c.name.charAt(0).toUpperCase()}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:15px;color:#0f172a;line-height:1.2;">${c.name}</div>
          <span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;background:${typeBg[ct]||'#f1f5f9'};color:${typeColors[ct]||'#64748b'};letter-spacing:.05em;text-transform:uppercase;">${typeLabel}</span>
        </div>
      </div>
      <div style="padding:12px 16px;font-size:13px;display:flex;flex-direction:column;gap:7px;flex:1;">
        ${(c.contact_person||c.person)?`<div style="color:#334155;font-weight:600;">👤 ${(c.contact_person||c.person)}</div>`:''}
        ${c.phone?`<div><a href="tel:${c.phone}" style="color:#2e6da4;text-decoration:none;font-weight:500;">📞 ${c.phone}</a></div>`:''}
        ${c.email?`<div><a href="mailto:${c.email}" style="color:#2e6da4;text-decoration:none;">✉ ${c.email}</a></div>`:''}
        ${c.address?`<div style="color:#475569;font-size:12px;">📍 ${c.address}</div>`:''}
        ${(c.mc_number||c.mc)?`<div style="color:#64748b;font-family:'JetBrains Mono',monospace;font-size:11px;">MC# ${(c.mc_number||c.mc)}</div>`:''}
        ${c.dot_number?`<div style="color:#64748b;font-family:'JetBrains Mono',monospace;font-size:11px;">DOT# ${c.dot_number}</div>`:''}
        ${c.notes?`<div style="color:#94a3b8;font-size:11px;font-style:italic;border-top:1px solid #f1f5f9;padding-top:6px;margin-top:2px;">${c.notes}</div>`:''}
      </div>
      <div style="padding:8px 16px 12px;display:flex;gap:8px;border-top:1px solid #f8fafc;">
        <button class="btn btn-sm" onclick="editContact('${c.id}')" style="flex:1;">Edit</button>
        <button class="btn btn-sm" onclick="delContact('${c.id}')" style="flex:1;color:#ef4444;">Delete</button>
      </div>
    </div>`;}).join('');
}
function openContactModal(){document.getElementById('contact-modal-title').textContent='ADD CONTACT';document.getElementById('contact-edit-id').value='';['c-name','c-person','c-phone','c-email','c-mc','c-dot','c-address','c-notes'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});document.getElementById('c-type').value='broker';document.getElementById('contact-modal').classList.add('open');}
function closeContactModal(){document.getElementById('contact-modal').classList.remove('open');}
async function saveContact(){const n=document.getElementById('c-name').value;if(!n){alert('Name required.');return;}const editId=document.getElementById('contact-edit-id').value;const rec={name:n,contact_type:document.getElementById('c-type').value,contact_person:document.getElementById('c-person').value,phone:document.getElementById('c-phone').value,email:document.getElementById('c-email').value,mc_number:document.getElementById('c-mc').value,dot_number:(document.getElementById('c-dot')||{}).value||'',address:document.getElementById('c-address').value,notes:document.getElementById('c-notes').value};if(editId){await NexusDB.Contacts.update(editId,rec);}else{await NexusDB.Contacts.create(rec);}closeContactModal();await renderContacts();}
function editContact(id){const c=_contactCache.find(x=>x.id===id);if(!c)return;document.getElementById('contact-modal-title').textContent='EDIT CONTACT';document.getElementById('contact-edit-id').value=id;document.getElementById('c-name').value=c.name||'';document.getElementById('c-type').value=c.contact_type||c.type||'broker';document.getElementById('c-person').value=c.contact_person||c.person||'';document.getElementById('c-phone').value=c.phone||'';document.getElementById('c-email').value=c.email||'';document.getElementById('c-mc').value=c.mc_number||c.mc||'';const dotEl=document.getElementById('c-dot');if(dotEl)dotEl.value=c.dot_number||'';document.getElementById('c-address').value=c.address||'';document.getElementById('c-notes').value=c.notes||'';document.getElementById('contact-modal').classList.add('open');}
async function delContact(id){if(confirm('Delete contact?')){await NexusDB.Contacts.delete(id);await renderContacts();}}
document.getElementById('contact-modal').addEventListener('click',function(e){if(e.target===this)closeContactModal();});
(async()=>{ if(typeof NexusDB!=='undefined') await NexusDB.Auth.requireAuth().catch(()=>{}); const _urlTab=new URLSearchParams(window.location.search).get('tab'); if(_urlTab) setTab(_urlTab); await renderContacts(); })();

// ── CSV Import ────────────────────────────────────────────────────────────────
// Expected columns (case-insensitive, any order):
// name, type, contact_person, phone, email, mc_number, address, notes
function importContactsCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(e) {
    const text = e.target.result;
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) { alert('CSV must have a header row and at least one data row.'); return; }
    const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/[^a-z_]/g,''));
    const idx = k => headers.indexOf(k);
    let imported = 0, skipped = 0;
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',').map(s => s.trim().replace(/^"|"$/g,''));
      const name = cols[idx('name')] || '';
      if (!name) { skipped++; continue; }
      const rec = {
        name,
        contact_type: cols[idx('type')] || cols[idx('contact_type')] || 'other',
        contact_person: cols[idx('contact_person')] || cols[idx('person')] || '',
        phone: cols[idx('phone')] || '',
        email: cols[idx('email')] || '',
        mc_number: cols[idx('mc_number')] || cols[idx('mc')] || '',
        address: cols[idx('address')] || '',
        notes: cols[idx('notes')] || ''
      };
      try { await NexusDB.Contacts.create(rec); imported++; } catch { skipped++; }
    }
    input.value = '';
    await renderContacts();
    alert('Import complete: ' + imported + ' added, ' + skipped + ' skipped.');
  };
