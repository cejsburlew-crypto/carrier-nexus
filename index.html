<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=landing.html">
<title>Carrier Nexus</title>

  <style id="nexus-gradient-header">
  .topbar, nav.topbar {
    background: linear-gradient(135deg, #000000 0%, #6b0000 45%, #c2185b 80%, #e91e8c 100%) !important;
    border-bottom: none !important;
  }
  .topbar *, .topbar-title, .topbar .user-name,
  .topbar button:not(.btn-primary):not(.btn-orange) {
    color: #ffffff !important;
  }
  .topbar .btn-ghost {
    border-color: rgba(255,255,255,0.35) !important;
    color: #fff !important;
    background: rgba(255,255,255,0.08) !important;
  }
  .topbar .btn-ghost:hover { background: rgba(255,255,255,0.18) !important; }
  </style>

  <style id="nexus-contrast-fix">
  /* ── TOPBAR ── */
  .topbar-title, .topbar h1, .topbar h2 {
    font-size: 20px !important;
    font-weight: 800 !important;
    letter-spacing: .08em !important;
    color: #fff !important;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4) !important;
  }
  .topbar * { color: #fff !important; }
  .topbar .btn-ghost {
    background: rgba(255,255,255,0.15) !important;
    border: 1px solid rgba(255,255,255,0.45) !important;
    color: #fff !important;
    font-weight: 700 !important;
  }
  .topbar .btn-ghost:hover { background: rgba(255,255,255,0.28) !important; }
  .topbar .btn-orange, .topbar .btn-primary {
    background: #fff !important;
    color: #c2185b !important;
    border: none !important;
    font-weight: 700 !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25) !important;
  }

  /* ── KPI CARDS ── */
  .kpi-card, .stat-card {
    border-left: 4px solid var(--steel-blue) !important;
    background: #fff !important;
    box-shadow: 0 1px 4px rgba(15,23,42,0.07) !important;
  }
  .kpi-card:nth-child(2), .stat-card:nth-child(2) { border-left-color: #22c55e !important; }
  .kpi-card:nth-child(3), .stat-card:nth-child(3) { border-left-color: #e8640a !important; }
  .kpi-card:nth-child(4), .stat-card:nth-child(4) { border-left-color: #ef4444 !important; }
  .kpi-label, .stat-label, .card-label {
    font-size: 11px !important;
    font-weight: 700 !important;
    color: #374151 !important;
    letter-spacing: .07em !important;
  }
  .kpi-val, .stat-val {
    font-size: 32px !important;
    font-weight: 800 !important;
    color: #0f172a !important;
    line-height: 1.1 !important;
  }
  .kpi-sub, .stat-sub {
    font-size: 12px !important;
    color: #475569 !important;
    font-weight: 500 !important;
  }

  /* ── PANELS & SECTION HEADERS ── */
  .panel-title, .section-title, .panel-head h2,
  .panel-head h3, .section-header {
    font-size: 13px !important;
    font-weight: 800 !important;
    color: #0f172a !important;
    letter-spacing: .07em !important;
  }
  .panel-head {
    background: #f8fafc !important;
    border-bottom: 2px solid #e2e8f0 !important;
  }

  /* ── TABLES ── */
  th {
    background: #e8edf4 !important;
    color: #1e293b !important;
    font-size: 11px !important;
    font-weight: 800 !important;
    letter-spacing: .07em !important;
    border-bottom: 2px solid #cbd5e1 !important;
    padding: 11px 16px !important;
  }
  td {
    color: #1e293b !important;
    font-size: 13px !important;
    font-weight: 500 !important;
    border-bottom: 1px solid #e8edf4 !important;
  }
  tr:hover td { background: #f0f4f8 !important; }

  /* ── BUTTONS (non-topbar) ── */
  .btn, button.btn, a.btn {
    font-weight: 700 !important;
    font-size: 12px !important;
    border: 1.5px solid #94a3b8 !important;
    color: #1e293b !important;
    background: #fff !important;
  }
  .btn:hover { background: #f1f5f9 !important; border-color: #64748b !important; }
  .btn-primary {
    background: #2e6da4 !important;
    color: #fff !important;
    border-color: #2e6da4 !important;
  }
  .btn-primary:hover { background: #1d5a8a !important; }
  .btn-orange, .btn-finalize {
    background: #e8640a !important;
    color: #fff !important;
    border-color: #e8640a !important;
  }
  .btn-view {
    background: #2e6da4 !important;
    color: #fff !important;
    border: none !important;
    padding: 5px 12px !important;
    border-radius: 6px !important;
    font-weight: 700 !important;
    font-size: 11px !important;
    cursor: pointer !important;
  }

  /* ── EQUIPMENT / TRUCK CARDS ── */
  .truck-card, .driver-card {
    border: 1.5px solid #cbd5e1 !important;
    box-shadow: 0 2px 8px rgba(15,23,42,0.06) !important;
  }
  .truck-unit, .unit-number {
    color: #e8640a !important;
    font-weight: 800 !important;
  }
  .truck-name, .driver-name {
    color: #0f172a !important;
    font-weight: 700 !important;
  }
  .truck-detail, .driver-role {
    color: #475569 !important;
    font-weight: 500 !important;
  }

  /* ── BADGES ── */
  .badge, [class*="badge-"] {
    font-weight: 700 !important;
    font-size: 11px !important;
  }

  /* ── SIDEBAR ── */
  .sidebar-section {
    color: #7aa3c4 !important;
    font-weight: 800 !important;
    font-size: 10px !important;
  }
  .sidebar-link {
    font-weight: 600 !important;
    font-size: 13px !important;
  }

  /* ── SETTLEMENT QUEUE ── */
  .settle-name, .driver-list-name { color: #0f172a !important; font-weight: 700 !important; }
  .settle-date, .driver-list-sub { color: #475569 !important; font-weight: 500 !important; }
  .settle-amount { color: #0f172a !important; font-weight: 800 !important; font-size: 16px !important; }

  /* ── MISSING DOC / ALERT ROWS ── */
  .missing-doc, .alert-row {
    border-left: 4px solid #ef4444 !important;
    background: #fff !important;
  }
  .doc-title, .alert-title { color: #0f172a !important; font-weight: 700 !important; }
  .doc-desc, .alert-desc { color: #475569 !important; }
  </style>

<style id="nexus-unified">
/* ═══════════════════════════════════════════════════════════════
   CARRIER NEXUS THEME
   Sidebar/Topbar : Black → Pink brand gradient
   Content area   : Wong colorblind-safe palette
   Wong palette   : Blue #0072B2 · Sky #56B4E9 · Teal #009E73
                    Orange #E69F00 · Vermilion #D55E00
                    Purple #CC79A7 · Yellow #F0E442
   ═══════════════════════════════════════════════════════════════ */

/* ── SIDEBAR ── */
.sidebar, nav.sidebar { background:#000000 !important; border-right:1px solid #1a1a1a !important; }
.sidebar-logo { padding:16px !important; display:flex !important; align-items:center !important; gap:12px !important; text-decoration:none !important; border-bottom:1px solid rgba(255,255,255,0.08) !important; }
.sidebar-logo .logo-hex svg, .sidebar-logo > svg { width:43px !important; height:43px !important; }
.sidebar-logo .logo-text .brand { font-family:'Barlow Condensed',sans-serif !important; font-weight:800 !important; font-size:18px !important; letter-spacing:2px !important; color:#ffffff !important; display:block !important; }
.sidebar-logo .logo-text .sub { font-family:'JetBrains Mono',monospace !important; font-size:11px !important; color:#e91e8c !important; letter-spacing:1px !important; display:block !important; }
.sidebar-section { padding:12px 0 4px !important; }
.sidebar-section-label { color:rgba(255,255,255,0.45) !important; font-family:'JetBrains Mono',monospace !important; font-size:9px !important; font-weight:700 !important; letter-spacing:1.5px !important; padding:16px 16px 6px !important; text-transform:uppercase !important; display:block !important; }
.sidebar-link { display:flex !important; align-items:center !important; gap:10px !important; padding:8px 16px !important; color:rgba(255,255,255,0.85) !important; border-left:3px solid transparent !important; text-decoration:none !important; font-size:13px !important; transition:all .15s !important; text-transform:uppercase !important; letter-spacing:.5px !important; }
.sidebar-link:hover { background:rgba(233,30,140,0.20) !important; border-left-color:#e91e8c !important; color:#ffffff !important; }
.sidebar-link.active { background:rgba(233,30,140,0.28) !important; border-left:3px solid #e91e8c !important; color:#ffffff !important; font-weight:600 !important; }
.sidebar-link svg { width:14px !important; height:14px !important; flex-shrink:0 !important; opacity:0.75 !important; }
.sidebar-link.active svg { opacity:1 !important; }
.sidebar-user { border-top:1px solid rgba(255,255,255,0.08) !important; }
.sidebar-user .user-name { color:rgba(255,255,255,0.85) !important; }
.sidebar-user .user-role { color:rgba(255,255,255,0.40) !important; }
.nav-badge { background:#e91e8c !important; color:#fff !important; }

/* ── TOPBAR — black-to-pink gradient ── */
.topbar, .top-bar { background:linear-gradient(135deg,#000000 0%,#6b0000 45%,#c2185b 80%,#e91e8c 100%) !important; border-bottom:none !important; }
.topbar *, .top-bar * { color:#ffffff !important; }
.topbar-title, .top-bar-title { color:#ffffff !important; font-weight:700 !important; }
.topbar-sub { color:rgba(255,255,255,0.72) !important; }
.topbar .btn-ghost, .top-bar .btn-ghost { border-color:rgba(255,255,255,0.40) !important; color:#ffffff !important; background:transparent !important; }
.topbar .btn-primary, .top-bar .btn-primary { background:#ffffff !important; color:#c2185b !important; font-weight:700 !important; border:none !important; }
/* LIVE dot — white on pink = WCAG AA */
.status-live { color:#ffffff !important; font-weight:700 !important; letter-spacing:1px !important; }
.status-dot { background:#ffffff !important; box-shadow:0 0 0 3px rgba(255,255,255,0.28) !important; }

/* ── MOBILE NAV ── */
.mobile-nav { background:#000000 !important; }
.mobile-nav-tab.active { color:#e91e8c !important; }

/* ════════════════════════════════════════════════════════════
   CONTENT AREA — Wong colorblind-safe palette
   ════════════════════════════════════════════════════════════ */

/* Page background */
body { background:#f4f6f9 !important; }
.main { background:#f4f6f9 !important; }
.content { background:#f4f6f9 !important; }

/* ── KPI CARDS ── */
.kpi-card { background:#ffffff !important; border:1px solid #dde3ec !important; border-radius:8px !important; }
.kpi-card.kpi-blue, .kpi-card[class*="blue"] { border-left:4px solid #0072B2 !important; }
.kpi-card.kpi-green, .kpi-card[class*="green"] { border-left:4px solid #009E73 !important; }
.kpi-card.kpi-orange, .kpi-card[class*="orange"] { border-left:4px solid #E69F00 !important; }
.kpi-card.kpi-red, .kpi-card[class*="red"] { border-left:4px solid #D55E00 !important; }
.kpi-card.kpi-teal, .kpi-card[class*="teal"] { border-left:4px solid #009E73 !important; }
.kpi-label { color:#64748b !important; }
.kpi-value { color:#1e293b !important; }
.kpi-sub { color:#94a3b8 !important; }

/* ── PANELS / CARDS ── */
.panel, .card, .disp-card, .driver-card, .nx-card,
.stat-chip, .kpi-card { background:#ffffff !important; border-color:#dde3ec !important; }
.panel-header, .card-header { border-bottom-color:#dde3ec !important; }
.panel-header h2, .panel-header h3 { color:#1e293b !important; }
.panel-count { color:#64748b !important; font-family:'JetBrains Mono',monospace !important; font-size:11px !important; }

/* ── TABLES ── */
.nx-table thead th { background:#f1f5f9 !important; color:#475569 !important; border-bottom:2px solid #dde3ec !important; }
.nx-table tbody tr:hover { background:#f8fafc !important; }
.nx-table td, .nx-table th { border-bottom-color:#e9eef5 !important; color:#1e293b !important; }

/* ── STATUS BADGES ── */
.badge-blue, .badge[class*="blue"] { background:rgba(0,114,178,0.12) !important; color:#005a8e !important; border:1px solid rgba(0,114,178,0.30) !important; }
.badge-green, .badge[class*="green"], .status-delivered { background:rgba(0,158,115,0.12) !important; color:#00614a !important; border:1px solid rgba(0,158,115,0.30) !important; }
.badge-orange, .badge[class*="orange"], .badge-warn { background:rgba(230,159,0,0.12) !important; color:#7a5200 !important; border:1px solid rgba(230,159,0,0.35) !important; }
.badge-red, .badge[class*="red"], .badge-danger { background:rgba(213,94,0,0.12) !important; color:#a03800 !important; border:1px solid rgba(213,94,0,0.30) !important; }
.badge-yellow { background:rgba(240,228,66,0.20) !important; color:#5a5200 !important; border:1px solid rgba(240,228,66,0.50) !important; }

/* ── DRIVER/LOAD CHIPS ── */
.driver-chip { background:#0072B2 !important; color:#ffffff !important; border-radius:4px !important; padding:2px 7px !important; font-size:11px !important; }
.load-id { color:#0072B2 !important; font-family:'JetBrains Mono',monospace !important; font-weight:600 !important; }
.rate-cell { color:#009E73 !important; font-weight:700 !important; }

/* ── BUTTONS in content ── */
.btn-primary:not(.topbar .btn-primary):not(.top-bar .btn-primary) { background:#0072B2 !important; color:#ffffff !important; }
.btn-primary:not(.topbar .btn-primary):not(.top-bar .btn-primary):hover { background:#005a8e !important; }
.btn-danger { background:#D55E00 !important; color:#fff !important; }
.btn-danger:hover { background:#b44500 !important; }
.btn-teal, .btn-success { background:#009E73 !important; color:#fff !important; }
.btn-teal:hover, .btn-success:hover { background:#007a5a !important; }
.btn-ghost:not(.topbar .btn-ghost):not(.top-bar .btn-ghost) { border-color:#cbd5e1 !important; color:#475569 !important; }
.btn-ghost:not(.topbar .btn-ghost):not(.top-bar .btn-ghost):hover { border-color:#0072B2 !important; color:#0072B2 !important; }

/* ── FORMS ── */
.form-input, .form-select, .form-textarea, input[type="text"], input[type="email"],
input[type="date"], input[type="number"], select, textarea {
  background:#ffffff !important; border-color:#cbd5e1 !important; color:#1e293b !important;
}
.form-input:focus, .form-select:focus, .form-textarea:focus,
input:focus, select:focus, textarea:focus { border-color:#0072B2 !important; box-shadow:0 0 0 2px rgba(0,114,178,0.15) !important; }
.form-label { color:#64748b !important; }

/* ── MODAL ── */
.modal, .modal-box { background:#ffffff !important; border-color:#dde3ec !important; }
.modal-title { color:#1e293b !important; }
.section-divider { color:#0072B2 !important; border-color:#dde3ec !important; }

/* ── AVAILABILITY BADGES ── */
.avail-available { background:rgba(0,158,115,0.12) !important; color:#00614a !important; border-color:rgba(0,158,115,0.35) !important; }
.avail-unavailable { background:rgba(213,94,0,0.10) !important; color:#a03800 !important; border-color:rgba(213,94,0,0.30) !important; }
.avail-date { background:rgba(230,159,0,0.12) !important; color:#7a5200 !important; border-color:rgba(230,159,0,0.35) !important; }

/* ── TAGS ── */
.tag { background:#f1f5f9 !important; border-color:#e2e8f0 !important; color:#475569 !important; }
.tag-teal { background:rgba(0,158,115,0.10) !important; color:#007a5a !important; border-color:rgba(0,158,115,0.30) !important; }
.tag-blue { background:rgba(0,114,178,0.10) !important; color:#005a8e !important; border-color:rgba(0,114,178,0.30) !important; }

/* ── DISPATCHER HUB CARDS ── */
.disp-card-header { background:linear-gradient(135deg,#003865 0%,#0072B2 100%) !important; }
.driver-row { background:#f8fafc !important; border-color:#e2e8f0 !important; }
.driver-row:hover { background:#eef2f8 !important; }
.unassigned-panel { background:#ffffff !important; border-color:#dde3ec !important; }
.unassigned-driver { background:#f8fafc !important; border-color:#e2e8f0 !important; }

/* ── MISSING DOCS SECTION LABELS ── */
.missing-doc-row { border-bottom-color:#e9eef5 !important; }
.doc-load { color:#1e293b !important; font-weight:600 !important; }
.doc-desc { color:#64748b !important; }
.missing-doc-action { color:#0072B2 !important; font-weight:600 !important; }

/* ── DRIVER/DISPATCHER CARDS on drivers.html ── */
.card-edit-btn { background:rgba(0,114,178,0.10) !important; color:#0072B2 !important; border-color:rgba(0,114,178,0.30) !important; }
.card-edit-btn:hover { background:#0072B2 !important; color:#fff !important; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:#94a3b8; }
</style>
</head>
<body>
<script>window.location.replace('landing.html');</script>
</body>
</html>
