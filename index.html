<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=landing.html">
<title>Carrier Nexus</title>

  <style id="nexus-gradient-header">
  .topbar, nav.topbar {
    background: linear-gradient(135deg, #000000 0%, #6b0000 45%, #c2185b 80%, #e91e8c 100%) !important;
    border-bottom: none !important;
  }
  .topbar *, .topbar-title, .topbar .user-name,
  .topbar button:not(.btn-primary):not(.btn-orange) {
    color: #ffffff !important;
  }
  .topbar .btn-ghost {
    border-color: rgba(255,255,255,0.35) !important;
    color: #fff !important;
    background: rgba(255,255,255,0.08) !important;
  }
  .topbar .btn-ghost:hover { background: rgba(255,255,255,0.18) !important; }
  </style>

  <style id="nexus-contrast-fix">
  /* ── TOPBAR ── */
  .topbar-title, .topbar h1, .topbar h2 {
    font-size: 20px !important;
    font-weight: 800 !important;
    letter-spacing: .08em !important;
    color: #fff !important;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4) !important;
  }
  .topbar * { color: #fff !important; }
  .topbar .btn-ghost {
    background: rgba(255,255,255,0.15) !important;
    border: 1px solid rgba(255,255,255,0.45) !important;
    color: #fff !important;
    font-weight: 700 !important;
  }
  .topbar .btn-ghost:hover { background: rgba(255,255,255,0.28) !important; }
  .topbar .btn-orange, .topbar .btn-primary {
    background: #fff !important;
    color: #c2185b !important;
    border: none !important;
    font-weight: 700 !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25) !important;
  }

  /* ── KPI CARDS ── */
  .kpi-card, .stat-card {
    border-left: 4px solid var(--steel-blue) !important;
    background: #fff !important;
    box-shadow: 0 1px 4px rgba(15,23,42,0.07) !important;
  }
  .kpi-card:nth-child(2), .stat-card:nth-child(2) { border-left-color: #22c55e !important; }
  .kpi-card:nth-child(3), .stat-card:nth-child(3) { border-left-color: #e8640a !important; }
  .kpi-card:nth-child(4), .stat-card:nth-child(4) { border-left-color: #ef4444 !important; }
  .kpi-label, .stat-label, .card-label {
    font-size: 11px !important;
    font-weight: 700 !important;
    color: #374151 !important;
    letter-spacing: .07em !important;
  }
  .kpi-val, .stat-val {
    font-size: 32px !important;
    font-weight: 800 !important;
    color: #0f172a !important;
    line-height: 1.1 !important;
  }
  .kpi-sub, .stat-sub {
    font-size: 12px !important;
    color: #475569 !important;
    font-weight: 500 !important;
  }

  /* ── PANELS & SECTION HEADERS ── */
  .panel-title, .section-title, .panel-head h2,
  .panel-head h3, .section-header {
    font-size: 13px !important;
    font-weight: 800 !important;
    color: #0f172a !important;
    letter-spacing: .07em !important;
  }
  .panel-head {
    background: #f8fafc !important;
    border-bottom: 2px solid #e2e8f0 !important;
  }

  /* ── TABLES ── */
  th {
    background: #e8edf4 !important;
    color: #1e293b !important;
    font-size: 11px !important;
    font-weight: 800 !important;
    letter-spacing: .07em !important;
    border-bottom: 2px solid #cbd5e1 !important;
    padding: 11px 16px !important;
  }
  td {
    color: #1e293b !important;
    font-size: 13px !important;
    font-weight: 500 !important;
    border-bottom: 1px solid #e8edf4 !important;
  }
  tr:hover td { background: #f0f4f8 !important; }

  /* ── BUTTONS (non-topbar) ── */
  .btn, button.btn, a.btn {
    font-weight: 700 !important;
    font-size: 12px !important;
    border: 1.5px solid #94a3b8 !important;
    color: #1e293b !important;
    background: #fff !important;
  }
  .btn:hover { background: #f1f5f9 !important; border-color: #64748b !important; }
  .btn-primary {
    background: #2e6da4 !important;
    color: #fff !important;
    border-color: #2e6da4 !important;
  }
  .btn-primary:hover { background: #1d5a8a !important; }
  .btn-orange, .btn-finalize {
    background: #e8640a !important;
    color: #fff !important;
    border-color: #e8640a !important;
  }
  .btn-view {
    background: #2e6da4 !important;
    color: #fff !important;
    border: none !important;
    padding: 5px 12px !important;
    border-radius: 6px !important;
    font-weight: 700 !important;
    font-size: 11px !important;
    cursor: pointer !important;
  }

  /* ── EQUIPMENT / TRUCK CARDS ── */
  .truck-card, .driver-card {
    border: 1.5px solid #cbd5e1 !important;
    box-shadow: 0 2px 8px rgba(15,23,42,0.06) !important;
  }
  .truck-unit, .unit-number {
    color: #e8640a !important;
    font-weight: 800 !important;
  }
  .truck-name, .driver-name {
    color: #0f172a !important;
    font-weight: 700 !important;
  }
  .truck-detail, .driver-role {
    color: #475569 !important;
    font-weight: 500 !important;
  }

  /* ── BADGES ── */
  .badge, [class*="badge-"] {
    font-weight: 700 !important;
    font-size: 11px !important;
  }

  /* ── SIDEBAR ── */
  .sidebar-section {
    color: #7aa3c4 !important;
    font-weight: 800 !important;
    font-size: 10px !important;
  }
  .sidebar-link {
    font-weight: 600 !important;
    font-size: 13px !important;
  }

  /* ── SETTLEMENT QUEUE ── */
  .settle-name, .driver-list-name { color: #0f172a !important; font-weight: 700 !important; }
  .settle-date, .driver-list-sub { color: #475569 !important; font-weight: 500 !important; }
  .settle-amount { color: #0f172a !important; font-weight: 800 !important; font-size: 16px !important; }

  /* ── MISSING DOC / ALERT ROWS ── */
  .missing-doc, .alert-row {
    border-left: 4px solid #ef4444 !important;
    background: #fff !important;
  }
  .doc-title, .alert-title { color: #0f172a !important; font-weight: 700 !important; }
  .doc-desc, .alert-desc { color: #475569 !important; }
  </style>
<style id="nexus-unified">
/* ── SIDEBAR BLACK ── */
.sidebar, nav.sidebar { background: #000000 !important; border-right: 1px solid #1a1a1a !important; }
/* ── LOGO AREA ── */
.sidebar-logo { padding:16px !important; display:flex !important; align-items:center !important; gap:10px !important; text-decoration:none !important; border-bottom:1px solid rgba(255,255,255,0.07) !important; flex-direction:row !important; }
.sidebar-logo .logo-hex { flex-shrink:0 !important; }
.sidebar-logo .logo-hex svg { width:36px !important; height:36px !important; display:block !important; }
.sidebar-logo .logo-text { display:flex !important; flex-direction:column !important; gap:2px !important; }
.sidebar-logo .logo-text .brand { font-family:'Barlow Condensed',sans-serif !important; font-weight:800 !important; font-size:15px !important; letter-spacing:2px !important; color:#ffffff !important; display:block !important; }
.sidebar-logo .logo-text .sub { font-family:'JetBrains Mono',monospace !important; font-size:9px !important; color:rgba(255,255,255,0.55) !important; letter-spacing:1px !important; display:block !important; }
/* ── NAV LINKS ── */
.sidebar-link { display:flex !important; align-items:center !important; gap:10px !important; padding:8px 16px !important; color:#a0aec0 !important; border-left:3px solid transparent !important; text-decoration:none !important; font-size:13px !important; }
.sidebar-link:hover { background:rgba(194,24,91,0.18) !important; border-left-color:#c2185b !important; color:#fff !important; }
.sidebar-link.active { background:rgba(233,30,140,0.22) !important; border-left:3px solid #e91e8c !important; color:#fff !important; }
.sidebar-link svg { width:14px !important; height:14px !important; flex-shrink:0 !important; opacity:0.7 !important; }
.sidebar-link.active svg { opacity:1 !important; }
/* ── SECTION LABELS ── */
.sidebar-section { padding:12px 0 4px !important; }
.sidebar-section-label { color:rgba(255,255,255,0.3) !important; font-family:'JetBrains Mono',monospace !important; font-size:9px !important; font-weight:700 !important; letter-spacing:1.5px !important; padding:16px 16px 6px !important; text-transform:uppercase !important; display:block !important; }
/* ── TOPBAR ── */
.topbar, .top-bar { background:linear-gradient(135deg,#000000 0%,#6b0000 45%,#c2185b 80%,#e91e8c 100%) !important; }
.topbar *, .top-bar * { color:#ffffff !important; }
.topbar .btn { color:#ffffff !important; border-color:rgba(255,255,255,0.3) !important; }
/* ── MOBILE NAV ── */
.mobile-nav { background:#000000 !important; }
.mobile-nav-tab.active { color:#e91e8c !important; }
/* ── SIDEBAR USER ── */
.sidebar-user { border-top:1px solid rgba(255,255,255,0.07) !important; }
.sidebar-user .user-name { color:rgba(255,255,255,0.7) !important; }
.sidebar-user .user-role { color:rgba(255,255,255,0.35) !important; }
/* ── NAV BADGE ── */
.nav-badge { background:#e91e8c !important; color:#fff !important; }
</style>
</head>
<body>
<script>window.location.replace('landing.html');</script>
</body>
</html>
