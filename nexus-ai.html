<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Assistant — Carrier Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
      --bg: #f0f2f5;
      --panel: #ffffff;
      --panel2: #f8f9fa;
      --border: #d0d7de;
      --text: #111827;
      --mid: #4b5563;
      --blue: #1d4ed8;
      --green: #15803d;
      --yellow: #a16207;
      --red: #dc2626;
      --orange: #c2410c;
    }
  :root{--steel-blue:#2e6da4;--orange:#e8640a;--red:#ef4444;--green:#22c55e;--yellow:#fbbf24;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f1f5f9;color:#0f172a;font-family:'Barlow',sans-serif;display:flex;min-height:100vh;}
.sidebar{width:220px;min-height:100vh;background:#1a2744;border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;}
.sidebar-logo{padding:20px 20px 12px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;color:#2e6da4;letter-spacing:.08em;text-decoration:none;display:block;}
.sidebar-section{font-size:9px;font-weight:700;color:#4a6080;letter-spacing:.12em;padding:16px 20px 6px;text-transform:uppercase;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:8px 20px;font-size:13px;color:#c8d8ea;text-decoration:none;transition:all .15s;}
.sidebar-link:hover{background:rgba(255,255,255,0.07);color:#fff;}
.sidebar-link.active{background:rgba(46,109,164,0.35);color:#fff;border-right:2px solid #2e6da4;}
.sidebar-link svg{width:14px;height:14px;opacity:.7;flex-shrink:0;}
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;}
.topbar{height:56px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50;}
.topbar-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:#0f172a;letter-spacing:.04em;}
.content{padding:24px 28px 40px;}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.kpi-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px 20px;}
.kpi-label{font-size:10px;font-weight:700;color:var(--mid);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.kpi-val{font-size:28px;font-weight:700;color:#0f172a;line-height:1;}
.kpi-sub{font-size:11px;color:#2e6da4;margin-top:4px;}
.panel{background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;margin-bottom:20px;}
.panel-head{padding:14px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.panel-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#0f172a;letter-spacing:.04em;text-transform:uppercase;}
table{width:100%;border-collapse:collapse;}
th{font-size:10px;font-weight:700;color:var(--mid);letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;text-align:left;background:#f8fafc;border-bottom:1px solid #e2e8f0;}
td{padding:11px 16px;font-size:13px;color:#0f172a;border-bottom:1px solid #f8fafc;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#f8fafc;}
.badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.04em;white-space:nowrap;}
.badge-green{background:#dcfce7;color:#15803d;}
.badge-red{background:#fee2e2;color:#b91c1c;}
.badge-yellow{background:#fef9c3;color:#a16207;}
.badge-blue{background:#dbeafe;color:#1d4ed8;}
.badge-gray{background:#f1f5f9;color:var(--mid);}
.badge-orange{background:#ffedd5;color:#c2410c;}
.badge-purple{background:#ede9fe;color:#6d28d9;}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:#2e6da4;font-weight:600;}
.btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #e2e8f0;background:#fff;color:#334155;transition:background .15s;}
.btn:hover{background:#f1f5f9;}
.btn-primary{background:#2e6da4;color:#fff;border-color:#2e6da4;}
.btn-primary:hover{background:#1d5a8a;}
.btn-orange{background:#e8640a;color:#fff;border-color:#e8640a;}
.btn-orange:hover{background:#c4520a;}
.disp-amet{background:#dbeafe;color:#1d4ed8;}
.disp-betty{background:#fce7f3;color:#9d174d;}
.mobile-nav{display:none;}
@media(max-width:768px){
  .sidebar{display:none!important;}
  .main{margin-left:0!important;}
  .content{padding:14px 12px 80px!important;}
  .kpi-row{grid-template-columns:1fr 1fr!important;gap:10px!important;}
  .mobile-nav{display:flex!important;position:fixed;bottom:0;left:0;right:0;height:56px;background:#fff;border-top:1px solid #e2e8f0;z-index:200;}
  .mobile-nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:9px;font-weight:700;color:#94a3b8;letter-spacing:.06em;}
  .mobile-nav-tab.active{color:#2e6da4;border-top:2px solid #2e6da4;}
}
</style>
<style id="nexus-unified">
/* ── SIDEBAR BLACK ── */
.sidebar, nav.sidebar { background: #000000 !important; border-right: 1px solid #1a1a1a !important; }
/* ── LOGO AREA ── */
.sidebar-logo { padding:16px !important; display:flex !important; align-items:center !important; gap:10px !important; text-decoration:none !important; border-bottom:1px solid rgba(255,255,255,0.07) !important; flex-direction:row !important; }
.sidebar-logo .logo-hex { flex-shrink:0 !important; }
.sidebar-logo .logo-hex svg { width:36px !important; height:36px !important; display:block !important; }
.sidebar-logo .logo-text { display:flex !important; flex-direction:column !important; gap:2px !important; }
.sidebar-logo .logo-text .brand { font-family:'Barlow Condensed',sans-serif !important; font-weight:800 !important; font-size:15px !important; letter-spacing:2px !important; color:#ffffff !important; display:block !important; }
.sidebar-logo .logo-text .sub { font-family:'JetBrains Mono',monospace !important; font-size:9px !important; color:rgba(255,255,255,0.55) !important; letter-spacing:1px !important; display:block !important; }
/* ── NAV LINKS ── */
.sidebar-link { display:flex !important; align-items:center !important; gap:10px !important; padding:8px 16px !important; color:#a0aec0 !important; border-left:3px solid transparent !important; text-decoration:none !important; font-size:13px !important; }
.sidebar-link:hover { background:rgba(194,24,91,0.18) !important; border-left-color:#c2185b !important; color:#fff !important; }
.sidebar-link.active { background:rgba(233,30,140,0.22) !important; border-left:3px solid #e91e8c !important; color:#fff !important; }
.sidebar-link svg { width:14px !important; height:14px !important; flex-shrink:0 !important; opacity:0.7 !important; }
.sidebar-link.active svg { opacity:1 !important; }
/* ── SECTION LABELS ── */
.sidebar-section { padding:12px 0 4px !important; }
.sidebar-section-label { color:rgba(255,255,255,0.3) !important; font-family:'JetBrains Mono',monospace !important; font-size:9px !important; font-weight:700 !important; letter-spacing:1.5px !important; padding:16px 16px 6px !important; text-transform:uppercase !important; display:block !important; }
/* ── TOPBAR ── */
.topbar, .top-bar { background:linear-gradient(135deg,#000000 0%,#6b0000 45%,#c2185b 80%,#e91e8c 100%) !important; }
.topbar *, .top-bar * { color:#ffffff !important; }
.topbar .btn { color:#ffffff !important; border-color:rgba(255,255,255,0.3) !important; }
/* ── MOBILE NAV ── */
.mobile-nav { background:#000000 !important; }
.mobile-nav-tab.active { color:#e91e8c !important; }
/* ── SIDEBAR USER ── */
.sidebar-user { border-top:1px solid rgba(255,255,255,0.07) !important; }
.sidebar-user .user-name { color:rgba(255,255,255,0.7) !important; }
.sidebar-user .user-role { color:rgba(255,255,255,0.35) !important; }
/* ── NAV BADGE ── */
.nav-badge { background:#e91e8c !important; color:#fff !important; }
</style>
</head>
<body><script src="nexus-sidebar.js"></script>
<div class="main">
  <div class="topbar"><span class="topbar-title">AI ASSISTANT ASSISTANT</span></div>
  <div class="content">
    <div style="max-width:720px;margin:0 auto;">
      <div class="panel" style="margin-bottom:16px;">
        <div class="panel-head"><span class="panel-title">Quick Actions</span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:16px;">
          <button class="btn btn-primary" style="padding:12px;height:auto;text-align:left;line-height:1.4" onclick="sendPrompt('Which drivers are missing PODs this week?')">Which drivers are missing PODs?</button>
          <button class="btn btn-primary" style="padding:12px;height:auto;text-align:left;line-height:1.4" onclick="sendPrompt('Show me this weeks settlement totals by driver')">Settlement totals by driver</button>
          <button class="btn btn-primary" style="padding:12px;height:auto;text-align:left;line-height:1.4" onclick="sendPrompt('Which unit needs maintenance soonest?')">Unit needing maintenance?</button>
          <button class="btn btn-primary" style="padding:12px;height:auto;text-align:left;line-height:1.4" onclick="sendPrompt('Compare AMET vs Betty dispatcher performance this month')">Compare dispatcher performance</button>
          <button class="btn btn-primary" style="padding:12px;height:auto;text-align:left;line-height:1.4" onclick="sendPrompt('What is our fuel cost per mile this week?')">Fuel cost per mile</button>
          <button class="btn btn-primary" style="padding:12px;height:auto;text-align:left;line-height:1.4" onclick="sendPrompt('List all active loads and their POD status')">Active loads + POD status</button>
        </div>
      </div>
      <div class="panel" id="chat-panel">
        <div class="panel-head"><span class="panel-title">Ask AI Assistant</span><span style="font-size:11px;color:#22c55e">● Online</span></div>
        <div id="chat-log" style="padding:16px;min-height:300px;max-height:460px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;">
          <div style="background:#f1f5f9;border-radius:10px 10px 10px 2px;padding:12px 16px;max-width:85%;font-size:13px;line-height:1.6;color:#0f172a;">
            Hello! I'm AI Assistant for <strong>Carrier Trucking US LLC</strong>. I have access to your loads, settlements, drivers, and fleet data. What do you need?
          </div>
        </div>
        <div style="padding:12px 16px;border-top:1px solid #f1f5f9;display:flex;gap:10px;">
          <input id="ai-input" type="text" placeholder="Ask about loads, drivers, settlements, equipment..." style="flex:1;padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:Barlow,sans-serif;outline:none;" onkeydown="if(event.key==='Enter')sendPrompt()">
          <button class="btn btn-primary" style="padding:10px 20px;" onclick="sendPrompt()">Send</button>
        </div>
      </div>
    </div>
  </div>
</div><nav class="mobile-nav">
  <a href="index.html" class="mobile-nav-tab">DASH</a>
  <a href="settlements.html" class="mobile-nav-tab">PAY</a>
  <a href="documents.html" class="mobile-nav-tab">DOCS</a>
  <a href="equipment.html" class="mobile-nav-tab">FLEET</a>
  <a href="drivers.html" class="mobile-nav-tab">TEAM</a>
</nav>
<script src="nexus-lang.js"></script>

<script>
const RESPONSES = {
  "pod":"Missing PODs: DAVID (L10483, 7 days), AVIS (BOL-36158, 3 days), YOSVIEL (130209, 10 days), AMET (120630, 7 days). Total revenue at risk: $15,650. Recommend sending reminders today.",
  "settlement":"Week of May 25 settlements — Nelson: $3,840 | Yeimi: $2,910 | Junior: $3,220 | Luis: $2,780 | Osmany: $3,100 | Yordanis: $2,650 | Total: $18,500 gross. After deductions avg 72% driver payout.",
  "maintenance":"Unit 01 oil change is overdue (was due Jun 1). Unit 04 brake inspection due May 30. Unit 06 DOT inspection due May 28. Schedule all three this week.",
  "amet":"AMET — 6 loads captured this month | $24,200 gross revenue | Dispatcher % applies to: L10483, 130209, WLE-2070, 35544. Estimated AMET commission @ 5%: $1,210.",
  "betty":"BETTY — 5 loads captured this month | $18,300 gross revenue | Dispatcher % applies to: BOL-36158, 332500, 120630. Estimated BETTY commission @ 5%: $915.",
  "dispatch":"Dispatcher comparison May 2026 — AMET: 6 loads, $24,200 gross, est. $1,210 commission. BETTY: 5 loads, $18,300 gross, est. $915 commission. AMET leads by 1 load and $295 in commission.",
  "fuel":"Fuel cost per mile this week: $0.91/mile based on $8,420 fuel spend and 9,240 miles. Fleet avg MPG: 6.4. Best unit: Unit 05 at 7.1 MPG. Worst: Unit 01 at 5.8 MPG.",
  "active":"Active loads: 8 in transit, 3 pending pickup. POD status — On file: 4 loads. Missing: DAVID (L10483), AVIS (BOL-36158), YOSVIEL (130209), AMET (120630). Pending: WLE-2070, 35544.",
};
function sendPrompt(preset) {
  const input = document.getElementById('ai-input');
  const q = preset || input.value.trim();
  if (!q) return;
  const log = document.getElementById('chat-log');
  log.innerHTML += `<div style="background:#2e6da4;color:#fff;border-radius:10px 10px 2px 10px;padding:12px 16px;max-width:85%;align-self:flex-end;font-size:13px;line-height:1.6;">${q}</div>`;
  input.value = '';
  const ql = q.toLowerCase();
  let ans = "I can help with loads, settlements, drivers, fleet, fuel, tires, and dispatcher performance. Try asking about missing PODs, settlement totals, or dispatcher commissions.";
  if(ql.includes('pod')||ql.includes('proof')) ans = RESPONSES.pod;
  else if(ql.includes('settle')) ans = RESPONSES.settlement;
  else if(ql.includes('maintenance')||ql.includes('pm')||ql.includes('service')) ans = RESPONSES.maintenance;
  else if(ql.includes('amet')&&ql.includes('betty')||ql.includes('dispatch')&&ql.includes('compar')) ans = RESPONSES.dispatch;
  else if(ql.includes('amet')) ans = RESPONSES.amet;
  else if(ql.includes('betty')) ans = RESPONSES.betty;
  else if(ql.includes('fuel')) ans = RESPONSES.fuel;
  else if(ql.includes('active')||ql.includes('load')) ans = RESPONSES.active;
  setTimeout(()=>{
    log.innerHTML += `<div style="background:#f1f5f9;border-radius:10px 10px 10px 2px;padding:12px 16px;max-width:85%;font-size:13px;line-height:1.6;color:#0f172a;">${ans}</div>`;
    log.scrollTop = log.scrollHeight;
  }, 600);
  log.scrollTop = log.scrollHeight;
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="nexus-config.js"></script>
<script src="nexus-db.js"></script>
<script>
(async()=>{
  if(typeof NexusDB!=='undefined') await NexusDB.Auth.requireAuth().catch(()=>{});
})();
</script>
</body></html>
