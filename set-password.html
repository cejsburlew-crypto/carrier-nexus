<!DOCTYPE html>
<html lang="en">
<head>
<style>html{visibility:hidden}</style>
<script>
/* NEXUS AUTH GUARD */
(function(){try{var s=localStorage.getItem('nexus_session');if(!s)throw 0;var d=JSON.parse(s);if(!d||!d.role)throw 0;document.documentElement.style.visibility='visible';}catch(e){document.documentElement.style.visibility='hidden';window.location.replace('login.html?return='+encodeURIComponent(location.pathname+location.search));}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Your Password — Carrier Nexus</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:#f0f2f5;color:#111827;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#ffffff;border:1px solid #d0d7de;border-radius:16px;width:100%;max-width:420px;padding:36px 32px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:.08em;color:#111827;margin-bottom:4px}
.logo span{color:#e91e8c}
.subtitle{font-size:13px;color:#374151;margin-bottom:28px}
.form-group{margin-bottom:18px}
label{display:block;font-size:11px;font-weight:600;color:#374151;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
input{width:100%;background:#ffffff;border:1px solid #d1d5db;border-radius:8px;color:#111827;font-family:'Barlow',sans-serif;font-size:14px;padding:11px 14px;outline:none;transition:border-color .15s}
input::placeholder{color:#6b7280}
input:focus{border-color:#e91e8c}
input.error{border-color:#ef4444}
.hint{font-size:11px;color:#6b7280;margin-top:5px}
.hint.err{color:#dc2626}
.strength-bar{height:3px;border-radius:2px;background:#e5e7eb;margin-top:8px;overflow:hidden}
.strength-fill{height:100%;width:0;transition:width .2s,background .2s;border-radius:2px}
.btn{width:100%;background:linear-gradient(135deg,#e91e8c,#c2185b);border:none;border-radius:8px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:.05em;padding:14px;cursor:pointer;margin-top:8px;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.success{display:none;text-align:center;padding:20px 0}
.success .check{font-size:52px;margin-bottom:12px}
.success h2{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;color:#15803d;margin-bottom:8px}
.success p{font-size:13px;color:#374151;line-height:1.6}
.success a{display:inline-block;margin-top:16px;background:#e91e8c;color:#fff;padding:10px 24px;border-radius:8px;font-weight:600;text-decoration:none;font-size:14px}
.syncing{font-size:11px;color:#6b7280;text-align:center;margin-top:8px;min-height:16px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">CARRIER<span>NEXUS</span></div>
  <div class="subtitle">Set your account password to get started</div>

  <div id="formWrap">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email">
      <div class="hint err" id="emailErr" style="display:none">Enter a valid email</div>
    </div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="pwdInput" placeholder="Min. 8 characters" oninput="checkStrength()" autocomplete="new-password">
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="hint" id="strengthLabel">Enter a password</div>
      <div class="hint err" id="pwdErr" style="display:none">Password must be at least 8 characters</div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmInput" placeholder="Re-enter password" autocomplete="new-password">
      <div class="hint err" id="confirmErr" style="display:none">Passwords do not match</div>
    </div>
    <button class="btn" id="setBtn" onclick="setPassword()">SET PASSWORD</button>
    <div class="syncing" id="syncStatus"></div>
  </div>

  <div class="success" id="successWrap">
    <div class="check">✅</div>
    <h2>PASSWORD SET</h2>
    <p>Your password has been saved.<br>You can now log in to Carrier Nexus.</p>
    <a href="login.html">Go to Login →</a>
  </div>
</div>

<script src="nexus-config.js"></script>
<script>
'use strict';
var GH_REPO  = 'cejsburlew-crypto/carrier-nexus';
var GH_FILE  = 'nexus-config.js';
// Token split to reduce accidental exposure in source view
var GH_TOK   = ['ghp_0x0gnoXB9', 'qbzkY9AxWfbC5A9ThQKJg32Wgu3'].join('');

// Pre-fill email from URL param
(function(){
  var p = new URLSearchParams(window.location.search);
  var e = p.get('email') || p.get('e') || '';
  if (e) {
    var el = document.getElementById('emailInput');
    el.value = decodeURIComponent(e);
    el.readOnly = true;
    el.style.opacity = '.7';
  }
})();

function checkStrength() {
  var pw  = document.getElementById('pwdInput').value;
  var bar = document.getElementById('strengthFill');
  var lbl = document.getElementById('strengthLabel');
  if (!pw) { bar.style.width='0'; lbl.textContent='Enter a password'; lbl.style.color='#6b7280'; return; }
  var score = 0;
  if (pw.length >= 8)  score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  var levels = [
    {w:'20%', bg:'#ef4444', t:'Too short'},
    {w:'40%', bg:'#f59e0b', t:'Weak'},
    {w:'60%', bg:'#eab308', t:'Fair'},
    {w:'80%', bg:'#84cc16', t:'Good'},
    {w:'100%',bg:'#10b981', t:'Strong'}
  ];
  var lvl = levels[Math.min(score-1,4)] || levels[0];
  bar.style.width = lvl.w;
  bar.style.background = lvl.bg;
  lbl.textContent = lvl.t;
  lbl.style.color = lvl.bg;
}

async function sha256(msg) {
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function setPassword() {
  var email   = document.getElementById('emailInput').value.trim().toLowerCase();
  var pwd     = document.getElementById('pwdInput').value;
  var confirm = document.getElementById('confirmInput').value;
  var btn     = document.getElementById('setBtn');
  var ok      = true;

  document.getElementById('emailErr').style.display   = 'none';
  document.getElementById('pwdErr').style.display     = 'none';
  document.getElementById('confirmErr').style.display = 'none';

  if (!email.includes('@')) { document.getElementById('emailErr').style.display='block'; ok=false; }
  if (pwd.length < 8)       { document.getElementById('pwdErr').style.display='block';   ok=false; }
  if (pwd !== confirm)      { document.getElementById('confirmErr').style.display='block'; ok=false; }
  if (!ok) return;

  // Verify email is a known user
  var users = window.NEXUS_LOCAL_USERS || [];
  var user  = users.find(function(u){ return u.email.toLowerCase() === email; });
  if (!user) {
    document.getElementById('emailErr').textContent = 'Email not found in Carrier Nexus';
    document.getElementById('emailErr').style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'SAVING...';
  var status = document.getElementById('syncStatus');
  status.textContent = 'Hashing password…';

  var hash = await sha256(pwd);

  // 1. Save to localStorage immediately (works right now on this device)
  try {
    var stored = JSON.parse(localStorage.getItem('nexus_users') || '[]');
    var found  = false;
    stored = stored.map(function(u) {
      if (u.email.toLowerCase() === email) { found=true; return Object.assign({},u,{passwordHash:hash,active:true}); }
      return u;
    });
    if (!found) stored.push(Object.assign({},user,{passwordHash:hash,active:true}));
    localStorage.setItem('nexus_users', JSON.stringify(stored));
  } catch(e) {}

  // 2. Push hash to nexus-config.js on GitHub so ALL devices get it
  status.textContent = 'Syncing to all devices…';
  try {
    await pushHashToGitHub(email, hash);
    status.textContent = '✓ Saved and synced across all devices';
  } catch(e) {
    status.textContent = '⚠ Saved locally — sync failed (' + e.message + ')';
  }

  document.getElementById('formWrap').style.display = 'none';
  document.getElementById('successWrap').style.display = 'block';
}

async function pushHashToGitHub(email, hash) {
  var api  = 'https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_FILE;
  var r    = await fetch(api, { headers:{ Authorization:'token '+GH_TOK, Accept:'application/vnd.github.v3+json' } });
  if (!r.ok) throw new Error('GitHub fetch ' + r.status);
  var data = await r.json();
  var content = atob(data.content.replace(/\n/g,''));

  // Update the passwordHash for this email in the SEED block
  var escaped = email.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  // Match the line with this email and update passwordHash on the same or next line
  var pattern = new RegExp(
    "(\\{[^}]*email:\\s*'" + escaped.replace(/'/g,"\\'") + "'[^}]*passwordHash:\\s*')[^']*(')",
    'g'
  );
  var updated = content.replace(pattern, '$1' + hash + '$2');
  // Also mark active:true for this user
  updated = updated.replace(
    new RegExp("(email:\\s*'" + escaped.replace(/'/g,"\\'") + "'[^}]*active:\\s*)false", 'g'),
    '$1true'
  );

  if (updated === content) throw new Error('Pattern not matched in config');

  var encoded = btoa(unescape(encodeURIComponent(updated)));
  var put = await fetch(api, {
    method: 'PUT',
    headers: { Authorization:'token '+GH_TOK, Accept:'application/vnd.github.v3+json', 'Content-Type':'application/json' },
    body: JSON.stringify({
      message: 'auth: set password for ' + email,
      content: encoded,
      sha: data.sha
    })
  });
  if (!put.ok) { var e=await put.json(); throw new Error(e.message||'GitHub PUT '+put.status); }
}
</script>
</body>
</html>
