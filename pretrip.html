<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pre-Trip Inspection — Carrier Nexus</title>
<style>
:root {
      --bg: #f0f2f5;
      --panel: #ffffff;
      --panel2: #f8f9fa;
      --border: #d0d7de;
      --text: #111827;
      --mid: #4b5563;
      --blue: #1d4ed8;
      --green: #15803d;
      --yellow: #a16207;
      --red: #dc2626;
      --orange: #c2410c;
    }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
/* ── HEADER ── */
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px 10px;}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.hdr-back{background:none;border:none;color:var(--mid);font-size:20px;cursor:pointer;padding:4px;min-width:32px;min-height:32px;display:flex;align-items:center;}
.hdr-title{font-size:15px;font-weight:700;flex:1;}
.hdr-sub{font-size:11px;color:var(--mid);}
.hdr-exit{background:none;border:1px solid var(--border);color:var(--mid);font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer;min-height:32px;}
/* ── PROGRESS ── */
.progress-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .3s ease;}
.progress-label{display:flex;justify-content:space-between;font-size:10px;color:var(--mid);margin-top:4px;}
/* ── CARD DECK ── */
.card-deck{position:fixed;top:104px;left:0;right:0;bottom:80px;overflow:hidden;}
.cards-wrap{display:flex;height:100%;transition:transform .35s cubic-bezier(.4,0,.2,1);}
.card{min-width:100%;height:100%;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;}
/* ── SECTION HEADER ── */
.sec-head{text-align:center;padding:12px 8px 16px;}
.sec-icon{font-size:40px;margin-bottom:8px;}
.sec-name{font-size:20px;font-weight:700;margin-bottom:4px;}
.sec-cfr{font-size:11px;color:var(--mid);}
.sec-tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;margin-top:6px;}
.tag-tractor{background:rgba(59,130,246,.15);color:var(--blue);}
.tag-trailer{background:rgba(245,158,11,.15);color:var(--yellow);}
/* ── ITEMS ── */
.items-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.item-row{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;transition:.15s;}
.item-row.ok{border-color:var(--green);background:rgba(16,185,129,.05);}
.item-row.defect{border-color:var(--red);background:rgba(239,68,68,.05);}
.item-label{font-size:14px;font-weight:600;margin-bottom:3px;}
.item-tip{font-size:11px;color:var(--mid);line-height:1.4;}
.item-actions{display:flex;gap:6px;flex-shrink:0;flex-direction:column;}
.itm-btn{border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;padding:8px 12px;min-width:52px;min-height:44px;transition:.12s;}
.itm-ok{background:rgba(16,185,129,.15);color:var(--green);}
.itm-ok.selected{background:var(--green);color:#fff;}
.itm-def{background:rgba(239,68,68,.12);color:var(--red);}
.itm-def.selected{background:var(--red);color:#fff;}
/* ── FOOTER NAV ── */
.footer-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;}
.btn-all-ok{flex:1;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;padding:14px;cursor:pointer;min-height:52px;transition:.12s;}
.btn-all-ok:active{transform:scale(.97);}
.btn-nav{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:10px;font-size:20px;padding:12px 16px;cursor:pointer;min-height:52px;min-width:52px;display:flex;align-items:center;justify-content:center;}
.btn-nav:disabled{opacity:.3;cursor:not-allowed;}
/* ── SETUP SCREEN ── */
.setup-screen{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;padding:20px 16px 40px;}
.setup-title{font-size:20px;font-weight:800;margin-bottom:4px;}
.setup-sub{font-size:13px;color:var(--mid);margin-bottom:24px;}
.field-grp{margin-bottom:16px;}
.field-lbl{font-size:12px;font-weight:600;color:var(--mid);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}
.field-in{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-size:16px;width:100%;min-height:48px;}
.field-in:focus{outline:none;border-color:var(--blue);}
.type-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.type-card{background:var(--panel);border:2px solid var(--border);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:.15s;}
.type-card.sel{border-color:var(--blue);background:rgba(59,130,246,.08);}
.type-card .tc-icon{font-size:28px;margin-bottom:6px;}
.type-card .tc-name{font-size:13px;font-weight:700;}
.btn-start{width:100%;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;padding:16px;cursor:pointer;min-height:56px;margin-top:8px;}
/* ── SUMMARY SCREEN ── */
.summary-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:12px;}
.summary-icon{font-size:48px;text-align:center;margin-bottom:8px;}
.summary-verdict{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px;}
.summary-sub{font-size:13px;color:var(--mid);text-align:center;margin-bottom:20px;}
.summary-stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.sum-stat{text-align:center;background:var(--panel2);border-radius:8px;padding:12px 8px;}
.sum-val{font-size:22px;font-weight:800;}
.sum-lbl{font-size:10px;color:var(--mid);margin-top:3px;font-weight:600;}
.defect-item{background:var(--panel2);border-left:3px solid var(--red);border-radius:6px;padding:12px 14px;margin-bottom:8px;}
.def-sec{font-size:10px;color:var(--mid);font-weight:700;text-transform:uppercase;margin-bottom:3px;}
.def-label{font-size:13px;font-weight:600;}
.def-sev{font-size:11px;margin-top:4px;}
.sev-major{color:var(--red);}
.sev-minor{color:var(--yellow);}
.sig-field{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-size:16px;width:100%;min-height:48px;margin-bottom:8px;}
.btn-submit{width:100%;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;padding:16px;cursor:pointer;min-height:56px;}
.btn-submit.green{background:var(--green);}
.btn-submit.red{background:var(--red);}
/* ── DEFECT MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(248, 249, 250, 1),.7);z-index:300;display:flex;align-items:flex-end;}
.modal-sheet{background:var(--panel);border-radius:16px 16px 0 0;padding:20px 20px 32px;width:100%;max-height:80vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;}
.sev-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.sev-btn{border-radius:8px;border:2px solid var(--border);background:none;color:var(--text);font-size:13px;font-weight:700;padding:12px;cursor:pointer;min-height:48px;}
.sev-btn.sel-major{border-color:var(--red);background:rgba(239,68,68,.12);color:var(--red);}
.sev-btn.sel-minor{border-color:var(--yellow);background:rgba(245,158,11,.1);color:var(--yellow);}
.textarea{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:14px;width:100%;min-height:80px;resize:none;margin-bottom:12px;}
.textarea:focus{outline:none;border-color:var(--blue);}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.modal-btn{border:1px solid var(--border);background:none;color:var(--text);border-radius:8px;font-size:14px;font-weight:700;padding:12px;cursor:pointer;min-height:48px;}
.modal-btn.confirm{background:var(--red);border-color:var(--red);color:#fff;}
/* ── HISTORY LIST (bottom of setup) ── */
.hist-row{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;}
.hist-main{font-size:13px;font-weight:600;}
.hist-sub{font-size:11px;color:var(--mid);margin-top:2px;}
.badge{display:inline-block;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700;}
.badge-green{background:rgba(16,185,129,.15);color:var(--green);}
.badge-red{background:rgba(239,68,68,.15);color:var(--red);}
.badge-yellow{background:rgba(245,158,11,.15);color:var(--yellow);}

      .app{margin-left:220px;}

      @media(max-width:768px){.app{margin-left:0!important;}}
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setup-screen" class="setup-screen">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
    <button class="hdr-exit" onclick="history.back()">← Back</button>
    <div style="font-size:11px;color:var(--mid);">DOT Pre-Trip · 49 CFR 396.11</div>
  </div>
  <div class="setup-title">Pre-Trip Inspection</div>
  <div class="setup-sub">Complete before every dispatch. Required by 49 CFR 396.11.</div>

  <div class="type-row">
    <div class="type-card sel" id="tc-pre" onclick="setType('pre-trip',this,'tc-post')">
      <div class="tc-icon">🌅</div>
      <div class="tc-name">Pre-Trip</div>
    </div>
    <div class="type-card" id="tc-post" onclick="setType('post-trip',this,'tc-pre')">
      <div class="tc-icon">🌇</div>
      <div class="tc-name">Post-Trip</div>
    </div>
  </div>

  <div class="field-grp">
    <div class="field-lbl">Driver Name</div>
    <input class="field-in" id="s-driver" placeholder="Your name" value="">
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    <div class="field-grp">
      <div class="field-lbl">Unit / Truck #</div>
      <input class="field-in" id="s-unit" placeholder="e.g. Unit 01">
    </div>
    <div class="field-grp">
      <div class="field-lbl">Trailer # (opt)</div>
      <input class="field-in" id="s-trailer" placeholder="e.g. TRL-22">
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    <div class="field-grp">
      <div class="field-lbl">Odometer</div>
      <input class="field-in" id="s-odo" placeholder="Miles" type="number" inputmode="numeric">
    </div>
    <div class="field-grp">
      <div class="field-lbl">Date</div>
      <input class="field-in" id="s-date" type="date">
    </div>
  </div>

  <button class="btn-start" onclick="startInspection()">Start Inspection →</button>

  <div style="margin-top:28px;">
    <div class="field-lbl" style="margin-bottom:10px;">Recent Inspections</div>
    <div id="hist-list"></div>
  </div>
</div>

<!-- INSPECTION HEADER -->
<div class="hdr" id="insp-hdr" style="display:none;">
  <div class="hdr-top">
    <button class="hdr-back" onclick="confirmExit()">‹</button>
    <div>
      <div class="hdr-title" id="sec-title">Section</div>
      <div class="hdr-sub" id="sec-sub">—</div>
    </div>
    <button class="hdr-exit" onclick="confirmExit()">Exit</button>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="progress-label">
    <span id="prog-text">Section 0 of 14</span>
    <span id="prog-ok" style="color:var(--green);">0 OK</span>
  </div>
</div>

<!-- CARD DECK -->
<div class="card-deck" id="card-deck" style="display:none;">
  <div class="cards-wrap" id="cards-wrap"></div>
</div>

<!-- FOOTER NAV -->
<div class="footer-nav" id="footer-nav" style="display:none;">
  <button class="btn-nav" id="btn-prev" onclick="prevSec()">‹</button>
  <button class="btn-all-ok" id="btn-all-ok" onclick="markAllOK()">✓ All Good</button>
  <button class="btn-nav" id="btn-next" onclick="nextSec()">›</button>
</div>

<!-- DEFECT MODAL -->
<div class="modal-overlay" id="def-modal" style="display:none;">
  <div class="modal-sheet">
    <div class="modal-title" id="def-modal-title">Report Defect</div>
    <div class="sev-picker">
      <button class="sev-btn" id="sev-minor" onclick="pickSev('minor')">⚠️ Minor</button>
      <button class="sev-btn" id="sev-major" onclick="pickSev('major')">🚫 Major — OOS</button>
    </div>
    <textarea class="textarea" id="def-desc" placeholder="Describe the issue…"></textarea>
    <div class="modal-btns">
      <button class="modal-btn" onclick="closeDefModal()">Cancel</button>
      <button class="modal-btn confirm" onclick="confirmDefect()">Log Defect</button>
    </div>
  </div>
</div>

<script src="nexus-config.js"></script>

// ── SETUP ────────────────────────────────────────────────────────────────────
function setType(t,el,otherId){
  ST.type=t;
  document.getElementById(otherId).classList.remove('sel');
  el.classList.add('sel');
}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');}
document.getElementById('s-date').value=today();

// Pre-fill from session
try{
  var sess=JSON.parse(sessionStorage.getItem('nexus_session')||'{}');
  if(sess.name) document.getElementById('s-driver').value=sess.name;
}catch(e){}

function startInspection(){
  var driverName=document.getElementById('s-driver').value.trim();
  if(!driverName){document.getElementById('s-driver').focus();return;}
  ST.vid=document.getElementById('s-unit').value.trim()||'—';
  ST.trid=document.getElementById('s-trailer').value.trim()||'';
  ST.odo=document.getElementById('s-odo').value.trim()||'';
  ST.date=document.getElementById('s-date').value||today();
  ST.driverName=driverName;
  ST.cur=0;ST.items={};ST.defs=[];
  document.getElementById('setup-screen').style.display='none';
  document.getElementById('insp-hdr').style.display='block';
  document.getElementById('card-deck').style.display='block';
  document.getElementById('footer-nav').style.display='flex';
  inInspection=true;
  buildCards();
  goTo(0);
}

// ── CARDS ────────────────────────────────────────────────────────────────────
function buildCards(){
  var wrap=document.getElementById('cards-wrap');
  wrap.innerHTML='';
  SECS.forEach(function(sec,si){
    var card=document.createElement('div');
    card.className='card';
    card.id='card-'+si;
    var itemsHTML=sec.items.map(function(item){
      return '<div class="item-row" id="ir-'+item.id+'">' +
        '<div>' +
          '<div class="item-label">'+item.l+'</div>' +
          '<div class="item-tip">'+item.t+'</div>' +
        '</div>' +
        '<div class="item-actions">' +
          '<button class="itm-btn itm-ok" id="itm-ok-'+item.id+'" onclick="markItem(\''+item.id+'\',\'ok\')">✓ OK</button>' +
          '<button class="itm-btn itm-def" id="itm-def-'+item.id+'" onclick="openDefModal(\''+item.id+'\',\''+sec.id+'\')">⚠</button>' +
        '</div>' +
      '</div>';
    }).join('');
    card.innerHTML='<div class="sec-head">'+
      '<div class="sec-icon">'+sec.ic+'</div>'+
      '<div class="sec-name">'+sec.n+'</div>'+
      '<div class="sec-cfr">'+sec.cfr+'</div>'+
      '<span class="sec-tag '+(sec.v==='trailer'?'tag-trailer':'tag-tractor')+'">'+(sec.v==='trailer'?'🚛 Trailer':'🚚 Tractor')+'</span>'+
    '</div>'+
    '<div class="items-list">'+itemsHTML+'</div>';
    // Add summary card after last section
    if(si===SECS.length-1){
      // This is last section — next will be summary
    }
    wrap.appendChild(card);
  });
  // Summary card
  var sumCard=document.createElement('div');
  sumCard.className='card';
  sumCard.id='card-summary';
  sumCard.innerHTML='<div id="summary-content"></div>';
  wrap.appendChild(sumCard);
}

function goTo(idx){
  ST.cur=idx;
  var total=SECS.length;
  var isSummary=(idx===total);
  document.getElementById('cards-wrap').style.transform='translateX(-'+(idx*100)+'%)';
  document.getElementById('btn-prev').disabled=(idx===0);
  document.getElementById('btn-next').disabled=(idx>=total);
  if(isSummary){
    document.getElementById('btn-all-ok').style.display='none';
    document.getElementById('btn-next').style.display='none';
    document.getElementById('btn-prev').style.display='flex';
    renderSummary();
  } else {
    document.getElementById('btn-all-ok').style.display='flex';
    document.getElementById('btn-next').style.display='flex';
    document.getElementById('btn-prev').style.display='flex';
    var sec=SECS[idx];
    document.getElementById('sec-title').textContent=sec.ic+' '+sec.n;
    document.getElementById('sec-sub').textContent='Section '+(idx+1)+' of '+total+' · '+sec.cfr;
  }
  var okCount=Object.keys(ST.items).filter(function(k){return ST.items[k].r==='ok';}).length;
  var totalItems=Object.keys(ST.items).length;
  var pct=Math.round(idx/total*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-text').textContent='Section '+(isSummary?total:idx+1)+' of '+total;
  document.getElementById('prog-ok').textContent=okCount+' OK · '+ST.defs.length+' defects';
}

function prevSec(){if(ST.cur>0) goTo(ST.cur-1);}
function nextSec(){
  var total=SECS.length;
  if(ST.cur<total) goTo(ST.cur+1);
}

function markItem(itemId,result){
  ST.items[itemId]={r:result,ts:new Date().toISOString()};
  var row=document.getElementById('ir-'+itemId);
  var okBtn=document.getElementById('itm-ok-'+itemId);
  var defBtn=document.getElementById('itm-def-'+itemId);
  if(row) row.className='item-row '+(result==='ok'?'ok':'defect');
  if(okBtn) okBtn.className='itm-btn itm-ok'+(result==='ok'?' selected':'');
  if(defBtn) defBtn.className='itm-btn itm-def'+(result==='defect'?' selected':'');
}

function markAllOK(){
  var sec=SECS[ST.cur];
  sec.items.forEach(function(item){
    if(!ST.items[item.id]) markItem(item.id,'ok');
  });
  // Auto-advance after brief delay
  setTimeout(function(){
    if(ST.cur<SECS.length) goTo(ST.cur+1);
  }, 300);
}

// ── DEFECT MODAL ─────────────────────────────────────────────────────────────
function openDefModal(itemId,secId){
  defTarget={itemId:itemId,secId:secId};
  curSev='minor';
  var item=null;
  SECS.forEach(function(s){s.items.forEach(function(i){if(i.id===itemId)item=i;});});
  document.getElementById('def-modal-title').textContent='Defect: '+(item?item.l:itemId);
  document.getElementById('def-desc').value='';
  pickSev('minor');
  document.getElementById('def-modal').style.display='flex';
}
function closeDefModal(){document.getElementById('def-modal').style.display='none';defTarget=null;}
function pickSev(s){
  curSev=s;
  document.getElementById('sev-minor').className='sev-btn'+(s==='minor'?' sel-minor':'');
  document.getElementById('sev-major').className='sev-btn'+(s==='major'?' sel-major':'');
}
function confirmDefect(){
  if(!defTarget) return;
  var desc=document.getElementById('def-desc').value.trim();
  var sec=SECS.find(function(s){return s.id===defTarget.secId;})||{n:defTarget.secId};
  var item=null; SECS.forEach(function(s){s.items.forEach(function(i){if(i.id===defTarget.itemId)item=i;});});
  // Remove any existing defect for this item
  ST.defs=ST.defs.filter(function(d){return d.itemId!==defTarget.itemId;});
  ST.defs.push({itemId:defTarget.itemId,itemLabel:item?item.l:defTarget.itemId,section:sec.n,sectionId:defTarget.secId,severity:curSev,description:desc||'No description provided'});
  markItem(defTarget.itemId,'defect');
  closeDefModal();
}

// ── SWIPE SUPPORT ─────────────────────────────────────────────────────────────
var touchStartX=0;
document.getElementById('card-deck').addEventListener('touchstart',function(e){touchStartX=e.touches[0].clientX;},{passive:true});
document.getElementById('card-deck').addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)>60){if(dx<0)nextSec();else prevSec();}
},{passive:true});

// ── SUMMARY ──────────────────────────────────────────────────────────────────
function renderSummary(){
  var total=0; SECS.forEach(function(s){total+=s.items.length;});
  var okCount=Object.keys(ST.items).filter(function(k){return ST.items[k].r==='ok';}).length;
  var defCount=ST.defs.length;
  var majorCount=ST.defs.filter(function(d){return d.severity==='major';}).length;
  var canDepart=majorCount===0;
  document.getElementById('sec-title').textContent='Summary';
  document.getElementById('sec-sub').textContent='Review defects and sign off';
  var html='<div class="summary-card">';
  html+='<div class="summary-icon">'+(canDepart?'✅':'🚫')+'</div>';
  html+='<div class="summary-verdict" style="color:'+(canDepart?'var(--green)':'var(--red)')+'">'+(canDepart?'CLEARED TO DEPART':'DO NOT DISPATCH')+'</div>';
  html+='<div class="summary-sub">'+(canDepart?'No major defects — vehicle meets FMCSA standards':'Major defect found — repair before operating')+'</div>';
  html+='<div class="summary-stat-row">';
  html+='<div class="sum-stat"><div class="sum-val" style="color:var(--green);">'+okCount+'</div><div class="sum-lbl">Items OK</div></div>';
  html+='<div class="sum-stat"><div class="sum-val" style="color:'+(defCount?'var(--yellow)':'var(--mid)')+';">'+defCount+'</div><div class="sum-lbl">Defects</div></div>';
  html+='<div class="sum-stat"><div class="sum-val" style="color:'+(majorCount?'var(--red)':'var(--mid)')+';">'+majorCount+'</div><div class="sum-lbl">Major OOS</div></div>';
  html+='</div></div>';
  if(defCount){
    html+='<div style="margin-bottom:8px;font-size:13px;font-weight:700;color:var(--red);">🚫 Defects Found</div>';
    ST.defs.forEach(function(d){
      html+='<div class="defect-item"><div class="def-sec">'+d.section+'</div>';
      html+='<div class="def-label">'+d.itemLabel+'</div>';
      html+='<div class="def-sev '+(d.severity==='major'?'sev-major':'sev-minor')+'">'+(d.severity==='major'?'🚫 MAJOR — Out of Service':'⚠️ Minor — Monitor')+'</div>';
      if(d.description) html+='<div style="font-size:12px;color:var(--mid);margin-top:4px;">'+d.description+'</div>';
      html+='</div>';
    });
  }
  html+='<div style="margin-top:20px;">';
  html+='<div style="font-size:12px;color:var(--mid);margin-bottom:6px;font-weight:600;">DRIVER SIGNATURE (type full name)</div>';
  html+='<input class="sig-field" id="sig-driver" placeholder="Type full name to certify">';
  html+='<div style="font-size:11px;color:var(--mid);margin-bottom:12px;">By signing, I certify this inspection is accurate per 49 CFR 396.11.</div>';
  html+='<button class="btn-submit '+(canDepart?'green':'red')+'" onclick="submitInspection()">'+(canDepart?'✓ Submit & Clear to Depart':'Submit with Defects Noted')+'</button>';
  html+='</div>';
  document.getElementById('summary-content').innerHTML=html;
}

function submitInspection(){
  var sig=document.getElementById('sig-driver');
  if(sig&&!sig.value.trim()){sig.focus();return;}
  var total=0;SECS.forEach(function(s){total+=s.items.length;});
  var okCount=Object.keys(ST.items).filter(function(k){return ST.items[k].r==='ok';}).length;
  var majorCount=ST.defs.filter(function(d){return d.severity==='major';}).length;
  var d=new Date();
  var rec={
    id:'DVR-'+d.getFullYear()+(d.getMonth()+1).toString().padStart(2,'0')+d.getDate().toString().padStart(2,'0')+'-'+String(Math.floor(Math.random()*900)+100),
    type:ST.type,date:ST.date,time:d.toTimeString().slice(0,5),
    driverId:ST.driverName.toUpperCase().split(' ')[0],driverName:ST.driverName,
    vehicleId:ST.vid,trailerId:ST.trid,odometer:ST.odo,
    items:ST.items,defects:ST.defs,
    totalItems:total,okCount:okCount,defectCount:ST.defs.length,majorDefectCount:majorCount,
    canDepart:majorCount===0,
    driverSignature:sig?sig.value.trim():ST.driverName,certifiedAt:new Date().toISOString(),
    status:'completed',createdAt:new Date().toISOString()
  };
  try{
    var arr=JSON.parse(localStorage.getItem(LSK)||'[]');
    arr.unshift(rec);
    localStorage.setItem(LSK,JSON.stringify(arr));
  }catch(e){}
  // Return to setup
  inInspection=false;
  document.getElementById('insp-hdr').style.display='none';
  document.getElementById('card-deck').style.display='none';
  document.getElementById('footer-nav').style.display='none';
  document.getElementById('setup-screen').style.display='block';
  renderHistory();
  alert('✅ Inspection saved! ID: '+rec.id+(majorCount>0?'\n\n🚫 MAJOR DEFECTS — Do not dispatch until repaired.':''));
}

function confirmExit(){
  if(confirm('Exit inspection? Progress will be lost.')) returnToSetup();
}
function returnToSetup(){
  inInspection=false;
  document.getElementById('insp-hdr').style.display='none';
  document.getElementById('card-deck').style.display='none';
  document.getElementById('footer-nav').style.display='none';
  document.getElementById('setup-screen').style.display='block';
}

// ── HISTORY ──────────────────────────────────────────────────────────────────
function renderHistory(){
  try{
    var arr=JSON.parse(localStorage.getItem(LSK)||'[]').slice(0,5);
    if(!arr.length){document.getElementById('hist-list').innerHTML='<div style="font-size:12px;color:var(--mid);padding:8px 0;">No inspections yet</div>';return;}
    document.getElementById('hist-list').innerHTML=arr.map(function(r){
      var bc=r.canDepart?'badge-green':r.majorDefectCount?'badge-red':'badge-yellow';
      var bl=r.canDepart?'PASSED':r.majorDefectCount?'OOS':'DEFECTS';
      return '<div class="hist-row"><div><div class="hist-main">'+r.driverName+' · '+r.vehicleId+'</div><div class="hist-sub">'+r.date+' '+r.time+' · '+r.defectCount+' defects</div></div><span class="badge '+bc+'">'+bl+'</span></div>';
    }).join('');
  }catch(e){}
}
renderHistory();
</script>
<script src="nexus-sidebar.js"></script>
</body>
</html>
