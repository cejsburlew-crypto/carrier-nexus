<script>
// =====================================================
//  CARRIER NEXUS — MY PAY
//  Reads: nexus_settlements, nexus_loads_v2, nexus_expenses
//  Writes: nexus_pay_disputes
// =====================================================

function fmt(n){return '$'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function parseLS(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch(e){return d;}}
function saveLS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function addDays(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r;}
function getMonday(d){var dt=new Date(d),day=dt.getDay(),diff=day===0?-6:1-day;dt.setDate(dt.getDate()+diff);dt.setHours(0,0,0,0);return dt;}
function padDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
var MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function weekLabelFull(mon){var sun=addDays(mon,6);return 'Mon '+MS[mon.getMonth()]+' '+String(mon.getDate()).padStart(2,'0')+'/'+mon.getFullYear()+' - Sun '+MS[sun.getMonth()]+' '+String(sun.getDate()).padStart(2,'0')+'/'+sun.getFullYear();}
function fmtExpDate(str){if(!str)return '';var d=new Date(str+'T12:00:00');return DAYS[d.getDay()]+', '+MS[d.getMonth()]+' '+d.getDate();}

function getCurrentUser(){
  try{var u=localStorage.getItem('nexus_current_user');if(u)return JSON.parse(u);}catch(e){}
  try{var s=localStorage.getItem('nexus_session');if(s){var p=JSON.parse(s);return p.user||p;}}catch(e){}
  return {id:'usr_001',name:'Jim Burlew',role:'admin',email:'crtruckus@gmail.com'};
}

var DISPATCH_RATES={usr_006:0.14,usr_010:0.13,usr_005:0.30,usr_007:0.30,usr_008:0.30,usr_009:0.30};
var DRIVER_NAMES={usr_001:'Jim Burlew',usr_002:'Laura Moreno',usr_003:'Amet Abreu',usr_004:'Betty',usr_005:'Avis',usr_006:'David Hernandez',usr_007:'Miguel',usr_008:'Nelson',usr_009:'Yosviel',usr_010:'Guillermo Pinera'};
var DRIVERS_LIST=[{id:'usr_006',name:'David Hernandez'},{id:'usr_010',name:'Guillermo Pinera'},{id:'usr_005',name:'Avis'},{id:'usr_007',name:'Miguel'},{id:'usr_008',name:'Nelson'},{id:'usr_009',name:'Yosviel'}];
var PIE_COLORS={dispatch:'#e91e8c',fuel:'#f97316',toll:'#a78bfa',repair:'#fb923c',equipment:'#38bdf8',other:'#94a3b8'};

var currentUser=getCurrentUser();
var viewingDriver='usr_006';
var weekOffset=0;

// ─── SEED ─────────────────────────────────────────
function seedIfNeeded(){
  if(localStorage.getItem('nexus_mypay_seeded_v2'))return;
  var today=new Date('2026-06-22');
  var thisMonday=getMonday(today);
  var settlements=parseLS('nexus_settlements',[]);
  var loadsV2=parseLS('nexus_loads_v2',[]);
  var ROUTES=[
    ['Dallas TX','Memphis TN'],['Memphis TN','Atlanta GA'],['Atlanta GA','Birmingham AL'],
    ['Birmingham AL','Nashville TN'],['Nashville TN','Louisville KY'],['Louisville KY','Cincinnati OH'],
    ['Jacksonville FL','Savannah GA'],['Savannah GA','Charlotte NC'],['Charlotte NC','Richmond VA'],
    ['Richmond VA','Baltimore MD'],['Miami FL','Orlando FL'],['Orlando FL','Tampa FL']
  ];
  var DW=[
    {r:[1800,2100,1400,1600],fuel:140,toll:38,extra:0,status:'PAID'},
    {r:[2200,1900,2800],fuel:175,toll:52,extra:0,status:'PAID'},
    {r:[1600,1400,1800,2100],fuel:160,toll:44,extra:85,status:'PAID'},
    {r:[2400,1800,2200],fuel:190,toll:60,extra:0,status:'PAID'},
    {r:[1900,2600,1400,1500],fuel:155,toll:35,extra:0,status:'PAID'},
    {r:[2800,2100,1700],fuel:200,toll:65,extra:110,status:'PAID'},
    {r:[1500,2200,1900,2400],fuel:145,toll:42,extra:0,status:'APPROVED'},
    {r:[2100,1800,1400],fuel:130,toll:50,extra:0,status:'PENDING APPROVAL'}
  ];
  var GW=[
    {r:[1900,2400],fuel:115,toll:28,extra:0,status:'PAID'},
    {r:[2200,1600,1800],fuel:130,toll:35,extra:0,status:'PAID'},
    {r:[1700,2600],fuel:105,toll:22,extra:60,status:'PAID'},
    {r:[2000,1900,1500],fuel:120,toll:30,extra:0,status:'PAID'},
    {r:[1800,2300],fuel:135,toll:45,extra:0,status:'PAID'},
    {r:[2100,2400,1700],fuel:155,toll:38,extra:90,status:'PAID'},
    {r:[1900,2200],fuel:110,toll:32,extra:0,status:'APPROVED'},
    {r:[2000,1800,2100],fuel:100,toll:28,extra:0,status:'PENDING APPROVAL'}
  ];
  function makeWeek(driverId,dr,wk,wi){
    var mon=new Date(thisMonday);
    mon.setDate(mon.getDate()-(7*(DW.length-1-wi)));
    var wMon=getMonday(mon),wSun=addDays(wMon,6);
    var gross=wk.r.reduce(function(a,b){return a+b;},0);
    var dispFee=Math.round(gross*dr*100)/100;
    var deds=[{type:'dispatch',label:'Dispatch ('+Math.round(dr*100)+'%)',amount:dispFee},{type:'fuel',label:'Fuel',amount:wk.fuel}];
    if(wk.toll>0)deds.push({type:'toll',label:'Tolls / Scales',amount:wk.toll});
    if(wk.extra>0)deds.push({type:'repair',label:'Maintenance',amount:wk.extra});
    var td=deds.reduce(function(a,d){return a+d.amount;},0),monStr=padDate(wMon);
    var loadRecs=wk.r.map(function(rate,li){
      var route=ROUTES[(wi*4+li)%ROUTES.length];
      var pd=new Date(wMon);pd.setDate(pd.getDate()+li*2);
      return {id:'LD-'+monStr.replace(/-/g,'')+'-'+driverId.slice(-3)+'-'+li,driverId:driverId,origin:route[0],destination:route[1],pickupDate:padDate(pd),rate:rate,status:li===wk.r.length-1&&wk.status==='PENDING APPROVAL'?'In Progress':'Completed',weekMonday:monStr};
    });
    var sid='SET-'+monStr+'-'+driverId;
    if(!settlements.find(function(s){return s.id===sid;})){
      settlements.push({id:sid,driverId:driverId,weekMonday:monStr,weekLabel:weekLabelFull(wMon),gross:gross,deductions:deds,totalDeductions:td,net:gross-td,status:wk.status,loads:loadRecs.map(function(l){return {id:l.id,origin:l.origin,destination:l.destination,rate:l.rate};}),expectedPayDate:padDate(addDays(wSun,5))});
    }
    loadRecs.forEach(function(l){if(!loadsV2.find(function(x){return x.id===l.id;}))loadsV2.push(l);});
  }
  DW.forEach(function(w,i){makeWeek('usr_006',0.14,w,i);});
  GW.forEach(function(w,i){makeWeek('usr_010',0.13,w,i);});
  saveLS('nexus_settlements',settlements);
  saveLS('nexus_loads_v2',loadsV2);
  localStorage.setItem('nexus_mypay_seeded_v2','1');
}

// ─── INIT ─────────────────────────────────────────
function init(){
  seedIfNeeded();
  var role=(currentUser.role||'driver').toLowerCase();
  var isAdmin=role==='admin'||role==='approver'||role==='dispatcher';
  if(isAdmin){
    var sel=document.getElementById('driverSelect');
    sel.style.display='block';
    DRIVERS_LIST.forEach(function(d){var o=document.createElement('option');o.value=d.id;o.textContent=d.name;sel.appendChild(o);});
    viewingDriver=DRIVERS_LIST[0].id;sel.value=viewingDriver;
  } else {
    viewingDriver=currentUser.id||'usr_006';
    document.getElementById('driverNameBadge').textContent=DRIVER_NAMES[viewingDriver]||currentUser.name||'';
  }
  render();
}

function onDriverChange(){viewingDriver=document.getElementById('driverSelect').value||DRIVERS_LIST[0].id;document.getElementById('driverNameBadge').textContent='';render();}

function getViewMonday(){var today=new Date('2026-06-22'),mon=getMonday(today);mon.setDate(mon.getDate()+(weekOffset*7));return mon;}

function shiftWeek(dir){weekOffset+=dir;if(weekOffset>0)weekOffset=0;render();}

// ─── DATA ─────────────────────────────────────────
function getSettForWeek(driverId,monStr){return parseLS('nexus_settlements',[]).find(function(s){return s.driverId===driverId&&(s.weekMonday===monStr||s.week_start===monStr);})||null;}
function getLoadsForWeek(driverId,monStr,sunStr){return parseLS('nexus_loads_v2',[]).filter(function(l){if(l.driverId!==driverId)return false;if(l.weekMonday)return l.weekMonday===monStr;return (l.pickupDate||'')>=monStr&&(l.pickupDate||'')<=sunStr;});}
function getExpensesForWeek(driverId,monStr,sunStr){return parseLS('nexus_expenses',[]).filter(function(e){if(e.driverId&&e.driverId!==driverId)return false;var dt=e.date||e.transactionDate||'';return dt>=monStr&&dt<=sunStr;});}
function calcOnTheFly(driverId,loads,expenses){
  var dr=DISPATCH_RATES[driverId]||0.30;
  var gross=loads.reduce(function(a,l){return a+(+l.rate||0);},0);
  var dispFee=Math.round(gross*dr*100)/100;
  var deds=[{type:'dispatch',label:'Dispatch ('+Math.round(dr*100)+'%)',amount:dispFee}];
  var fuel=0,toll=0,repair=0,other=0;
  expenses.forEach(function(e){var a=+(e.amount||0),c=(e.category||e.type||'other').toLowerCase();if(c.includes('fuel'))fuel+=a;else if(c.includes('toll')||c.includes('scale'))toll+=a;else if(c.includes('repair')||c.includes('maint'))repair+=a;else other+=a;});
  if(fuel>0)deds.push({type:'fuel',label:'Fuel',amount:Math.round(fuel*100)/100});
  if(toll>0)deds.push({type:'toll',label:'Tolls / Scales',amount:Math.round(toll*100)/100});
  if(repair>0)deds.push({type:'repair',label:'Maintenance',amount:Math.round(repair*100)/100});
  if(other>0)deds.push({type:'other',label:'Other',amount:Math.round(other*100)/100});
  var td=deds.reduce(function(a,d){return a+d.amount;},0);
  return {gross:gross,deductions:deds,totalDeductions:td,net:gross-td,status:'PENDING APPROVAL'};
}

// ─── RENDER ───────────────────────────────────────
function render(){
  var mon=getViewMonday(),sun=addDays(mon,6),monStr=padDate(mon),sunStr=padDate(sun);
  document.getElementById('weekLabel').textContent='Week of Mon '+MS[mon.getMonth()]+' '+String(mon.getDate()).padStart(2,'0')+'/'+mon.getFullYear()+' - Sun '+MS[sun.getMonth()]+' '+String(sun.getDate()).padStart(2,'0')+'/'+sun.getFullYear();
  document.getElementById('nextWeekBtn').disabled=(weekOffset>=0);
  var sett=getSettForWeek(viewingDriver,monStr);
  var loads=getLoadsForWeek(viewingDriver,monStr,sunStr);
  var exps=getExpensesForWeek(viewingDriver,monStr,sunStr);
  var wd;
  if(sett){wd={gross:sett.gross,deductions:sett.deductions,totalDeductions:sett.totalDeductions,net:sett.net,status:sett.status,loads:sett.loads||loads,expectedPayDate:sett.expectedPayDate};}
  else{var c=calcOnTheFly(viewingDriver,loads,exps);wd={gross:c.gross,deductions:c.deductions,totalDeductions:c.totalDeductions,net:c.net,status:c.status,loads:loads,expectedPayDate:padDate(addDays(sun,5))};}
  renderBanners(wd);renderHero(wd);renderMetrics();renderHistory();renderDeductions(wd,monStr);renderLoads(loads,wd);renderDisputeForm();renderDisputeList();
}

function renderBanners(wd){
  var disputes=parseLS('nexus_pay_disputes',[]).filter(function(d){return d.driverId===viewingDriver&&d.status==='OPEN';});

  if(wd.status==='APPROVED')h+='<div class="status-banner banner-approved" onclick="switchTab(\'history\',null)">&#10003; Your settlement for this week has been approved &mdash; payment processing</div>';
  else if(wd.status==='PAID')h+='<div class="status-banner banner-paid">&#x1F4B5; Payment sent &mdash; check your account</div>';
  if(disputes.length)h+='<div class="status-banner banner-dispute" onclick="switchTab(\'disputes\',null)">&#9888; You have '+disputes.length+' open pay question'+(disputes.length>1?'s':'')+' &mdash; tap to view</div>';
  document.getElementById('bannerContainer').innerHTML=h;

function statusBadgeHtml(s){
  if(s==='PENDING APPROVAL')return '<span class="status-badge badge-pending">&#9679; PENDING APPROVAL</span>';

  if(s==='PROCESSING')return '<span class="status-badge badge-processing">&#8635; PROCESSING</span>';

}

function renderMetrics(){
  var setts=parseLS('nexus_settlements',[]).filter(function(s){return s.driverId===viewingDriver&&((s.weekMonday||s.week_start||'').startsWith('2026'));});
  var ytdNet=setts.reduce(function(a,s){return a+(s.net||0);},0);
  var bestNet=setts.reduce(function(a,s){return Math.max(a,s.net||0);},0);
  var active=setts.filter(function(s){return (s.gross||0)>0;}).length;
  var avg=active?ytdNet/active:0;
  var totalLoads=0;setts.forEach(function(s){totalLoads+=(s.loads||[]).length;});
  if(!totalLoads)totalLoads=parseLS('nexus_loads_v2',[]).filter(function(l){return l.driverId===viewingDriver&&(l.status||'Completed').toLowerCase().includes('comp');}).length;
  document.getElementById('metYTD').textContent=fmt(ytdNet);
  document.getElementById('metYTDSub').textContent=active+' weeks YTD';
  document.getElementById('metBest').textContent=fmt(bestNet);
  document.getElementById('metAvg').textContent=fmt(avg);
  document.getElementById('metAvgSub').textContent='over '+active+' weeks';
  document.getElementById('metLoads').textContent=totalLoads||'0';
}

function renderHistory(){
  var setts=parseLS('nexus_settlements',[]).filter(function(s){return s.driverId===viewingDriver;}).sort(function(a,b){var aDate=a.weekMonday||a.week_start||'';var bDate=b.weekMonday||b.week_start||'';return bDate>aDate?1:-1;}).slice(0,12);

    if((s.deductions||[]).length){expH+='<div class="history-expand-section">Deductions</div>';s.deductions.forEach(function(d){expH+='<div class="history-expand-row"><span class="history-expand-label">'+d.label+'</span><span class="history-expand-amt" style="color:#f87171">- '+fmt(d.amount)+'</span></div>';});}

    h+='<div class="history-row"><div class="history-row-header" onclick="toggleHist('+i+')"><div class="history-row-left"><div class="history-week">'+wl+'</div><div class="history-loads">'+lc+' load'+(lc!==1?'s':'')+' &middot; Gross '+fmt(s.gross)+' &middot; Ded. '+fmt(s.totalDeductions||s.total_deductions||0)+'</div></div><div class="history-row-right">'+statusBadgeHtml(s.status||'PENDING APPROVAL')+'<div class="history-net">'+fmt(s.net)+'</div><span class="history-chevron" id="hchev'+i+'">&rsaquo;</span></div></div>'+expH+'</div>';
  });
  document.getElementById('historyList').innerHTML=h;

function toggleHist(i){var e=document.getElementById('hexp'+i),c=document.getElementById('hchev'+i);if(!e)return;var open=e.classList.toggle('open');if(c)c.style.transform=open?'rotate(90deg)':'';}

function renderDeductions(wd,monStr){
  var deds=wd.deductions||[],gross=wd.gross||1;
  var priorMon=new Date(monStr+'T12:00:00');priorMon.setDate(priorMon.getDate()-7);
  var priorSett=getSettForWeek(viewingDriver,padDate(priorMon));
  var priorDeds=(priorSett&&priorSett.deductions)||[];
  function pa(type){var p=priorDeds.find(function(d){return d.type===type;});return p?p.amount:null;}
  var total=deds.reduce(function(a,d){return a+(d.amount||0);},0)||1;
  var angle=0,cx=60,cy=60,r=50,inner=28,paths='';
  deds.forEach(function(d){
    var sl=(d.amount/total)*2*Math.PI,end=angle+sl;
    var x1=cx+r*Math.sin(angle),y1=cy-r*Math.cos(angle),x2=cx+r*Math.sin(end),y2=cy-r*Math.cos(end);
    var xi1=cx+inner*Math.sin(angle),yi1=cy-inner*Math.cos(angle),xi2=cx+inner*Math.sin(end),yi2=cy-inner*Math.cos(end);
    var large=sl>Math.PI?1:0,col=PIE_COLORS[d.type]||PIE_COLORS.other;
    paths+='<path d="M'+xi1+','+yi1+' L'+x1+','+y1+' A'+r+','+r+' 0 '+large+',1 '+x2+','+y2+' L'+xi2+','+yi2+' A'+inner+','+inner+' 0 '+large+',0 '+xi1+','+yi1+' Z" fill="'+col+'" opacity=".9"/>';
    angle=end;
  });
  document.getElementById('dedPie').innerHTML=paths||'<circle cx="60" cy="60" r="50" fill="#1f2937"/><text x="60" y="65" text-anchor="middle" fill="#4b5563" font-size="10">No data</text>';
  var legH='';
  deds.forEach(function(d){legH+='<div class="ded-leg-item"><div class="ded-leg-dot" style="background:'+(PIE_COLORS[d.type]||PIE_COLORS.other)+'"></div><span class="ded-leg-label">'+d.label+'</span><span class="ded-leg-amt">'+fmt(d.amount)+'</span></div>';});
  document.getElementById('dedLegend').innerHTML=legH||'<div style="color:#4b5563;font-size:13px">No deductions</div>';
  var tbH='';
  deds.forEach(function(d){
    var pct=((d.amount/gross)*100).toFixed(1)+'%';
    var p=pa(d.type),trend='<span class="trend-same">&mdash;</span>';
    if(p!==null)trend=d.amount>p?'<span class="trend-up">&#8593;</span>':d.amount<p?'<span class="trend-down">&#8595;</span>':'<span class="trend-same">&mdash;</span>';
    tbH+='<tr><td>'+d.label+'</td><td>'+fmt(d.amount)+'</td><td>'+pct+'</td><td>'+trend+'</td></tr>';
  });
  document.getElementById('dedTableBody').innerHTML=tbH||'<tr><td colspan="4" style="color:#4b5563;text-align:center;padding:16px">No deductions this week</td></tr>';
}

function renderLoads(loads,wd){

    h+='<tr><td><div class="load-id">'+l.id+'</div></td><td><div class="load-route">'+(l.origin&&l.destination?l.origin+' → '+l.destination:'&mdash;')+'</div></td><td style="white-space:nowrap">'+(l.pickupDate||'&mdash;')+'</td><td style="font-family:\'JetBrains Mono\',monospace;color:#4ade80">'+fmt(rate)+'</td><td style="font-family:\'JetBrains Mono\',monospace;color:#14b8a6">'+fmt(share)+'</td><td>'+badge+'</td></tr>';
  });

function renderDisputeForm(){
  var setts=parseLS('nexus_settlements',[]).filter(function(s){return s.driverId===viewingDriver;}).sort(function(a,b){var aDate=a.weekMonday||a.week_start||'';var bDate=b.weekMonday||b.week_start||'';return bDate>aDate?1:-1;}).slice(0,12);

function updateDisputeDeductions(){
  var wk=document.getElementById('disputeWeek').value;
  var sel=document.getElementById('disputeDeduction');

  var sett=getSettForWeek(viewingDriver,wk);

function submitDispute(){
  var wk=document.getElementById('disputeWeek').value;
  var ded=document.getElementById('disputeDeduction').value;
  var desc=document.getElementById('disputeDesc').value.trim();
  if(!wk||!ded){alert('Please select a week and deduction.');return;}
  if(!desc){alert('Please describe your question.');return;}
  var disputes=parseLS('nexus_pay_disputes',[]);
  disputes.push({id:'DIS-'+Date.now(),driverId:viewingDriver,driverName:DRIVER_NAMES[viewingDriver]||viewingDriver,weekMonday:wk,deduction:ded,description:desc,status:'OPEN',submittedAt:new Date().toISOString(),resolvedNote:''});
  saveLS('nexus_pay_disputes',disputes);
  document.getElementById('disputeDesc').value='';
  document.getElementById('charCount').textContent='0/250';
  document.getElementById('disputeWeek').value='';
  document.getElementById('disputeDeduction').innerHTML='<option value="">Select week first</option>';
  renderDisputeList();renderBanners({status:'',deductions:[]});
  alert('Your question has been submitted.');

function renderDisputeList(){
  var isAdmin=['admin','approver'].indexOf((currentUser.role||'').toLowerCase())>-1;
  var disputes=parseLS('nexus_pay_disputes',[]);
  var filtered=isAdmin?disputes:disputes.filter(function(d){return d.driverId===viewingDriver;});
  filtered=filtered.sort(function(a,b){return b.submittedAt>a.submittedAt?1:-1;});
  if(!filtered.length){document.getElementById('disputesList').innerHTML='<div class="empty-state">No questions submitted yet.</div>';return;}
  var h='';
  filtered.forEach(function(d){
    var badge=d.status==='OPEN'?'<span class="badge-open">OPEN</span>':'<span class="badge-resolved">RESOLVED</span>';
    var rr=isAdmin&&d.status==='OPEN'?'<div class="dispute-resolve-row"><input class="dispute-resolve-input" id="rn_'+d.id+'" placeholder="Resolution note&hellip;"/><button class="btn-resolve" onclick="resolveDispute(\''+d.id+'\')">Mark Resolved</button></div>':'';
    h+='<div class="dispute-item"><div class="dispute-header"><div><div class="dispute-deduction">'+d.deduction.split('|')[0]+'</div><div class="dispute-week">'+d.weekMonday+(isAdmin?' &middot; '+d.driverName:'')+'</div></div>'+badge+'</div><div class="dispute-desc">'+d.description+'</div>'+(d.resolvedNote?'<div class="dispute-meta">Resolution: '+d.resolvedNote+'</div>':'')+rr+'</div>';
  });
  document.getElementById('disputesList').innerHTML=h;
}

function resolveDispute(id){
  var note=document.getElementById('rn_'+id);
  saveLS('nexus_pay_disputes',parseLS('nexus_pay_disputes',[]).map(function(d){if(d.id===id){d.status='RESOLVED';d.resolvedNote=note?note.value:'Resolved by admin';}return d;}));
  renderDisputeList();
}

function switchTab(name,btn){
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  var panel=document.getElementById('tab-'+name);if(panel)panel.classList.add('active');
  if(btn)btn.classList.add('active');
  else document.querySelectorAll('.tab-btn').forEach(function(b){if(b.getAttribute('onclick')&&b.getAttribute('onclick').includes("'"+name+"'"))b.classList.add('active');});
}

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
</script>
</body>
