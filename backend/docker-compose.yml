version: '3.8'
services:
  api:
    image: php:8.3-apache
    ports: ['8000:80']
    volumes: ['.:/var/www/html']
    environment:
      DB_HOST: db
      DB_NAME: carrier_nexus
      DB_USER: nexus_user
      DB_PASS: nexus_secret
      JWT_SECRET: change-this-in-production
    depends_on: [db]

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: carrier_nexus
      MYSQL_USER: nexus_user
      MYSQL_PASSWORD: nexus_secret
    volumes:
      - ./schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db_data:/var/lib/mysql
    ports: ['3306:3306']

volumes:
  db_data:
