<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet &amp; Equipment — Carrier Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--orange:#e8640a;--pink:#e91e8c;--blue:#2e6da4;--green:#22c55e;--red:#ef4444;--yellow:#fbbf24;--purple:#8b5cf6;--border:#e2e8f0;--muted:#64748b;--mid:#475569;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f1f5f9;color:#0f172a;font-family:'Barlow',sans-serif;display:flex;min-height:100vh;}
.sidebar{width:220px;min-height:100vh;background:#000;border-right:1px solid #1a1a1a;display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;}
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{height:56px;background:linear-gradient(135deg,#000 0%,#6b0000 45%,#c2185b 80%,#e91e8c 100%);border-bottom:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;padding:0 28px;gap:16px;position:sticky;top:0;z-index:50;}
.topbar-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;letter-spacing:2px;color:#fff;flex:1;}
.topbar-actions{display:flex;gap:10px;}
.content{padding:24px 28px 64px;}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 20px;}
.kpi-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;color:#0f172a;line-height:1;}
.kpi-sub{font-size:11px;color:var(--blue);margin-top:4px;}
.kpi-val.green{color:var(--green);}
.kpi-val.red{color:var(--red);}
.kpi-val.yellow{color:var(--yellow);}
/* FILTER */
.filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.filter-group{display:flex;gap:6px;}
.fbtn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--mid);font-family:'Barlow',sans-serif;transition:all .15s;}
.fbtn:hover{border-color:var(--blue);color:var(--blue);}
.fbtn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.ml-auto{margin-left:auto;}
/* BTNS */
.btn{padding:7px 16px;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.8px;cursor:pointer;border:1px solid var(--border);background:#fff;color:#334155;display:inline-flex;align-items:center;gap:6px;transition:all .15s;}
.btn:hover{background:#f1f5f9;}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-primary:hover{background:#1d5a8a;}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red);}
.btn-danger:hover{background:#dc2626;}
/* CARD GRID */
.eq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:1100px){.eq-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:680px){.eq-grid{grid-template-columns:1fr;}}
.eq-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .1s;}
.eq-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);transform:translateY(-2px);}
.eq-card-header{padding:16px 18px 12px;display:flex;align-items:flex-start;gap:14px;}
.eq-icon{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.eq-icon.tractor{background:rgba(46,109,164,.15);}
.eq-icon.trailer{background:rgba(34,197,94,.15);}
.eq-icon.jeep{background:rgba(232,100,10,.15);}
.eq-icon.spreader{background:rgba(139,92,246,.15);}
.eq-icon svg{width:26px;height:26px;}
.eq-icon.tractor svg{color:var(--blue);}
.eq-icon.trailer svg{color:var(--green);}
.eq-icon.jeep svg{color:var(--orange);}
.eq-icon.spreader svg{color:var(--purple);}
.eq-info{flex:1;min-width:0;}
.eq-unit{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:2px;}
.eq-name{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.eq-vin{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-top:3px;}
.eq-card-body{padding:0 18px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.04em;white-space:nowrap;display:inline-block;}
.badge-active{background:#dcfce7;color:#15803d;}
.badge-oos{background:#fee2e2;color:#b91c1c;}
.badge-forsale{background:#fef9c3;color:#a16207;}
.badge-sold{background:#f1f5f9;color:#64748b;}
.eq-meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;}
.eq-meta svg{width:12px;height:12px;opacity:.6;}
.eq-expiry-warn{color:var(--red);font-weight:700;}
/* EMPTY */
.empty-state{text-align:center;padding:80px 40px;color:var(--muted);}
.empty-state svg{width:56px;height:56px;opacity:.3;margin-bottom:16px;}
.empty-state h3{font-family:'Barlow Condensed',sans-serif;font-size:20px;color:#334155;margin-bottom:6px;}
/* DETAIL PANEL */
.detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8000;align-items:flex-start;justify-content:flex-end;}
.detail-overlay.open{display:flex;}
.detail-panel{background:#fff;width:620px;max-width:100vw;height:100vh;overflow-y:auto;display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(0,0,0,.2);}
.detail-hdr{background:linear-gradient(135deg,#000 0%,#6b0000 45%,#c2185b 80%,#e91e8c 100%);padding:20px 24px;display:flex;align-items:center;gap:14px;flex-shrink:0;}
.detail-hdr-icon{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.detail-hdr-icon svg{width:24px;height:24px;color:#fff;}
.detail-hdr-info{flex:1;min-width:0;}
.detail-hdr-unit{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.1em;}
.detail-hdr-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:1px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.detail-close{background:none;border:none;color:rgba(255,255,255,.7);font-size:24px;cursor:pointer;flex-shrink:0;line-height:1;padding:4px;}
.detail-close:hover{color:#fff;}
/* TABS */
.tab-bar{display:flex;border-bottom:2px solid var(--border);padding:0 24px;flex-shrink:0;background:#fff;position:sticky;top:0;z-index:10;}
.tab-btn{padding:12px 18px;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap;}
.tab-btn:hover{color:#0f172a;}
.tab-btn.active{color:var(--pink);border-bottom-color:var(--pink);}
.tab-content{flex:1;padding:24px;}
.tab-pane{display:none;}
.tab-pane.active{display:block;}
/* FIELDS GRID */
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field-group{display:flex;flex-direction:column;gap:3px;}
.field-group.full{grid-column:1/3;}
.field-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
.field-value{font-size:14px;color:#0f172a;font-family:'Barlow',sans-serif;}
.field-value.mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--blue);}
.field-edit{width:100%;padding:7px 10px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:13px;font-family:'Barlow',sans-serif;color:#0f172a;background:#fff;transition:border-color .15s;}
.field-edit:focus{outline:none;border-color:var(--blue);}
.section-hdr{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--mid);border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:14px;margin-top:24px;}
.section-hdr:first-child{margin-top:0;}
/* SUB TABLES */
.sub-table{width:100%;border-collapse:collapse;font-size:12px;}
.sub-table th{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;background:#f8fafc;border-bottom:1px solid var(--border);text-align:left;}
.sub-table td{padding:9px 12px;border-bottom:1px solid #f1f5f9;color:#0f172a;vertical-align:middle;}
.sub-table tr:last-child td{border-bottom:none;}
.sub-table tr:hover td{background:#f8fafc;}
.no-records{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9000;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;border-radius:12px;width:94%;max-width:640px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.3);}
.modal-hdr{background:linear-gradient(135deg,#000 0%,#6b0000 45%,#c2185b 80%,#e91e8c 100%);padding:18px 24px;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:space-between;}
.modal-hdr-title{color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;letter-spacing:2px;}
.modal-close{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;}
.modal-body{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group.full{grid-column:1/3;}
.form-label{font-size:11px;font-weight:700;color:var(--mid);text-transform:uppercase;letter-spacing:.08em;}
.form-input,.form-select{width:100%;padding:9px 12px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:13px;color:#0f172a;font-family:'Barlow',sans-serif;background:#fff;}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--blue);}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
/* RESPONSIVE */
@media(max-width:768px){
  .main{margin-left:0;}
  .kpi-row{grid-template-columns:1fr 1fr;}
  .sidebar{display:none;}
  .detail-panel{width:100vw;}
}
</style>
</head>
<body>
<div class="sidebar" id="nexus-sidebar-placeholder"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title">FLEET &amp; EQUIPMENT</div>
    <div class="topbar-actions">
      <button class="btn btn-primary" onclick="openAddModal()">
        <svg viewBox="0 0 16 16" fill="currentColor" width="13" height="13"><path d="M7 7V2h2v5h5v2H9v5H7V9H2V7z"/></svg>
        Add Unit
      </button>
    </div>
  </div>
  <div class="content">
    <!-- KPI BAR -->
    <div class="kpi-row" id="kpiRow">
      <div class="kpi-card">
        <div class="kpi-label">Total Units</div>
        <div class="kpi-val" id="kpiTotal">—</div>
        <div class="kpi-sub">in fleet</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Active</div>
        <div class="kpi-val green" id="kpiActive">—</div>
        <div class="kpi-sub">operational</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Est. Fleet Value</div>
        <div class="kpi-val" id="kpiValue">$0</div>
        <div class="kpi-sub">combined current value</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Insurance Expiring</div>
        <div class="kpi-val" id="kpiExpiring">0</div>
        <div class="kpi-sub" id="kpiExpiringSub">within 30 days</div>
      </div>
    </div>
    <!-- FILTER BAR -->
    <div class="filter-bar">
      <div class="filter-group" id="statusFilters">
        <button class="fbtn active" data-status="all" onclick="setFilter('all',this)">All</button>
        <button class="fbtn" data-status="active" onclick="setFilter('active',this)">Active</button>
        <button class="fbtn" data-status="out_of_service" onclick="setFilter('out_of_service',this)">Out of Service</button>
        <button class="fbtn" data-status="for_sale" onclick="setFilter('for_sale',this)">For Sale</button>
        <button class="fbtn" data-status="sold" onclick="setFilter('sold',this)">Sold</button>
      </div>
      <div class="filter-group ml-auto">
        <button class="fbtn" data-type="all" onclick="setTypeFilter('all',this)">All Types</button>
        <button class="fbtn" data-type="tractor" onclick="setTypeFilter('tractor',this)">Tractors</button>
        <button class="fbtn" data-type="trailer" onclick="setTypeFilter('trailer',this)">Trailers</button>
        <button class="fbtn" data-type="jeep" onclick="setTypeFilter('jeep',this)">Jeep/Dolly</button>
        <button class="fbtn" data-type="spreader" onclick="setTypeFilter('spreader',this)">Spreader</button>
      </div>
    </div>
    <!-- GRID -->
    <div class="eq-grid" id="eqGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      <h3>No units found</h3>
      <p>Adjust filters or add a new unit to the fleet.</p>
    </div>
  </div>
</div>

<!-- DETAIL PANEL -->
<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-panel" id="detailPanel">
    <div class="detail-hdr">
      <div class="detail-hdr-icon" id="detailHdrIcon"></div>
      <div class="detail-hdr-info">
        <div class="detail-hdr-unit" id="detailHdrUnit"></div>
        <div class="detail-hdr-title" id="detailHdrTitle"></div>
      </div>
      <button class="detail-close" onclick="closeDetail()">&#215;</button>
    </div>
    <div class="tab-bar" id="detailTabBar">
      <button class="tab-btn active" onclick="switchTab('overview',this)">Overview</button>
      <button class="tab-btn" onclick="switchTab('maintenance',this)">Maintenance</button>
      <button class="tab-btn" onclick="switchTab('tires',this)">Tires</button>
      <button class="tab-btn" onclick="switchTab('documents',this)">Documents</button>
      <button class="tab-btn" onclick="switchTab('financials',this)">Financials</button>
    </div>
    <div class="tab-content">
      <div class="tab-pane active" id="tab-overview"></div>
      <div class="tab-pane" id="tab-maintenance"></div>
      <div class="tab-pane" id="tab-tires"></div>
      <div class="tab-pane" id="tab-documents"></div>
      <div class="tab-pane" id="tab-financials"></div>
    </div>
  </div>
</div>

<!-- ADD UNIT MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <div class="modal-hdr">
      <span class="modal-hdr-title">ADD FLEET UNIT</span>
      <button class="modal-close" onclick="closeAddModal()">&#215;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Unit Number *</label>
        <input class="form-input" id="f_unit_number" placeholder="T-003" />
      </div>
      <div class="form-group">
        <label class="form-label">Type *</label>
        <select class="form-select" id="f_type">
          <option value="tractor">Tractor</option>
          <option value="trailer">Trailer</option>
          <option value="jeep">Jeep / Dolly</option>
          <option value="spreader">Spreader Bar</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Year</label>
        <input class="form-input" id="f_year" type="number" placeholder="2024" />
      </div>
      <div class="form-group">
        <label class="form-label">Make</label>
        <input class="form-input" id="f_make" placeholder="Peterbilt" />
      </div>
      <div class="form-group full">
        <label class="form-label">Model</label>
        <input class="form-input" id="f_model" placeholder="389" />
      </div>
      <div class="form-group full">
        <label class="form-label">VIN</label>
        <input class="form-input" id="f_vin" placeholder="1XPWD49X1JD484744" style="font-family:'JetBrains Mono',monospace;" />
      </div>
      <div class="form-group">
        <label class="form-label">License Plate</label>
        <input class="form-input" id="f_plate" placeholder="ABC1234" />
      </div>
      <div class="form-group">
        <label class="form-label">Plate State</label>
        <input class="form-input" id="f_plate_state" placeholder="FL" maxlength="2" />
      </div>
      <div class="form-group">
        <label class="form-label">Color</label>
        <input class="form-input" id="f_color" placeholder="Red" />
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="f_status">
          <option value="active">Active</option>
          <option value="out_of_service">Out of Service</option>
          <option value="for_sale">For Sale</option>
          <option value="sold">Sold</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Mileage</label>
        <input class="form-input" id="f_mileage" type="number" placeholder="125000" />
      </div>
      <div class="form-group">
        <label class="form-label">Purchase Date</label>
        <input class="form-input" id="f_purchase_date" type="date" />
      </div>
      <div class="form-group">
        <label class="form-label">Purchase Price ($)</label>
        <input class="form-input" id="f_purchase_price" type="number" placeholder="85000" />
      </div>
      <div class="form-group">
        <label class="form-label">Current Value ($)</label>
        <input class="form-input" id="f_current_value" type="number" placeholder="60000" />
      </div>
      <div class="form-group full">
        <label class="form-label">Insurance Carrier</label>
        <input class="form-input" id="f_ins_carrier" placeholder="Progressive Commercial" />
      </div>
      <div class="form-group">
        <label class="form-label">Insurance Policy #</label>
        <input class="form-input" id="f_ins_policy" placeholder="POL-12345" />
      </div>
      <div class="form-group">
        <label class="form-label">Insurance Expiry</label>
        <input class="form-input" id="f_ins_expiry" type="date" />
      </div>
      <div class="form-group">
        <label class="form-label">Registration Expiry</label>
        <input class="form-input" id="f_reg_expiry" type="date" />
      </div>
      <div class="form-group">
        <label class="form-label">Registration State</label>
        <input class="form-input" id="f_reg_state" placeholder="FL" maxlength="2" />
      </div>
      <div class="form-group full">
        <label class="form-label">USDOT #</label>
        <input class="form-input" id="f_usdot" placeholder="3956182" />
      </div>
      <div class="form-group full">
        <label class="form-label">Notes</label>
        <textarea class="form-input" id="f_notes" rows="3" placeholder="Any notes about this unit..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeAddModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveUnit()">Save Unit</button>
    </div>
  </div>
</div>

<script src="nexus-sidebar.js"></script>
<script>
// ─────────────────────────────────────────────────────────────
// Equipment Lifecycle — VIN-primary-key fleet management
// Storage key: nexus_equipment
// ─────────────────────────────────────────────────────────────

var EQ_KEY = 'nexus_equipment';
var currentFilter = 'all';
var currentTypeFilter = 'all';
var activeUnitId = null;
var editMode = false;

// ── SVG Icons per type ──
function typeIcon(type, size) {
  size = size || 26;
  var icons = {
    tractor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="'+size+'" height="'+size+'"><rect x="1" y="7" width="14" height="10" rx="1.5"/><path d="M15 9h4l3 4v4h-7V9z"/><circle cx="5.5" cy="19" r="2"/><circle cx="18.5" cy="19" r="2"/><path d="M7 7V5a2 2 0 012-2h3"/></svg>',
    trailer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="'+size+'" height="'+size+'"><rect x="2" y="6" width="18" height="11" rx="1.5"/><circle cx="6" cy="19" r="2"/><circle cx="16" cy="19" r="2"/><path d="M20 12h2"/></svg>',
    jeep:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="'+size+'" height="'+size+'"><rect x="3" y="9" width="16" height="8" rx="1.5"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="19" r="2"/><path d="M19 13h2v2h-2z"/></svg>',
    spreader:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="'+size+'" height="'+size+'"><rect x="1" y="10" width="22" height="4" rx="1"/><circle cx="4" cy="12" r="2"/><circle cx="20" cy="12" r="2"/><path d="M4 10V7M20 10V7M4 14v3M20 14v3"/></svg>'
  };
  return icons[type] || icons.tractor;
}

// ── Status badge HTML ──
function statusBadge(status) {
  var map = {

// ── Update KPIs ──
function updateKPIs(data) {
  var total = data.length;
  var active = data.filter(function(u){ return u.status==='active'; }).length;
  var value = data.reduce(function(s,u){ return s + (parseFloat(u.current_value)||0); }, 0);
  var today = new Date();
  var in30 = new Date(today); in30.setDate(in30.getDate()+30);
  var expiring = data.filter(function(u){
    if (!u.insurance_expiry) return false;
    var d = new Date(u.insurance_expiry);
    return d >= today && d <= in30;
  }).length;

  document.getElementById('kpiTotal').textContent = total;
  document.getElementById('kpiActive').textContent = active;
  document.getElementById('kpiValue').textContent = value > 0 ? '$'+value.toLocaleString() : '$0';

  var kpiExp = document.getElementById('kpiExpiring');
  kpiExp.textContent = expiring;
  if (expiring > 0) {
    kpiExp.className = 'kpi-val red';
    document.getElementById('kpiExpiringSub').textContent = 'within 30 days — URGENT';
  } else {
    kpiExp.className = 'kpi-val green';
    document.getElementById('kpiExpiringSub').textContent = 'within 30 days';
  }
}

// ── Days until a date ──
function daysUntil(dateStr) {
  if (!dateStr) return null;
  var diff = new Date(dateStr) - new Date();
  return Math.ceil(diff / 86400000);
}

// ── Render card grid ──
function renderGrid() {
  var data = loadEquipment();
  updateKPIs(data);

  var filtered = data.filter(function(u){
    var statusOk = currentFilter === 'all' || u.status === currentFilter;
    var typeOk   = currentTypeFilter === 'all' || u.type === currentTypeFilter;
    return statusOk && typeOk;
  });

  var grid = document.getElementById('eqGrid');
  var empty = document.getElementById('emptyState');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(function(u) {
    var days = daysUntil(u.insurance_expiry);
    var insHtml = '';
    if (u.insurance_expiry) {
      var warn = days !== null && days <= 30;
      insHtml = '<span class="eq-meta'+(warn?' eq-expiry-warn':'')+'">' +
        '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm-.5 4h1v5h-1zm0 6h1v1.5h-1z"/></svg>' +
        'Ins. '+u.insurance_expiry+(warn?' ('+days+'d)':'')+
        '</span>';
    }
    var mileHtml = u.mileage ? '<span class="eq-meta"><svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zM3 8h2M11 8h2M8 3v2M8 11v2"/></svg>'+Number(u.mileage).toLocaleString()+' mi</span>' : '';
    return '<div class="eq-card" onclick="openDetail(\''+u.id+'\')">'+
      '<div class="eq-card-header">'+
        '<div class="eq-icon '+u.type+'">'+typeIcon(u.type, 26)+'</div>'+
        '<div class="eq-info">'+
          '<div class="eq-unit">'+u.unit_number+' &nbsp;·&nbsp; '+u.type.toUpperCase()+'</div>'+
          '<div class="eq-name">'+u.year+' '+u.make+' '+u.model+'</div>'+
          '<div class="eq-vin">VIN: '+u.vin+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="eq-card-body">'+
        statusBadge(u.status)+
        mileHtml+
        insHtml+
      '</div>'+
    '</div>';
  }).join('');
}

// ── Status filter ──
function setFilter(status, el) {
  currentFilter = status;
  document.querySelectorAll('[data-status]').forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active');
  renderGrid();
}

// ── Type filter ──
function setTypeFilter(type, el) {
  currentTypeFilter = type;
  document.querySelectorAll('[data-type]').forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active');
  renderGrid();
}

// ── Open detail panel ──
function openDetail(id) {
  activeUnitId = id;
  editMode = false;
  var data = loadEquipment();
  var unit = data.find(function(u){ return u.id === id; });
  if (!unit) return;

  // Header
  document.getElementById('detailHdrUnit').textContent = unit.unit_number + ' · ' + unit.type.toUpperCase();
  document.getElementById('detailHdrTitle').textContent = unit.year + ' ' + unit.make + ' ' + unit.model;
  document.getElementById('detailHdrIcon').innerHTML = typeIcon(unit.type, 24);

  // Render tabs
  renderTabOverview(unit);
  renderTabMaintenance(unit);
  renderTabTires(unit);
  renderTabDocuments(unit);
  renderTabFinancials(unit);

  // Switch to overview
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.querySelectorAll('.tab-pane').forEach(function(p){ p.classList.remove('active'); });
  document.querySelector('.tab-btn').classList.add('active');
  document.getElementById('tab-overview').classList.add('active');

  document.getElementById('detailOverlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  activeUnitId = null;
  editMode = false;
}

// ── Tab switcher ──
function switchTab(name, el) {
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.querySelectorAll('.tab-pane').forEach(function(p){ p.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

function saveEditMode() {
  var data = loadEquipment();
  var idx = data.findIndex(function(u){ return u.id === activeUnitId; });
  if (idx < 0) return;
  var u = data[idx];
  var fields = {
    unit_number: 'e_unit_number', type: 'e_type', year: 'e_year', make: 'e_make',
    model: 'e_model', vin: 'e_vin', color: 'e_color', status: 'e_status',
    mileage: 'e_mileage', fleet_number: 'e_fleet_number', usdot: 'e_usdot',
    license_plate: 'e_license_plate', plate_state: 'e_plate_state',
    insurance_carrier: 'e_ins_carrier', insurance_policy: 'e_ins_policy',
    insurance_expiry: 'e_ins_expiry', insurance_coverage: 'e_ins_coverage',
    registration_expiry: 'e_reg_expiry', registration_state: 'e_reg_state',
    purchase_date: 'e_purchase_date', purchase_price: 'e_purchase_price',
    current_value: 'e_current_value', monthly_depreciation: 'e_monthly_dep',
    notes: 'e_notes'
  };
  Object.keys(fields).forEach(function(key) {
    var el = document.getElementById(fields[key]);
    if (el) u[key] = el.value;
  });
  data[idx] = u;
  saveEquipment(data);
  renderGrid();
  openDetail(activeUnitId); // re-render panel
}

function cancelEditMode() {
  var data = loadEquipment();
  var unit = data.find(function(u){ return u.id === activeUnitId; });
  if (unit) renderTabOverview(unit);
  editMode = false;
}

function deleteUnit(id) {
  if (!confirm('Delete this unit? This cannot be undone.')) return;
  var data = loadEquipment().filter(function(u){ return u.id !== id; });
  saveEquipment(data);
  closeDetail();
  renderGrid();
}

// ── Tab: Financials ──
function renderTabFinancials(unit) {
  // Calc total repair cost from maintenance records
  var maint = [];
  try { maint = JSON.parse(localStorage.getItem('nexus_maintenance') || '[]'); } catch(e){}
  var repairCost = maint
    .filter(function(r){ return (r.unit_number||r.unit||'').toLowerCase() === unit.unit_number.toLowerCase(); })
    .reduce(function(s,r){ return s + (parseFloat(r.cost)||0); }, 0);

  var purchasePrice = parseFloat(unit.purchase_price) || 0;
  var currentValue  = parseFloat(unit.current_value)  || 0;
  var monthlyDep    = parseFloat(unit.monthly_depreciation) || 0;
  var totalDepreciation = purchasePrice > 0 && currentValue > 0 ? purchasePrice - currentValue : 0;

  var html = '<div class="section-hdr">Purchase &amp; Value</div>';
  html += '<div class="fields-grid">'+
    fv('Purchase Date', unit.purchase_date) +
    fv('Purchase Price', purchasePrice > 0 ? '$'+purchasePrice.toLocaleString() : '—') +
    fv('Current Est. Value', currentValue > 0 ? '$'+currentValue.toLocaleString() : '—') +
    fv('Monthly Depreciation', monthlyDep > 0 ? '$'+monthlyDep.toLocaleString()+'/mo' : '—') +
  '</div>';

  html += '<div class="section-hdr" style="margin-top:20px;">Cost Summary</div>';
  html += '<div class="fields-grid">'+
    fv('Total Depreciation', totalDepreciation > 0 ? '$'+totalDepreciation.toLocaleString() : '—') +
    fv('Total Repair Costs', repairCost > 0 ? '$'+repairCost.toLocaleString() : '$0') +
    fv('Total Cost of Ownership', (totalDepreciation + repairCost) > 0 ? '$'+(totalDepreciation + repairCost).toLocaleString() : '—') +
  '</div>';

  if (repairCost === 0 && purchasePrice === 0) {
    html += '<div class="no-records" style="margin-top:20px;">No financial data entered yet. Edit this unit to add purchase price and current value.</div>';
  }

  document.getElementById('tab-financials').innerHTML = html;
}

  var data = loadEquipment();
  var vin = document.getElementById('f_vin').value.trim() || 'N/A';

  // Check for duplicate VIN (unless N/A)
  if (vin !== 'N/A') {
    var exists = data.find(function(u){ return u.vin === vin; });
    if (exists) { alert('A unit with VIN "'+vin+'" already exists ('+exists.unit_number+').'); return; }
  }

  var unit = {
    id:                   'eq_'+Date.now(),
    vin:                  vin,
    unit_number:          unit_number,
    type:                 document.getElementById('f_type').value,
    year:                 document.getElementById('f_year').value,
    make:                 document.getElementById('f_make').value,
    model:                document.getElementById('f_model').value,
    color:                document.getElementById('f_color').value,
    license_plate:        document.getElementById('f_plate').value,
    plate_state:          document.getElementById('f_plate_state').value,
    usdot:                document.getElementById('f_usdot').value,
    fleet_number:         '',
    status:               document.getElementById('f_status').value,
    purchase_date:        document.getElementById('f_purchase_date').value,
    purchase_price:       document.getElementById('f_purchase_price').value,
    current_value:        document.getElementById('f_current_value').value,
    monthly_depreciation: '',
    mileage:              document.getElementById('f_mileage').value,
    insurance_policy:     document.getElementById('f_ins_policy').value,
    insurance_carrier:    document.getElementById('f_ins_carrier').value,
    insurance_expiry:     document.getElementById('f_ins_expiry').value,
    insurance_coverage:   '',
    registration_expiry:  document.getElementById('f_reg_expiry').value,
    registration_state:   document.getElementById('f_reg_state').value,
    notes:                document.getElementById('f_notes').value,
  };
  data.push(unit);
  saveEquipment(data);
  closeAddModal();
  renderGrid();
}

// ── Keyboard shortcut ──
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeDetail();
});

// ── Init ──
seedIfEmpty();
renderGrid();
</script>
</body>
</html>
