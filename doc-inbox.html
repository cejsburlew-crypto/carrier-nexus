<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Inbox — Carrier Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
      --bg: #f0f2f5;
      --panel: #ffffff;
      --panel2: #f8f9fa;
      --border: #d0d7de;
      --text: #111827;
      --mid: #4b5563;
      --blue: #1d4ed8;
      --green: #15803d;
      --yellow: #a16207;
      --red: #dc2626;
      --orange: #c2410c;
    }
  :root{--black:#0a0a0a;--gunmetal:#111111;--gunmetal-light:#1a1a1a;--white:#f1f5f9;--white-pure:#fff;--orange:#e8640a;--pink:#e91e8c;--pink-dark:#c2185b;--text-muted:#64748b;--text-mid:#94a3b8;--border:#1e1e1e;--red:#ef4444;--green:#22c55e;--yellow:#fbbf24;--blue:#3d87c8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--white);font-family:'Barlow',sans-serif;display:flex;min-height:100vh;}
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 22px;background:var(--gunmetal);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
.page-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;letter-spacing:.12em;color:var(--white-pure);}
.page-subtitle{font-size:11px;color:var(--text-muted);margin-top:2px;font-family:'JetBrains Mono',monospace;}
.topbar-actions{display:flex;gap:7px;}
/* STATS */
.stats-bar{display:flex;gap:10px;padding:13px 22px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--gunmetal);}
.stat{background:var(--gunmetal-light);border:1px solid var(--border);border-radius:7px;padding:9px 14px;display:flex;flex-direction:column;min-width:100px;}
.stat-num{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:var(--white-pure);}
.stat-num.ora{color:var(--orange);}.stat-num.grn{color:var(--green);}.stat-num.pnk{color:var(--pink);}.stat-num.yel{color:var(--yellow);}
.stat-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-top:1px;letter-spacing:.06em;text-transform:uppercase;}
/* WORKSPACE */
.workspace{display:flex;flex:1;overflow:hidden;height:calc(100vh - 112px);}
/* LIST PANEL */
.list-panel{width:400px;min-width:320px;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
.list-toolbar{display:flex;align-items:center;gap:7px;padding:10px 13px;border-bottom:1px solid var(--border);background:var(--gunmetal);}
.list-search{flex:1;background:#0a0a0a;border:1px solid var(--border);border-radius:5px;color:var(--white);padding:6px 9px;font-size:12px;font-family:'Barlow',sans-serif;}
.list-search:focus{outline:none;border-color:var(--blue);}
.list-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--gunmetal);}
.list-tab{flex:1;padding:8px 4px;font-size:10px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:.06em;color:var(--text-muted);cursor:pointer;text-align:center;border-bottom:2px solid transparent;}
.list-tab:hover{color:var(--white);}
.list-tab.active{color:var(--pink);border-bottom-color:var(--pink);}
.list-tab .ct{background:rgba(239,68,68,.7);color:#fff;font-size:9px;padding:0 4px;border-radius:3px;margin-left:3px;font-family:'JetBrains Mono',monospace;}
.list-tab .ct.g{background:rgba(34,197,94,.2);color:var(--green);}
.file-list{flex:1;overflow-y:auto;}
.file-list::-webkit-scrollbar{width:3px;}
.file-list::-webkit-scrollbar-thumb{background:var(--border);}
/* FILE ROWS */
.frow{display:flex;align-items:flex-start;gap:9px;padding:10px 13px;border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer;transition:background .1s;position:relative;}
.frow:hover{background:rgba(255,255,255,.025);}
.frow.sel{background:rgba(233,30,140,.08);border-left:3px solid var(--pink);}
.frow.done{opacity:.65;}
.ficon{width:30px;height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0;}
.fi-pdf{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2);}
.fi-doc{background:rgba(46,109,164,.15);color:#60a5fa;border:1px solid rgba(46,109,164,.2);}
.fi-xls{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.2);}
.fi-img{background:rgba(233,30,140,.12);color:var(--pink);border:1px solid rgba(233,30,140,.2);}
.fi-oth{background:rgba(100,116,139,.12);color:var(--text-mid);border:1px solid rgba(100,116,139,.2);}
.frow-info{flex:1;min-width:0;}
.frow-name{font-size:12px;font-weight:600;color:var(--white-pure);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.frow-meta{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-top:1px;}
.frow-chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;}
.chip{font-size:9px;font-weight:700;font-family:'JetBrains Mono',monospace;padding:1px 5px;border-radius:3px;}
.ch-d{background:rgba(233,30,140,.15);color:var(--pink);border:1px solid rgba(233,30,140,.2);}
.ch-l{background:rgba(46,109,164,.15);color:#60a5fa;border:1px solid rgba(46,109,164,.2);}
.ch-c{background:rgba(232,100,10,.12);color:var(--orange);border:1px solid rgba(232,100,10,.2);}
.ch-dt{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2);}
.ch-x{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.saved-stamp{position:absolute;right:8px;top:8px;font-size:8px;font-family:'JetBrains Mono',monospace;color:var(--green);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);padding:1px 4px;border-radius:3px;}
/* DETAIL */
.detail-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--text-muted);gap:10px;}
.detail-empty-icon{font-size:38px;opacity:.25;}
/* FILE HEADER */
.file-hdr{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;background:var(--gunmetal);border-bottom:1px solid var(--border);}
.fhdr-icon{width:42px;height:42px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0;}
.fhdr-info{flex:1;min-width:0;}
.fhdr-name{font-size:14px;font-weight:700;color:var(--white-pure);word-break:break-word;}
.fhdr-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:2px;}
.fhdr-tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
.atag{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;font-family:'JetBrains Mono',monospace;padding:2px 6px;border-radius:3px;}
.atag.ok{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2);}
.atag.warn{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);}
/* FORM */
.form-scroll{flex:1;overflow-y:auto;padding:18px 20px;}
.form-scroll::-webkit-scrollbar{width:3px;}
.form-scroll::-webkit-scrollbar-thumb{background:var(--border);}
.sec-head{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--text-muted);margin:14px 0 10px;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.sec-head::after{content:'';flex:1;height:1px;background:var(--border);}
.sec-head:first-child{margin-top:0;}
.fg{margin-bottom:12px;}
.fl{display:block;font-size:9px;font-weight:700;color:var(--text-muted);letter-spacing:.07em;margin-bottom:3px;text-transform:uppercase;font-family:'JetBrains Mono',monospace;}
.atag-inline{font-size:9px;font-weight:700;font-family:'JetBrains Mono',monospace;padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:middle;}
.atag-inline.ok{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2);}
.atag-inline.no{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.fi,.fs,.fta{width:100%;padding:7px 10px;background:#0a0a0a;border:1px solid var(--border);border-radius:5px;color:var(--white);font-size:12px;font-family:'Barlow',sans-serif;transition:border-color .12s;}
.fi:focus,.fs:focus,.fta:focus{outline:none;border-color:var(--blue);}
.fs{cursor:pointer;}
.fta{resize:vertical;min-height:55px;}
.fh{font-size:10px;color:var(--text-muted);margin-top:2px;}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.field-group{background:var(--gunmetal-light);border:1px solid var(--border);border-radius:7px;padding:14px;margin-bottom:12px;display:none;}
.field-group.show{display:block;}
/* PERIOD DISPLAY */
.period-box{background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2);border-radius:5px;padding:7px 10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--green);}
/* EXTRACTED */
.ext-box{background:#0a0a0a;border:1px solid var(--border);border-radius:5px;padding:9px 11px;font-size:10px;color:var(--text-mid);line-height:1.6;font-family:'JetBrains Mono',monospace;white-space:pre-wrap;max-height:120px;overflow-y:auto;margin-top:5px;}
/* SAVE BAR */
.save-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--gunmetal);border-top:1px solid var(--border);}
.save-bar-l{font-size:11px;color:var(--text-muted);}
.save-bar-r{display:flex;gap:7px;}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:5px;font-size:12px;font-weight:600;font-family:'Barlow',sans-serif;cursor:pointer;border:none;transition:all .13s;letter-spacing:.04em;white-space:nowrap;}
.btn-pink{background:linear-gradient(135deg,#c2185b,#e91e8c);color:#fff;}
.btn-pink:hover{filter:brightness(1.1);}
.btn-orange{background:linear-gradient(135deg,#e8640a,#ff7518);color:#fff;}
.btn-ghost{background:transparent;color:var(--text-mid);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--gunmetal-light);color:var(--white);}
.btn-green{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.btn-sm{padding:4px 9px;font-size:11px;}
/* BANNER */
.bnr{padding:9px 14px;border-radius:5px;font-size:12px;display:flex;gap:7px;align-items:center;margin-bottom:10px;}
.bnr-ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);color:var(--green);}
.bnr-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:var(--red);}
.bnr-info{background:rgba(46,109,164,.1);border:1px solid rgba(46,109,164,.25);color:#60a5fa;}
/* SPINNER */
.spin{width:13px;height:13px;border:2px solid rgba(233,30,140,.2);border-top-color:var(--pink);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.loading-r{display:flex;align-items:center;gap:9px;padding:20px;color:var(--text-muted);font-size:13px;}
.no-files{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 20px;color:var(--text-muted);}
.db-saved{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--green);padding:2px 7px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:3px;}
/* SAVED DOC GRID */
.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px;}
.rec-field{display:flex;flex-direction:column;gap:2px;}
.rec-field-label{font-size:9px;font-weight:700;color:var(--text-muted);font-family:'JetBrains Mono',monospace;letter-spacing:.07em;text-transform:uppercase;}
.rec-field-val{font-size:12px;color:var(--white-pure);}
@media(max-width:768px){.main{margin-left:0;}.workspace{flex-direction:column;height:auto;}.list-panel{width:100%;height:40vh;}.detail-panel{height:60vh;}.rec-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<script src="nexus-config.js"></script>
<script src="nexus-sidebar.js"></script>
<script src="nexus-docs.js"></script>

<div class="main">
  <div class="topbar">
    <div>
      <div class="page-title">DOCUMENT INBOX</div>
      <div class="page-subtitle">Review · Classify · Save to Driver Records</div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm" onclick="loadInbox()">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="1 4 1 10 7 10"/><path d="M1.5 8A7 7 0 1014.5 8"/></svg>
        Refresh
      </button>
      <button class="btn btn-orange btn-sm" id="batch-btn" onclick="routeAllAuto()" style="display:none;">Route Auto-Matched</button>
      <button class="btn btn-pink btn-sm" id="auth-btn" onclick="handleAuthClick()">Connect Drive</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat"><div class="stat-num ora" id="s-inbox">0</div><div class="stat-label">In Inbox</div></div>
    <div class="stat"><div class="stat-num yel" id="s-review">0</div><div class="stat-label">Needs Review</div></div>
    <div class="stat"><div class="stat-num grn" id="s-today">0</div><div class="stat-label">Saved Today</div></div>
    <div class="stat"><div class="stat-num" id="s-rc">0</div><div class="stat-label">Rate Cons DB</div></div>
    <div class="stat"><div class="stat-num" id="s-exp">0</div><div class="stat-label">Expenses DB</div></div>
    <div class="stat"><div class="stat-num" id="s-per">0</div><div class="stat-label">Permits DB</div></div>
    <div class="stat"><div class="stat-num" id="s-drivers">0</div><div class="stat-label">Drivers w/Records</div></div>
  </div>

  <div class="workspace">
    <!-- LIST -->
    <div class="list-panel">
      <div class="list-toolbar">
        <input class="list-search" id="srch" placeholder="Search files…" oninput="renderList(this.value)">
        <button class="btn btn-ghost btn-sm" onclick="loadInbox()">
          <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="1 4 1 10 7 10"/><path d="M1.5 8A7 7 0 1014.5 8"/></svg>
        </button>
      </div>
      <div class="list-tabs">
        <div class="list-tab active" id="tl-inbox"  onclick="switchTab('inbox')">INBOX <span class="ct" id="ct-inbox">0</span></div>
        <div class="list-tab" id="tl-saved"  onclick="switchTab('saved')">SAVED <span class="ct g" id="ct-saved">0</span></div>
        <div class="list-tab" id="tl-all"    onclick="switchTab('all')">ALL DB</div>
      </div>
      <div class="file-list" id="file-list">
        <div class="loading-r"><div class="spin"></div>Loading…</div>
      </div>
    </div>

    <!-- DETAIL -->
    <div class="detail-panel" id="detail-panel">
      <div class="detail-empty">
        <div class="detail-empty-icon">📂</div>
        <div style="font-size:13px;font-weight:600;">Select a document</div>
        <div style="font-size:12px;">Review, classify, and save it to the driver database</div>
      </div>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async></script>
<script>
// ─── STATE ──────────────────────────────────────────────
const K = { inbox:'nexus_inbox_folder', drivers:'nexus_driver_vaults', categories:'nexus_drive_categories', patterns:'nexus_drive_patterns', token:'nexus_drive_token', period:'nexus_settlement_period' };
const DEFAULT_CATS = [
  {name:'Rate Cons',emoji:'📋',keywords:'rate con,ratecon,rc-,bol,bill of lading,load'},
  {name:'Expenses', emoji:'💰',keywords:'expense,exp,receipt,reimburs'},
  {name:'Permits',  emoji:'📄',keywords:'permit,prmt,oversize,overweight'},
  {name:'Personal', emoji:'🪪',keywords:'coi,insurance,license,cdl,lease,contract,agreement'},
  {name:'Health',   emoji:'🏥',keywords:'health,drug test,dac,physical'},
  {name:'Vehicles', emoji:'🚛',keywords:'vehicle,truck,trailer,registration,title,vin,inspection'},
];
const TYPE_LABELS = { rate_con:'Rate Con', permit:'Permit', expense:'Expense', personal:'Personal', health:'Health', vehicle:'Vehicle', other:'Other' };

let _token    = localStorage.getItem(K.token) || null;
let _tclient  = null;
let _inbox    = [];   // drive files
let _tab      = 'inbox';
let _selected = null;

function ls(k){ try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;} }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(b){ if(!b)return '—'; b=parseInt(b); if(b<1024)return b+'B'; if(b<1048576)return Math.round(b/1024)+'KB'; return (b/1048576).toFixed(1)+'MB'; }
function fdate(s){ return s?s.split('T')[0]:'—'; }
function cats(){ const s=ls(K.categories); return(s&&s.length)?s:DEFAULT_CATS; }
function drivers(){ return ls(K.drivers)||[]; }
function pats(){ return ls(K.patterns)||{}; }

// ─── GUESS ROUTING ──────────────────────────────────────
function guess(file){
  const n = (file.name||'').toLowerCase();
  const p = pats();
  const loadRx = new RegExp(p.load||'\\b\\d{6,7}\\b|rc-\\d+|bol-\\d+','i');
  const loadM  = n.match(loadRx);
  const load   = loadM ? loadM[0].replace(/\s/g,'') : null;
  let driver=null, driverId=null;
  for(const d of drivers()){
    const ss=(d.shortNames||d.name||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
    if(ss.some(s=>n.includes(s))){ driver=d.name; driverId=d.id; break; }
  }
  let cat=null, rtype=null;
  if(load){ cat='Rate Cons'; rtype='rate_con'; }
  for(const c of cats()){
    const kws=(c.keywords||'').split(',').map(k=>k.trim().toLowerCase()).filter(Boolean);
    if(kws.some(k=>n.includes(k))){
      cat=c.name;
      if(c.name.toLowerCase().includes('permit')) rtype='permit';
      else if(c.name.toLowerCase().includes('expense')) rtype='expense';
      else if(c.name.toLowerCase().includes('rate')) rtype='rate_con';
      else if(c.name.toLowerCase().includes('personal')) rtype='personal';
      else if(c.name.toLowerCase().includes('health')) rtype='health';
      else if(c.name.toLowerCase().includes('vehicle')) rtype='vehicle';
      else rtype=rtype||'other';
      break;
    }
  }
  rtype = rtype||'expense';
  const dateRx=/(\d{2})(\d{2})(\d{4})|(\d{4})[-\/](\d{2})[-\/](\d{2})/;
  const dm=n.match(dateRx);
  let docDate=null;
  if(dm){ docDate=dm[3]?`${dm[3]}-${dm[1]}-${dm[2]}`:`${dm[4]}-${dm[5]}-${dm[6]}`; }
  else if(file.modifiedTime){ docDate=fdate(file.modifiedTime); }
  return { load, driver, driverId, cat, rtype, docDate, conf: driver&&cat?'high':driver||cat?'medium':'low' };
}

// ─── STATS ──────────────────────────────────────────────
function refreshStats(){
  const st   = NexusDocs.stats();
  const today= new Date().toISOString().split('T')[0];
  const recs = NexusDocs.getAll();
  document.getElementById('s-inbox').textContent   = _inbox.length;
  document.getElementById('s-review').textContent  = _inbox.filter(f=>guess(f).conf==='low').length;
  document.getElementById('s-today').textContent   = recs.filter(r=>r.createdAt&&r.createdAt.startsWith(today)).length;
  document.getElementById('s-rc').textContent      = st.rateCons;
  document.getElementById('s-exp').textContent     = st.expenses;
  document.getElementById('s-per').textContent     = st.permits;
  document.getElementById('s-drivers').textContent = st.drivers;
  document.getElementById('ct-inbox').textContent  = _inbox.length;
  document.getElementById('ct-saved').textContent  = recs.filter(r=>r.createdAt&&r.createdAt.startsWith(today)).length;
  const autos = _inbox.filter(f=>{ const g=guess(f); return g.driver&&g.cat; }).length;
  const bb = document.getElementById('batch-btn');
  bb.style.display = autos>0?'flex':'none';
  bb.textContent = `Route Auto-Matched (${autos})`;
}

// ─── FILE ICON ──────────────────────────────────────────
function ficon(mime){
  if(mime==='application/pdf')         return {cls:'fi-pdf',lbl:'PDF'};
  if((mime||'').includes('document'))  return {cls:'fi-doc',lbl:'DOC'};
  if((mime||'').includes('spreadsheet'))return {cls:'fi-xls',lbl:'XLS'};
  if((mime||'').startsWith('image/'))  return {cls:'fi-img',lbl:'IMG'};
  return {cls:'fi-oth',lbl:'FILE'};
}

// ─── LIST ────────────────────────────────────────────────
function switchTab(t){
  _tab=t;
  ['inbox','saved','all'].forEach(x=>{
    document.getElementById('tl-'+x).classList.toggle('active',x===t);
  });
  renderList(document.getElementById('srch').value);
}

function renderList(filter){
  const el=document.getElementById('file-list');
  filter=(filter||'').toLowerCase();
  if(_tab==='inbox'){
    let files=_inbox;
    if(filter) files=files.filter(f=>f.name.toLowerCase().includes(filter));
    if(!files.length){ el.innerHTML=`<div class="no-files"><div style="font-size:28px;opacity:.3;">📭</div><div style="font-size:12px;margin-top:8px;">${_inbox.length?'No matches':'Inbox empty'}</div></div>`; return; }
    el.innerHTML=files.map(f=>{
      const g=guess(f); const ic=ficon(f.mimeType);
      const isSel=_selected&&_selected.src==='inbox'&&_selected.id===f.id;
      let chips='';
      chips+=g.driver?`<span class="chip ch-d">👤 ${esc(g.driver)}</span>`:`<span class="chip ch-x">👤?</span>`;
      if(g.load)  chips+=`<span class="chip ch-l">📋 ${esc(g.load)}</span>`;
      if(g.rtype) chips+=`<span class="chip ch-c">${esc(TYPE_LABELS[g.rtype]||g.rtype)}</span>`;
      if(g.docDate) chips+=`<span class="chip ch-dt">📅 ${esc(g.docDate)}</span>`;
      return `<div class="frow${isSel?' sel':''}" onclick="selFile('${f.id}')">
        <div class="ficon ${ic.cls}">${ic.lbl}</div>
        <div class="frow-info">
          <div class="frow-name">${esc(f.name)}</div>
          <div class="frow-meta">${fdate(f.modifiedTime)} · ${fmt(f.size)}</div>
          <div class="frow-chips">${chips}</div>
        </div>
      </div>`;
    }).join('');
  } else {
    let recs=NexusDocs.getAll();
    if(_tab==='saved'){ const t=new Date().toISOString().split('T')[0]; recs=recs.filter(r=>r.createdAt&&r.createdAt.startsWith(t)); }
    if(filter) recs=recs.filter(r=>(r.fileName||r.ourDriver||'').toLowerCase().includes(filter));
    if(!recs.length){ el.innerHTML=`<div class="no-files"><div style="font-size:28px;opacity:.3;">🗄</div><div style="font-size:12px;margin-top:8px;">No records${_tab==='saved'?' saved today':''}</div></div>`; return; }
    el.innerHTML=recs.map(r=>{
      const ic=ficon(r.fileType==='pdf'?'application/pdf':'');
      const isSel=_selected&&_selected.src==='db'&&_selected.id===r.id;
      return `<div class="frow done${isSel?' sel':''}" onclick="selRec('${r.id}')">
        <div class="ficon ${ic.cls}">${ic.lbl}</div>
        <div class="frow-info">
          <div class="frow-name">${esc(r.fileName||r.rateConNumber||r.id)}</div>
          <div class="frow-meta">${fdate(r.recordDate)} · ${esc(r.ourDriver||'—')} · ${esc(r.recordType||'—')}</div>
          <div class="frow-chips">
            <span class="chip ch-d">👤 ${esc(r.ourDriver||'?')}</span>
            <span class="chip ch-c">${esc(TYPE_LABELS[r.recordType]||r.recordType||'?')}</span>
            ${r.settlementPeriod?`<span class="chip ch-dt">📅 ${esc(r.settlementPeriod)}</span>`:''}
          </div>
        </div>
        <span class="saved-stamp">SAVED</span>
      </div>`;
    }).join('');
  }
}

function selFile(id){ const f=_inbox.find(x=>x.id===id); if(!f)return; _selected={src:'inbox',id,data:f}; renderList(document.getElementById('srch').value); buildForm(f); }
function selRec(id){ const r=NexusDocs.getById(id); if(!r)return; _selected={src:'db',id,data:r}; renderList(document.getElementById('srch').value); showSaved(r); }

// ─── PERIOD CALC ─────────────────────────────────────────
function calcPeriod(ds){
  if(!ds)return'';
  const type=localStorage.getItem(K.period)||'biweekly';
  const d=new Date(ds); if(isNaN(d))return'';
  const y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
  if(type==='weekly'){ const s=new Date(d); s.setDate(day-d.getDay()); return 'Week of '+s.toISOString().split('T')[0]; }
  if(type==='biweekly'){ const j=new Date(y,0,1),doy=Math.floor((d-j)/86400000),pn=Math.floor(doy/14),s=new Date(j); s.setDate(1+pn*14); const e=new Date(s); e.setDate(s.getDate()+13); return s.toISOString().split('T')[0]+' – '+e.toISOString().split('T')[0]; }
  if(type==='semimonthly'){ return `${y}-${String(m+1).padStart(2,'0')} ${day<=15?'1st–15th':'16th–EOM'}`; }
  return `${y}-${String(m+1).padStart(2,'0')} (Monthly)`;
}

// ─── EXTRACT TEXT ────────────────────────────────────────
async function extractText(fid, mime){
  if(!_token){ alert('Connect Google Drive first.'); return; }
  let em=null;
  if(mime.includes('document')) em='text/plain';
  if(mime.includes('spreadsheet')) em='text/csv';
  const box=document.getElementById('ext-box');
  box.style.display='block';
  if(!em){ box.textContent='Text extraction available for Google Docs/Sheets only. PDF is linked by filename.'; return; }
  box.textContent='Extracting…';
  try{
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${fid}/export?mimeType=${encodeURIComponent(em)}`,{headers:{Authorization:'Bearer '+_token}});
    if(!r.ok) throw new Error('Export error '+r.status);
    const t=(await r.text()).substring(0,600);
    box.textContent=t||'(empty)';
    document.getElementById('ext-hidden').value=t;
  }catch(e){ box.textContent='Error: '+e.message; }
}

// ─── SAVE RECORD ─────────────────────────────────────────
async function saveRecord(fileId){
  const f=_inbox.find(x=>x.id===fileId); if(!f)return;
  const rtype  = document.getElementById('f-type').value;
  const driver = document.getElementById('f-driver').value;
  const date   = document.getElementById('f-date').value;
  const disp   = document.getElementById('f-disp').value.trim();
  const truck  = document.getElementById('f-truck').value.trim();
  const notes  = document.getElementById('f-notes').value.trim();
  const ext    = document.getElementById('ext-hidden').value.trim();

  if(!rtype) { showFBnr('err','Select a record type.'); return; }

  const mime=f.mimeType||'';
  let ft='other';
  if(mime==='application/pdf') ft='pdf';
  else if(mime.includes('document')) ft='doc';
  else if(mime.includes('spreadsheet')) ft='sheet';
  else if(mime.startsWith('image/')) ft='image';

  const rec={
    driveFileId: f.id, driveFolderId: ls(K.inbox)?ls(K.inbox).id:null,
    fileName: f.name, fileType: ft,
    fileSizeBytes: f.size?parseInt(f.size):null, driveUrl: f.webViewLink||null,
    recordType: rtype, recordDate: date||null,
    ourDriver: driver||null, ourDispatcher: disp||null,
    truckUnit: truck||null, trailerType: document.getElementById('f-trailer').value||null,
    extractedText: ext||null, notes, status:'active',
    createdAt: new Date().toISOString(),
  };

  // Type-specific fields
  if(rtype==='rate_con'){
    rec.rateConNumber        = document.getElementById('f-rcnum').value.trim()||null;
    rec.bolNumber            = document.getElementById('f-bol').value.trim()||null;
    rec.customerCompany      = document.getElementById('f-cust').value.trim()||null;
    rec.customerDispatchName = document.getElementById('f-cdname').value.trim()||null;
    rec.customerDispatchPhone= document.getElementById('f-cdphone').value.trim()||null;
    rec.customerDispatchEmail= document.getElementById('f-cdemail').value.trim()||null;
    rec.loadDescription      = document.getElementById('f-ldesc').value.trim()||null;
    rec.loadWeight           = document.getElementById('f-wt').value.trim()||null;
    rec.loadHeight           = document.getElementById('f-ht').value.trim()||null;
    rec.loadWidth            = document.getElementById('f-wd').value.trim()||null;
    rec.originAddress        = document.getElementById('f-orig').value.trim()||null;
    rec.destinationAddress   = document.getElementById('f-dest').value.trim()||null;
    rec.totalMiles           = parseInt(document.getElementById('f-miles').value)||null;
    rec.agreedRate           = parseFloat(document.getElementById('f-rate').value)||null;
    rec.fuelAdvance          = parseFloat(document.getElementById('f-fadv').value)||null;
    rec.detentionAmount      = parseFloat(document.getElementById('f-det').value)||null;
    rec.lumperFees           = parseFloat(document.getElementById('f-lump').value)||null;
    rec.invoiceNumber        = document.getElementById('f-inv').value.trim()||null;
    rec.invoiceAmount        = parseFloat(document.getElementById('f-invamt').value)||null;
    rec.invoiceStatus        = document.getElementById('f-invst').value||'unbilled';
    rec.driverPayAmount      = parseFloat(document.getElementById('f-dpay').value)||null;
    rec.dispatcherCommission = parseFloat(document.getElementById('f-dcom').value)||null;
    rec.factoringRef         = document.getElementById('f-facref').value.trim()||null;
    rec.podReceived          = document.getElementById('f-pod').value==='true';
    rec.podDate              = document.getElementById('f-poddate').value||null;
  } else if(rtype==='permit'){
    rec.permitState  = document.getElementById('f-pstate').value.trim()||null;
    rec.permitNumber = document.getElementById('f-pnum').value.trim()||null;
    rec.permitAmount = parseFloat(document.getElementById('f-pamt').value)||null;
    rec.rateConNumber= document.getElementById('f-prc').value.trim()||null;
  } else {
    rec.expenseType   = document.getElementById('f-exptype').value||null;
    rec.expenseAmount = parseFloat(document.getElementById('f-expamt').value)||null;
    rec.expenseVendor = document.getElementById('f-expven').value.trim()||null;
    rec.rateConNumber = document.getElementById('f-exprc').value.trim()||null;
  }

  try{
    const saved = await NexusDocs.save(rec);
    _inbox = _inbox.filter(x=>x.id!==fileId);
    _selected = {src:'db',id:saved.id,data:saved};
    refreshStats();
    renderList(document.getElementById('srch').value);
    showSaved(saved);
  }catch(e){ showFBnr('err','Save failed: '+e.message); }
}

function showFBnr(type,msg){
  const el=document.getElementById('form-bnr'); if(!el)return;
  el.style.display='flex'; el.className='bnr bnr-'+(type==='err'?'err':type==='ok'?'ok':'info'); el.innerHTML=msg;
  if(type!=='err') setTimeout(()=>el.style.display='none',4500);
}

function showSaved(r){
  const dp=document.getElementById('detail-panel');
  const label=TYPE_LABELS[r.recordType]||r.recordType||'Record';
  function rf(l,v){ return v?`<div class="rec-field"><div class="rec-field-label">${esc(l)}</div><div class="rec-field-val">${esc(String(v))}</div></div>`:''; }

  let fields=`${rf('Date',r.recordDate)}${rf('Driver',r.ourDriver)}${rf('Dispatcher',r.ourDispatcher)}${rf('Settlement Period',r.settlementPeriod)}`;
  if(r.recordType==='rate_con'){
    fields+=rf('Rate Con #',r.rateConNumber)+rf('BOL #',r.bolNumber)+rf('Customer',r.customerCompany)+rf('Dispatch Contact',r.customerDispatchName)+rf('Phone',r.customerDispatchPhone)+rf('Email',r.customerDispatchEmail)+rf('Origin',r.originAddress)+rf('Destination',r.destinationAddress)+rf('Miles',r.totalMiles)+rf('Weight',r.loadWeight)+rf('Height',r.loadHeight)+rf('Width',r.loadWidth)+rf('Description',r.loadDescription)+rf('Agreed Rate','$'+r.agreedRate)+rf('Fuel Advance',r.fuelAdvance?'$'+r.fuelAdvance:null)+rf('Detention',r.detentionAmount?'$'+r.detentionAmount:null)+rf('Driver Pay',r.driverPayAmount?'$'+r.driverPayAmount:null)+rf('Dispatch Commission',r.dispatcherCommission?'$'+r.dispatcherCommission:null)+rf('Invoice #',r.invoiceNumber)+rf('Invoice Status',r.invoiceStatus)+rf('POD Received',r.podReceived?'Yes':'No');
  } else if(r.recordType==='permit'){
    fields+=rf('Permit State',r.permitState)+rf('Permit #',r.permitNumber)+rf('Amount','$'+r.permitAmount)+rf('Linked Load',r.rateConNumber);
  } else {
    fields+=rf('Expense Type',r.expenseType)+rf('Amount','$'+r.expenseAmount)+rf('Vendor',r.expenseVendor)+rf('Linked Load',r.rateConNumber);
  }
  fields+=rf('Truck Unit',r.truckUnit)+rf('Trailer',r.trailerType)+rf('Notes',r.notes);

  dp.innerHTML=`
    <div class="file-hdr">
      <div class="fhdr-icon fi-doc" style="background:rgba(34,197,94,.12);color:var(--green);border-color:rgba(34,197,94,.2);">✓</div>
      <div class="fhdr-info">
        <div class="fhdr-name">${esc(r.fileName||label+' Record')}</div>
        <div class="fhdr-meta">Saved ${fdate(r.createdAt)} · ${esc(r.ourDriver||'No driver')} · ${label}</div>
        <div class="fhdr-tags">
          <span class="db-saved">✓ IN DATABASE</span>
          ${r.driveUrl?`<a href="${r.driveUrl}" target="_blank" style="font-size:10px;color:#60a5fa;text-decoration:none;">View in Drive ↗</a>`:''}
        </div>
      </div>
    </div>
    <div class="form-scroll">
      <div class="rec-grid">${fields}</div>
      ${r.extractedText?`<div style="padding:0 20px 16px;"><div class="fl" style="margin-bottom:5px;">EXTRACTED TEXT</div><div class="ext-box">${esc(r.extractedText)}</div></div>`:''}
    </div>
    <div class="save-bar">
      <div class="save-bar-l"><span class="db-saved">✓ Saved to database</span></div>
      <div class="save-bar-r">
        <button class="btn btn-ghost btn-sm" onclick="delRec('${r.id}')">Delete Record</button>
        ${r.driveUrl?`<a href="${r.driveUrl}" target="_blank" class="btn btn-pink btn-sm">Open in Drive ↗</a>`:''}
      </div>
    </div>`;
}

function delRec(id){
  if(!confirm('Delete this record from the database? File stays in Drive.'))return;
  NexusDocs.delete(id);
  _selected=null;
  refreshStats();
  renderList(document.getElementById('srch').value);
  document.getElementById('detail-panel').innerHTML=`<div class="detail-empty"><div class="detail-empty-icon">🗑</div><div style="font-size:13px;">Record deleted</div></div>`;
}

// ─── BATCH AUTO-ROUTE ────────────────────────────────────
async function routeAllAuto(){
  const auto=_inbox.filter(f=>{const g=guess(f);return g.driver&&g.cat;});
  if(!auto.length)return;
  if(!confirm(`Auto-route ${auto.length} file(s)? Records will be saved with auto-detected driver, type, and date. Review them in the Saved tab.`))return;
  for(const f of auto){
    const g=guess(f);
    const mime=f.mimeType||''; let ft='other';
    if(mime==='application/pdf')ft='pdf'; else if(mime.includes('document'))ft='doc'; else if(mime.includes('spreadsheet'))ft='sheet'; else if(mime.startsWith('image/'))ft='image';
    await NexusDocs.save({driveFileId:f.id,fileName:f.name,fileType:ft,fileSizeBytes:f.size?parseInt(f.size):null,driveUrl:f.webViewLink||null,recordType:g.rtype||'other',recordDate:g.docDate||null,ourDriver:g.driver,rateConNumber:g.load,status:'active',createdAt:new Date().toISOString()});
  }
  _inbox=_inbox.filter(f=>{const g=guess(f);return!(g.driver&&g.cat);});
  refreshStats();
  renderList(document.getElementById('srch').value);
  alert(`✅ ${auto.length} record(s) saved to driver databases.`);
}

// ─── DRIVE ───────────────────────────────────────────────
async function loadInbox(){
  const cfg=ls(K.inbox);
  const el=document.getElementById('file-list');
  if(!cfg||!cfg.id){ el.innerHTML=`<div class="no-files"><div style="font-size:26px;opacity:.3;">⚙️</div><div style="font-size:12px;margin-top:8px;">No inbox folder set</div><a href="drive-settings.html" style="font-size:11px;color:var(--pink);margin-top:4px;">Configure →</a></div>`; return; }
  if(!_token){ el.innerHTML=`<div class="no-files"><div style="font-size:26px;opacity:.3;">🔑</div><div style="font-size:12px;margin-top:8px;">Connect Google Drive first</div><div style="margin-top:8px;"><button class="btn btn-pink btn-sm" onclick="handleAuthClick()">Connect</button></div></div>`; return; }
  el.innerHTML=`<div class="loading-r"><div class="spin"></div>Reading inbox…</div>`;
  try{
    const url=`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(`'${cfg.id}' in parents and trashed=false`)}&fields=files(id,name,mimeType,size,modifiedTime,webViewLink)&pageSize=100&orderBy=modifiedTime+desc`;
    const r=await fetch(url,{headers:{Authorization:'Bearer '+_token}});
    if(!r.ok){ if(r.status===401){_token=null;setAuthBtn(false);} throw new Error('Drive error '+r.status); }
    _inbox=(await r.json()).files||[];
    refreshStats();
    renderList(document.getElementById('srch').value);
  }catch(e){ el.innerHTML=`<div style="padding:14px;"><div class="bnr bnr-err">${esc(e.message)}</div></div>`; }
}

// ─── AUTH ────────────────────────────────────────────────
function getCid(){ return (window.NEXUS_GOOGLE_CLIENT_ID||'').trim()||localStorage.getItem('nexus_temp_cid')||''; }
function initGIS(){
  const cid=getCid(); if(!cid)return;
  _tclient=google.accounts.oauth2.initTokenClient({client_id:cid,
    login_hint: 'crtruckus@gmail.com',scope:'https://www.googleapis.com/auth/drive.readonly',callback:resp=>{
    if(resp.error){alert('Auth error: '+resp.error);return;}
    _token=resp.access_token;localStorage.setItem(K.token,resp.access_token);setAuthBtn(true);loadInbox();
  }});
}
function handleAuthClick(){ if(!getCid()){window.open('drive-settings.html','_self');return;} if(!_tclient)initGIS(); if(_tclient)_tclient.requestAccessToken({prompt:''}); }
function setAuthBtn(yes){ document.getElementById('auth-btn').textContent=yes?'✓ Drive Connected':'Connect Drive'; document.getElementById('auth-btn').className=yes?'btn btn-green btn-sm':'btn btn-pink btn-sm'; }

// ─── INIT ────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  refreshStats();
  if(_token){setAuthBtn(true);loadInbox();}else{renderList();}
  const w=setInterval(()=>{ if(typeof google!=='undefined'&&google.accounts){clearInterval(w);initGIS();} },400);
});
</script>
