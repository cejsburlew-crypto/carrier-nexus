<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Invoicing — Carrier Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--sb:#000;--orange:#e8640a;--pink:#e91e8c;--blue:#2e6da4;--green:#22c55e;--red:#ef4444;--yellow:#fbbf24;--border:#e2e8f0;--muted:#64748b;--mid:#475569;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f1f5f9;color:#0f172a;font-family:'Barlow',sans-serif;display:flex;min-height:100vh;}
/* SIDEBAR */
.sidebar{width:220px;min-height:100vh;background:#000;border-right:1px solid #1a1a1a;display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;}
.sidebar-logo{padding:16px;display:flex;align-items:center;gap:10px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.07);}
.sidebar-logo .logo-hex svg{width:36px;height:36px;display:block;}
.sidebar-logo .logo-text{display:flex;flex-direction:column;gap:2px;}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;letter-spacing:2px;color:#fff;}
.sub{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,0.45);letter-spacing:1px;}
.sidebar-section{padding:12px 0 4px;}
.sidebar-section-label{padding:0 16px 6px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:rgba(255,255,255,0.3);letter-spacing:1.5px;text-transform:uppercase;display:block;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:7px 16px;text-decoration:none;color:#a0aec0;font-size:13px;border-left:3px solid transparent;transition:all .15s;}
.sidebar-link:hover{background:rgba(233,30,140,0.14);border-left-color:#c2185b;color:#fff;}
.sidebar-link.active{background:rgba(233,30,140,0.22);border-left:3px solid #e91e8c;color:#fff;}
.sidebar-link svg{width:14px;height:14px;flex-shrink:0;opacity:.7;}
.sidebar-link.active svg{opacity:1;}
.nav-badge{margin-left:auto;background:#e91e8c;color:#fff;font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 6px;border-radius:10px;}
.sidebar-spacer{flex:1;}
.sidebar-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,0.07);}
.user-name{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,0.6);font-weight:500;}
.user-role{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,0.3);margin-top:2px;}
/* MAIN */
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{height:56px;background:linear-gradient(135deg,#000 0%,#6b0000 45%,#c2185b 80%,#e91e8c 100%);border-bottom:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;padding:0 28px;gap:16px;position:sticky;top:0;z-index:50;}
.topbar-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;letter-spacing:2px;color:#fff;flex:1;}
.content{padding:24px 28px 48px;}
/* KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 20px;}
.kpi-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;color:#0f172a;line-height:1;}
.kpi-sub{font-size:11px;color:var(--blue);margin-top:4px;}
/* PANEL */
.panel{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.panel-head{padding:14px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.panel-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:#0f172a;letter-spacing:.06em;text-transform:uppercase;}
/* TABLE */
table{width:100%;border-collapse:collapse;}
th{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;text-align:left;background:#f8fafc;border-bottom:1px solid var(--border);}
td{padding:11px 16px;font-size:13px;color:#0f172a;border-bottom:1px solid #f8fafc;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#f8fafc;}
/* BADGES */
.badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.04em;white-space:nowrap;display:inline-block;}
.badge-green{background:#dcfce7;color:#15803d;}
.badge-red{background:#fee2e2;color:#b91c1c;}
.badge-yellow{background:#fef9c3;color:#a16207;}
.badge-blue{background:#dbeafe;color:#1d4ed8;}
.badge-gray{background:#f1f5f9;color:#64748b;}
.badge-orange{background:#ffedd5;color:#c2410c;}
.badge-purple{background:#ede9fe;color:#6d28d9;}
/* BTNS */
.btn{padding:7px 16px;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.8px;cursor:pointer;border:1px solid var(--border);background:#fff;color:#334155;transition:all .15s;}
.btn:hover{background:#f1f5f9;}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-primary:hover{background:#1d5a8a;}
.btn-orange{background:var(--orange);color:#fff;border-color:var(--orange);}
.btn-sm{padding:5px 12px;font-size:11px;}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--blue);}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9000;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;border-radius:10px;width:92%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.modal-hdr{background:linear-gradient(135deg,#000 0%,#6b0000 45%,#c2185b 80%,#e91e8c 100%);padding:18px 24px;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:space-between;}
.modal-hdr-title{color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:2px;}
.modal-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;}
.modal-body{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group.full{grid-column:1/3;}
.form-label{font-size:11px;font-weight:600;color:var(--mid);text-transform:uppercase;letter-spacing:1px;}
.form-input{width:100%;padding:9px 12px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:14px;color:#0f172a;font-family:'Barlow',sans-serif;}
.form-input:focus{outline:none;border-color:var(--blue);}
.modal-footer{padding:0 24px 24px;display:flex;gap:10px;justify-content:flex-end;}
/* MOBILE */
.mobile-nav{display:none;}
@media(max-width:768px){
  .sidebar{display:none;}
  .main{margin-left:0;}
  .content{padding:14px 12px 80px;}
  .kpi-row{grid-template-columns:1fr 1fr;gap:10px;}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:60px;background:rgba(0,0,0,0.97);border-top:1px solid rgba(233,30,140,0.2);justify-content:space-around;align-items:center;z-index:200;}
  .mn-tab{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:rgba(168,196,224,0.45);font-size:9px;font-family:'JetBrains Mono',monospace;flex:1;padding:6px 0;}
  .mn-tab svg{width:20px;height:20px;opacity:.6;}
  .mn-tab.active{color:#e91e8c;}
  .mn-tab.active svg{opacity:1;}
}
</style>
</head>
<body>
<script src="nexus-sidebar.js"></script>
<div class="main">
  <div class="topbar">
    <div class="topbar-title">INVOICING</div>
    <div style="display:flex;gap:10px;align-items:center;">
      <div style="display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#22c55e;letter-spacing:1px;"><span style="width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite;display:inline-block;"></span>LIVE</div>
      <button class="btn btn-orange" onclick="openInvModal()">+ Create Invoice</button>
    </div>
  </div>
  <div class="content">
    
<div class="kpi-row">
  <div class="kpi-card"><div class="kpi-label">Total Invoiced</div><div class="kpi-val" id="kpi-invoiced">$0</div><div class="kpi-sub" id="kpi-inv-count">0 invoices</div></div>
  <div class="kpi-card"><div class="kpi-label">Paid</div><div class="kpi-val" id="kpi-paid" style="color:#22c55e;">$0</div><div class="kpi-sub">Collected</div></div>
  <div class="kpi-card"><div class="kpi-label">Pending</div><div class="kpi-val" id="kpi-pending" style="color:#fbbf24;">$0</div><div class="kpi-sub">Awaiting payment</div></div>
  <div class="kpi-card"><div class="kpi-label">Overdue</div><div class="kpi-val" id="kpi-overdue" style="color:#ef4444;">$0</div><div class="kpi-sub">Past due date</div></div>
</div>

<div class="panel">
  <div class="panel-head">
    <span class="panel-title">Invoice Register</span>
    <div style="display:flex;gap:8px;">
      <select id="inv-f-status" onchange="renderInvoices()" class="btn btn-sm">
        <option value="">All Statuses</option><option>Draft</option><option>Sent</option><option>Paid</option><option>Overdue</option>
      </select>
    </div>
  </div>
  <table>
    <thead><tr><th>Invoice #</th><th>Date</th><th>Broker / Customer</th><th>Driver</th><th>Load IDs</th><th style="text-align:right">Amount</th><th>Due Date</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="invoices-tbody"></tbody>
  </table>
</div>

<div class="modal-overlay" id="inv-modal">
  <div class="modal-box" style="max-width:600px;">
    <div class="modal-hdr"><span class="modal-hdr-title" id="inv-modal-title">CREATE INVOICE</span><button class="modal-close" onclick="closeInvModal()">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="inv-edit-id">
      <div class="form-group"><label class="form-label">Invoice # *</label><input type="text" id="inv-num" class="form-input" placeholder="INV-2026-001" required></div>
      <div class="form-group"><label class="form-label">Invoice Date *</label><input type="date" id="inv-date" class="form-input" required></div>
      <div class="form-group full"><label class="form-label">Broker / Customer *</label><input type="text" id="inv-broker" class="form-input" placeholder="e.g. All-Quip, Citation Logistics" required></div>
      <div class="form-group"><label class="form-label">Driver</label>
        <select id="inv-driver" class="form-input">
          <option value="">— Select —</option>
          <option>Avis Modesto</option><option>Miguel Fonseca</option><option>Guillermo Pinera</option>
          <option>David Fonseca</option><option>Nelson</option><option>Yosviel Pinera</option>
        </select></div>
      <div class="form-group"><label class="form-label">Amount *</label><input type="number" id="inv-amount" class="form-input" step="0.01" placeholder="0.00" required></div>
      <div class="form-group full"><label class="form-label">Load IDs</label><input type="text" id="inv-loads" class="form-input" placeholder="L10483, 35544, 332500…"></div>
      <div class="form-group"><label class="form-label">Due Date</label><input type="date" id="inv-due" class="form-input"></div>
      <div class="form-group"><label class="form-label">Status</label>
        <select id="inv-status" class="form-input">
          <option>Draft</option><option>Sent</option><option>Paid</option><option>Overdue</option>
        </select></div>
      <div class="form-group full"><label class="form-label">Notes</label><input type="text" id="inv-notes" class="form-input" placeholder="Payment terms, reference #, etc."></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeInvModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveInvoice()">SAVE INVOICE</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="nexus-config.js"></script>
<script src="nexus-db.js"></script>
<script>
let _invCache = [];
const statusBadge={Draft:'badge-gray',Sent:'badge-blue',Paid:'badge-green',Overdue:'badge-red'};
async function renderInvoices(){
  _invCache = await NexusDB.Invoices.list();
  const sf=document.getElementById('inv-f-status').value;
  const all=_invCache;
  const today=new Date().toISOString().split('T')[0];
  const data=all.filter(i=>sf?i.status===sf:true).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const tbody=document.getElementById('invoices-tbody');
  tbody.innerHTML=data.length?data.map(i=>`<tr>
    <td class="mono" style="font-weight:700;">${i.invoice_number||i.invoiceNo}</td>
    <td class="mono">${i.date}</td><td><b>${i.customer||i.broker}</b></td><td>${i.driver||'—'}</td>
    <td class="mono" style="font-size:11px;">${i.load_ref||i.loads||'—'}</td>
    <td style="text-align:right;font-weight:700;">$${Number(i.amount).toLocaleString('en-US',{minimumFractionDigits:2})}</td>
    <td class="mono">${i.due_date||i.due||'—'}</td>
    <td><span class="badge ${statusBadge[i.status]||'badge-gray'}">${i.status}</span></td>
    <td><button class="btn btn-sm" onclick="editInv('${i.id}')">Edit</button>
        <button class="btn btn-sm" style="color:#ef4444" onclick="delInv('${i.id}')">Del</button></td></tr>`).join('')
  :'<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:32px;">No invoices yet. Click + Create Invoice to start.</td></tr>';
  const total=all.reduce((s,i)=>s+Number(i.amount||0),0);
  const paid=all.filter(i=>i.status==='Paid').reduce((s,i)=>s+Number(i.amount||0),0);
  const pend=all.filter(i=>i.status==='Sent').reduce((s,i)=>s+Number(i.amount||0),0);
  const over=all.filter(i=>i.status==='Overdue'||(i.status==='Sent'&&i.due&&i.due<today)).reduce((s,i)=>s+Number(i.amount||0),0);
  const fmt=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2});
  document.getElementById('kpi-invoiced').textContent=fmt(total);
  document.getElementById('kpi-inv-count').textContent=all.length+' invoices';
  document.getElementById('kpi-paid').textContent=fmt(paid);
  document.getElementById('kpi-pending').textContent=fmt(pend);
  document.getElementById('kpi-overdue').textContent=fmt(over);
}
function openInvModal(){
  document.getElementById('inv-modal-title').textContent='CREATE INVOICE';
  document.getElementById('inv-edit-id').value='';
  const d=new Date();
  // Open modal immediately with fallback number — update async in background
  const fallbackNum='INV-'+Date.now().toString().slice(-6);
  document.getElementById('inv-num').value=fallbackNum;
  document.getElementById('inv-date').value=d.toISOString().split('T')[0];
  document.getElementById('inv-broker').value='';
  document.getElementById('inv-driver').value='';
  document.getElementById('inv-amount').value='';
  document.getElementById('inv-loads').value='';
  document.getElementById('inv-due').value='';
  document.getElementById('inv-notes').value='';
  document.getElementById('inv-status').value='Draft';
  document.getElementById('inv-modal').classList.add('open');
  // Update invoice number from DB without blocking modal
  NexusDB.Invoices.nextNumber().then(function(n){
    if(document.getElementById('inv-modal').classList.contains('open'))
      document.getElementById('inv-num').value=n;
  }).catch(function(){/* keep fallback */});
}
function closeInvModal(){document.getElementById('inv-modal').classList.remove('open');}
async function saveInvoice(){const n=document.getElementById('inv-num').value,dt=document.getElementById('inv-date').value,br=document.getElementById('inv-broker').value,am=document.getElementById('inv-amount').value;if(!n||!dt||!br||!am){alert('Invoice #, Date, Broker and Amount are required.');return;}const editId=document.getElementById('inv-edit-id').value;const rec={invoice_number:n,issue_date:dt,customer:br,driver:document.getElementById('inv-driver').value,amount:parseFloat(am),load_ref:document.getElementById('inv-loads').value,due_date:document.getElementById('inv-due').value||null,status:document.getElementById('inv-status').value,notes:document.getElementById('inv-notes').value};if(editId){await NexusDB.Invoices.update(editId,rec);}else{await NexusDB.Invoices.create(rec);}closeInvModal();await renderInvoices();}
function editInv(id){const i=loadInv().find(x=>x.id===id);if(!i)return;document.getElementById('inv-modal-title').textContent='EDIT INVOICE';document.getElementById('inv-edit-id').value=id;document.getElementById('inv-num').value=i.invoice_number||i.invoiceNo;document.getElementById('inv-date').value=i.date;document.getElementById('inv-broker').value=i.customer||i.broker;document.getElementById('inv-driver').value=i.driver||'';document.getElementById('inv-amount').value=i.amount;document.getElementById('inv-loads').value=i.loads||'';document.getElementById('inv-due').value=i.due||'';document.getElementById('inv-status').value=i.status;document.getElementById('inv-notes').value=i.notes||'';document.getElementById('inv-modal').classList.add('open');}
async function delInv(id){if(confirm('Delete invoice?')){await NexusDB.Invoices.delete(id);await renderInvoices();}}
document.getElementById('inv-modal').addEventListener('click',function(e){if(e.target===this)closeInvModal();});
(async()=>{ if(typeof NexusDB!=='undefined') await NexusDB.Auth.requireAuth().catch(()=>{}); await renderInvoices(); })();
</script>
  </div>
</div>
<nav class="mobile-nav">
  <a href="fleet-command.html" class="mn-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>DASH</a>
  <a href="settlements.html" class="mn-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>PAY</a>
  <a href="documents.html" class="mn-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>DOCS</a>
  <a href="equipment.html" class="mn-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>FLEET</a>
  <a href="drivers.html" class="mn-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>TEAM</a>
</nav>
<style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}</style>
</body>
</html>
