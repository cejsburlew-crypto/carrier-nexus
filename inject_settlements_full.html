<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inject Settlements — Carrier Nexus</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    padding: 2rem;
  }
  h1 { color: #3b82f6; font-size: 1.6rem; margin-bottom: 0.4rem; }
  .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }
  .status-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    font-size: 1.1rem;
    line-height: 1.8;
  }
  .status-card .big { font-size: 1.3rem; font-weight: 700; color: #22c55e; }
  .status-card .label { color: #94a3b8; font-size: 0.85rem; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #1e293b;
    border-radius: 10px;
    overflow: hidden;
  }
  thead tr { background: #0f172a; }
  th {
    padding: 0.75rem 1rem;
    text-align: left;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #94a3b8;
    border-bottom: 1px solid #334155;
  }
  td {
    padding: 0.7rem 1rem;
    border-bottom: 1px solid #1e2d40;
    font-size: 0.9rem;
  }
  tr:last-child td { border-bottom: none; }
  .driver-name { font-weight: 600; color: #e2e8f0; }
  .amount { font-family: monospace; color: #34d399; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge-oo  { background: #7c3aed22; color: #a78bfa; border: 1px solid #7c3aed44; }
  .badge-co  { background: #1d4ed822; color: #60a5fa; border: 1px solid #1d4ed844; }
  .meta { color: #64748b; font-size: 0.78rem; margin-top: 1.5rem; }
</style>
</head>
<body>
<h1>Carrier Nexus — Settlement Injector</h1>
<p class="subtitle">Injects all weekly settlement records Jan 5 – Jun 22, 2026 for all 5 drivers into localStorage.</p>

<div class="status-card" id="statusCard">Loading…</div>

<table id="summaryTable">
  <thead>
    <tr>
      <th>Driver</th>
      <th>Type</th>
      <th>Dispatch</th>
      <th>Weeks</th>
      <th>Total Gross</th>
      <th>Total Net</th>
    </tr>
  </thead>
  <tbody id="summaryBody"></tbody>
</table>

<p class="meta" id="metaLine"></p>

<script>
(function() {
  'use strict';

  // ── Driver definitions ──────────────────────────────────────────────────────
  const DRIVERS = [
    {
      id: 'usr_006', name: 'David Hernandez',
      email: 'david@carriertuckingus.com',
      dispatchRate: 0.14, driverIdx: 0,
      type: 'company',
      ratePool: [1800,1950,2100,2250,2400,2600,2800,3000,3200],
      routes: [
        ['Tampa, FL','Atlanta, GA'],
        ['Tampa, FL','Charlotte, NC'],
        ['Tampa, FL','Dallas, TX'],
        ['Miami, FL','Nashville, TN'],
        ['Jacksonville, FL','Memphis, TN']
      ]
    },
    {
      id: 'usr_005', name: 'Avis',
      email: 'avis@carriertuckingus.com',
      dispatchRate: 0.14, driverIdx: 1,
      type: 'company',
      ratePool: [1200,1350,1500,1650,1800,1950,2100,2250,2400],
      routes: [
        ['Tampa, FL','Orlando, FL'],
        ['Tampa, FL','Jacksonville, FL'],
        ['Tampa, FL','Birmingham, AL'],
        ['Tampa, FL','Nashville, TN']
      ]
    },
    {
      id: 'usr_008', name: 'Nelson',
      email: 'nelson@carriertuckingus.com',
      dispatchRate: 0.14, driverIdx: 2,
      type: 'company',
      ratePool: [1600,1750,1900,2100,2300,2500,2700,2900],
      routes: [
        ['Tampa, FL','Houston, TX'],
        ['Tampa, FL','Memphis, TN'],
        ['Tampa, FL','Atlanta, GA'],
        ['Jacksonville, FL','Dallas, TX']
      ]
    },
    {
      id: 'usr_009', name: 'Yosviel',
      email: 'yosviel@carriertuckingus.com',
      dispatchRate: 0.14, driverIdx: 3,
      type: 'company',
      ratePool: [1100,1250,1400,1550,1700,1900,2000,2200],
      routes: [
        ['Tampa, FL','Miami, FL'],
        ['Tampa, FL','Orlando, FL'],
        ['Tampa, FL','Savannah, GA'],
        ['Tampa, FL','Charlotte, NC']
      ]
    },
    {
      id: 'usr_010', name: 'Guillermo Pinera',
      email: 'guillermo@carriertuckingus.com',
      dispatchRate: 0.13, driverIdx: 4,
      type: 'owner-operator',
      ratePool: [2200,2500,2800,3100,3400,3700,4000,4200,4500],
      routes: [
        ['Tampa, FL','Dallas, TX'],
        ['Tampa, FL','Charlotte, NC'],
        ['Miami, FL','Atlanta, GA'],
        ['Tampa, FL','Nashville, TN']
      ]
    }
  ];

  // ── Week definitions ─────────────────────────────────────────────────────────
  const WEEKS = [
    {idx:0,  start:'2026-01-05', end:'2026-01-11', label:'Mon 01/05/2026 – Sun 01/11/2026'},
    {idx:1,  start:'2026-01-12', end:'2026-01-18', label:'Mon 01/12/2026 – Sun 01/18/2026'},
    {idx:2,  start:'2026-01-19', end:'2026-01-25', label:'Mon 01/19/2026 – Sun 01/25/2026'}, // MLK
    {idx:3,  start:'2026-01-26', end:'2026-02-01', label:'Mon 01/26/2026 – Sun 02/01/2026'},
    {idx:4,  start:'2026-02-02', end:'2026-02-08', label:'Mon 02/02/2026 – Sun 02/08/2026'},
    {idx:5,  start:'2026-02-09', end:'2026-02-15', label:'Mon 02/09/2026 – Sun 02/15/2026'},
    {idx:6,  start:'2026-02-16', end:'2026-02-22', label:'Mon 02/16/2026 – Sun 02/22/2026'},
    {idx:7,  start:'2026-02-23', end:'2026-03-01', label:'Mon 02/23/2026 – Sun 03/01/2026'},
    {idx:8,  start:'2026-03-02', end:'2026-03-08', label:'Mon 03/02/2026 – Sun 03/08/2026'},
    {idx:9,  start:'2026-03-09', end:'2026-03-15', label:'Mon 03/09/2026 – Sun 03/15/2026'},
    {idx:10, start:'2026-03-16', end:'2026-03-22', label:'Mon 03/16/2026 – Sun 03/22/2026'},
    {idx:11, start:'2026-03-23', end:'2026-03-29', label:'Mon 03/23/2026 – Sun 03/29/2026'},
    {idx:12, start:'2026-03-30', end:'2026-04-05', label:'Mon 03/30/2026 – Sun 04/05/2026'},
    {idx:13, start:'2026-04-06', end:'2026-04-12', label:'Mon 04/06/2026 – Sun 04/12/2026'},
    {idx:14, start:'2026-04-13', end:'2026-04-19', label:'Mon 04/13/2026 – Sun 04/19/2026'},
    {idx:15, start:'2026-04-20', end:'2026-04-26', label:'Mon 04/20/2026 – Sun 04/26/2026'},
    {idx:16, start:'2026-04-27', end:'2026-05-03', label:'Mon 04/27/2026 – Sun 05/03/2026'},
    {idx:17, start:'2026-05-04', end:'2026-05-10', label:'Mon 05/04/2026 – Sun 05/10/2026'},
    {idx:18, start:'2026-05-11', end:'2026-05-17', label:'Mon 05/11/2026 – Sun 05/17/2026'},
    {idx:19, start:'2026-05-18', end:'2026-05-24', label:'Mon 05/18/2026 – Sun 05/24/2026'},
    {idx:20, start:'2026-05-25', end:'2026-05-31', label:'Mon 05/25/2026 – Sun 05/31/2026'}, // Memorial Day
    {idx:21, start:'2026-06-01', end:'2026-06-07', label:'Mon 06/01/2026 – Sun 06/07/2026'},
    {idx:22, start:'2026-06-08', end:'2026-06-14', label:'Mon 06/08/2026 – Sun 06/14/2026'},
    {idx:23, start:'2026-06-15', end:'2026-06-21', label:'Mon 06/15/2026 – Sun 06/21/2026'},
    {idx:24, start:'2026-06-22', end:'2026-06-28', label:'Mon 06/22/2026 – Sun 06/28/2026'}
  ];

  // ── Deterministic helpers ────────────────────────────────────────────────────
  function det(weekIdx, driverIdx, salt) {
    return Math.abs((weekIdx * 7 + driverIdx * 13 + (salt || 0)));
  }

  // Date helpers
  function addDays(isoDate, n) {
    const d = new Date(isoDate + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function paidFriday(weekStart) {
    // Friday of the FOLLOWING week: weekStart + 7 (next Mon) + 4 (Fri)
    return addDays(weekStart, 11);
  }

  // Advance a date by N weekdays starting from weekStart + offset
  function pickupDate(weekStart, offset) {
    // offset 0-4 → Mon-Fri of that week
    return addDays(weekStart, offset);
  }

  // ── Load count logic ─────────────────────────────────────────────────────────
  function loadCount(driver, weekIdx) {
    const wi = weekIdx;
    const di = driver.driverIdx;

    // Holiday overrides
    const isMLK = (wi === 2);
    const isMemorial = (wi === 20);

    if (isMLK) {
      if (di === 1 || di === 3) return 0; // Avis, Yosviel
      return 1 + (det(wi, di, 0) % 2); // 1 or 2
    }
    if (isMemorial) {
      return 1 + (det(wi, di, 1) % 2); // 1 or 2
    }

    // Normal weeks
    if (di === 0) return 3 + (det(wi, 0, 2) % 2);          // David: 3 or 4
    if (di === 1) { const v = det(wi,1,3)%3; return v<2?2:3; } // Avis: 2 or 3
    if (di === 2) return 3 + (det(wi,2,4) % 2);             // Nelson: 3 or 4
    if (di === 3) { const v = det(wi,3,5)%3; return v<2?2:3; } // Yosviel: 2 or 3
    if (di === 4) { const v = det(wi,4,6)%3; return v===0?2:v===1?3:4; } // Guillermo: 2,3,4
    return 2;
  }

  // ── Deduction builder ────────────────────────────────────────────────────────
  function buildDeductions(driver, weekIdx) {
    const di = driver.driverIdx;
    const deductions = [];

    if (di === 0) { // David
      const fuelAmounts = [150, 200, 250];
      deductions.push({ description: 'Fuel advance', amount: fuelAmounts[weekIdx % 3] });
      if (weekIdx % 5 === 0) {
        const repairAmounts = [150, 200, 250, 300, 350];
        deductions.push({ description: 'Repair', amount: repairAmounts[det(weekIdx, di, 10) % 5] });
      }
    } else if (di === 1) { // Avis
      const fuelAmounts = [100, 150];
      deductions.push({ description: 'Fuel advance', amount: fuelAmounts[weekIdx % 2] });
    } else if (di === 2) { // Nelson
      const fuelAmounts = [150, 200];
      deductions.push({ description: 'Fuel advance', amount: fuelAmounts[weekIdx % 2] });
    } else if (di === 3) { // Yosviel
      if (weekIdx % 2 === 0) {
        deductions.push({ description: 'Fuel advance', amount: 100 });
      }
    } else if (di === 4) { // Guillermo
      if (weekIdx % 4 === 2) {
        const balAmounts = [300, 350, 400, 450, 500, 550, 600];
        deductions.push({ description: 'Balance forward', amount: balAmounts[det(weekIdx, di, 20) % 7] });
      }
    }

    return deductions;
  }

  // ── Main record generator ────────────────────────────────────────────────────
  function generateRecords() {
    const records = [];

    for (const week of WEEKS) {
      for (const driver of DRIVERS) {
        const wi = week.idx;
        const di = driver.driverIdx;
        const nLoads = loadCount(driver, wi);

        if (nLoads === 0) continue; // skip 0-load weeks

        const loads = [];
        const pickupOffsets = [1, 2, 3, 4, 0]; // Mon=1 of week (Mon start), Tue=2…
        // Spread loads through the week
        for (let li = 0; li < nLoads; li++) {
          const rateIdx = det(wi * 7 + li * 3, di, li) % driver.ratePool.length;
          const rate = driver.ratePool[rateIdx];
          const routeIdx = det(wi + li * 2, di, li + 5) % driver.routes.length;
          const route = driver.routes[routeIdx];
          const dayOffset = (li * 2) % 5; // spread: day 0,2,4 of week
          loads.push({
            id: `LOAD-D${driver.id.replace('usr_', '').padStart(3,'0')}-W${String(wi+1).padStart(2,'0')}-${String(li+1).padStart(2,'0')}`,
            origin: route[0],
            destination: route[1],
            pickup_date: addDays(week.start, dayOffset),
            rate: rate
          });
        }

        const gross = loads.reduce((s, l) => s + l.rate, 0);
        const dispatchFee = Math.round(gross * driver.dispatchRate * 100) / 100;
        const deductions = buildDeductions(driver, wi);
        const totalDeductions = Math.round((dispatchFee + deductions.reduce((s, d) => s + d.amount, 0)) * 100) / 100;
        const net = Math.round((gross - totalDeductions) * 100) / 100;

        let status, paid_date;
        if (wi <= 22) {
          status = 'paid';
          paid_date = paidFriday(week.start);
        } else if (wi === 23) {
          status = 'approved';
          paid_date = null;
        } else {
          status = 'pending';
          paid_date = null;
        }

        const record = {
          id: `settle_${driver.id}_${week.start}`,
          driverId: driver.id,
          driverName: driver.name,
          driverEmail: driver.email,
          weekMonday: week.start,
          week_start: week.start,
          weekLabel: week.label,
          week_label: week.label,
          week_end: week.end,
          loads: loads,
          gross: gross,
          dispatch_rate: driver.dispatchRate,
          dispatch_fee: dispatchFee,
          deductions: deductions,
          totalDeductions: totalDeductions,
          total_deductions: totalDeductions,
          net: net,
          status: status,
          paid_date: paid_date,
          notes: '',
          created_at: week.start + 'T09:00:00Z'
        };

        records.push(record);
      }
    }

    return records;
  }

  // ── Migrate existing records to canonical schema ───────────────────────────
  function migrateExistingRecords() {
    var existing = JSON.parse(localStorage.getItem('nexus_settlements') || '[]');
    var changed = 0;
    existing = existing.map(function(s) {
      var updated = false;
      if (!s.weekMonday && s.week_start) { s.weekMonday = s.week_start; updated = true; }
      if (!s.weekLabel && s.week_label) { s.weekLabel = s.week_label; updated = true; }
      if (!s.totalDeductions && s.total_deductions) { s.totalDeductions = s.total_deductions; updated = true; }
      if (updated) changed++;
      return s;
    });
    if (changed > 0) {
      localStorage.setItem('nexus_settlements', JSON.stringify(existing));
    }
    return changed;
  }

  // ── Inject into localStorage ────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function() {
    var migrated = migrateExistingRecords();
    const newRecords = generateRecords();

    let existing = [];
    try {
      existing = JSON.parse(localStorage.getItem('nexus_settlements') || '[]');
      if (!Array.isArray(existing)) existing = [];
    } catch(e) { existing = []; }

    const existingIds = new Set(existing.map(r => r.id));
    const toInject = newRecords.filter(r => !existingIds.has(r.id));
    const merged = existing.concat(toInject);

    localStorage.setItem('nexus_settlements', JSON.stringify(merged));

    const skipped = newRecords.length - toInject.length;

    // Status card
    document.getElementById('statusCard').innerHTML =
      '<span class="big">✅ Injected ' + toInject.length + ' new settlement records.</span><br>' +
      'Total in localStorage: <strong>' + merged.length + '</strong> &nbsp;&nbsp;|&nbsp;&nbsp; ' +
      'Duplicates skipped: <strong>' + skipped + '</strong> &nbsp;&nbsp;|&nbsp;&nbsp; ' +
      'Records generated this run: <strong>' + newRecords.length + '</strong> &nbsp;&nbsp;|&nbsp;&nbsp; ' +
      'Migrated existing: <strong>' + migrated + '</strong> records to new schema';

    // Summary table
    const driverTotals = {};
    for (const r of newRecords) {
      if (!driverTotals[r.driverId]) {
        driverTotals[r.driverId] = {
          name: r.driverName,
          type: DRIVERS.find(d => d.id === r.driverId).type,
          dispatchRate: r.dispatch_rate,
          weeks: 0,
          gross: 0,
          net: 0
        };
      }
      driverTotals[r.driverId].weeks++;
      driverTotals[r.driverId].gross += r.gross;
      driverTotals[r.driverId].net += r.net;
    }

    const fmt = n => '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    const tbody = document.getElementById('summaryBody');
    for (const [driverId, t] of Object.entries(driverTotals)) {
      const row = document.createElement('tr');
      const badgeClass = t.type === 'owner-operator' ? 'badge-oo' : 'badge-co';
      const badgeLabel = t.type === 'owner-operator' ? 'O/O' : 'Company';
      row.innerHTML =
        '<td class="driver-name">' + t.name + '</td>' +
        '<td><span class="badge ' + badgeClass + '">' + badgeLabel + '</span></td>' +
        '<td>' + (t.dispatchRate * 100).toFixed(0) + '%</td>' +
        '<td>' + t.weeks + '</td>' +
        '<td class="amount">' + fmt(t.gross) + '</td>' +
        '<td class="amount">' + fmt(t.net) + '</td>';
      tbody.appendChild(row);
    }

    // Totals row
    const totalGross = Object.values(driverTotals).reduce((s,t)=>s+t.gross,0);
    const totalNet   = Object.values(driverTotals).reduce((s,t)=>s+t.net,0);
    const totalWeeks = Object.values(driverTotals).reduce((s,t)=>s+t.weeks,0);
    const totRow = document.createElement('tr');
    totRow.style.fontWeight = '700';
    totRow.style.borderTop = '2px solid #3b82f6';
    totRow.innerHTML =
      '<td>ALL DRIVERS</td><td></td><td></td>' +
      '<td>' + totalWeeks + '</td>' +
      '<td class="amount">' + fmt(totalGross) + '</td>' +
      '<td class="amount">' + fmt(totalNet) + '</td>';
    tbody.appendChild(totRow);

    document.getElementById('metaLine').textContent =
      'nexus_settlements key updated • ' + new Date().toLocaleString();
  });
})();
</script>
</body>
</html>
